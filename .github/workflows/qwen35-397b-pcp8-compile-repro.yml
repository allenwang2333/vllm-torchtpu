name: CI - Qwen3.5 397B PCP8 GDN Compile Reproduction on TPU

on:
  workflow_call:
    inputs:
      halt_for_connection:
        description: 'Should this workflow wait for a remote connection?'
        type: string
        default: 'no'
  workflow_dispatch:
    inputs:
      halt_for_connection:
        description: 'Should this workflow wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'

permissions:
  contents: read

jobs:
  qwen35-397b-pcp8-compile-repro:
    name: Qwen3.5 397B PCP8 Compile (${{ matrix.case.label }})
    if: github.repository == 'google-pytorch/torchtpu-vllm'
    runs-on: linux-x86-tpu7x-224-4tpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case:
          - mode: split
            label: GDN split, expect healthy
            expected_outcome: healthy
          - mode: full
            label: full graph, reproduce CoreHalt
            expected_outcome: core_halt
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest
      options: --privileged --net=host --shm-size=16g --device /dev/fuse
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        UV_INDEX_TORCH_TPU_REGISTRY_USERNAME: oauth2accesstoken

    env:
      FORCE_COLOR: "1"
      UV_NO_CACHE: "1"
      TQDM_MININTERVAL: "30"
      # The model config is checked into the repository; network model access
      # would hide an accidental fixture regression and waste CI time.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt_for_connection || 'no' }}

      - name: Setup Virtual Environment
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Keyring for Auth
        run: |
          uv pip install --no-config --index-url https://pypi.org/simple keyring keyrings.google-artifactregistry-auth
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"

      - name: Install torchtpu-vllm
        run: uv pip install ".[test]"

      - name: Run Qwen3.5 397B PCP8 compile reproduction
        env:
          EXPECTED_OUTCOME: ${{ matrix.case.expected_outcome }}
          RUN_ROOT: /tmp/qwen35_397b_pcp8_compile_repro/${{ matrix.case.mode }}
        run: |
          bash scripts/vllm/integration/run_qwen35_397b_pcp8_compile_repro.sh \
            "${{ matrix.case.mode }}"

      - name: Upload compile reproduction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-397b-pcp8-compile-${{ matrix.case.mode }}-logs
          path: /tmp/qwen35_397b_pcp8_compile_repro/${{ matrix.case.mode }}/
          retention-days: 14
          if-no-files-found: warn
