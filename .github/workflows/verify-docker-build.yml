name: CI - Verify Docker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/verify-docker-build.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/verify-docker-build.yml'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ml-oss-artifacts-transient
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: torch-tpu-vllm-testing-registry
  IMAGE_NAME: torchtpu-vllm-verify
  WIF_PROVIDER: projects/102295818544/locations/global/workloadIdentityPools/gitsec-gha-artifacts/providers/gitsec-gha-artifacts-provider

jobs:
  verify_build:
    name: Verify Production Docker Build
    if: github.event.repository.fork == false
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # ratchet:google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Verify Build with Google Cloud Build
        run: |
          # 1. Generate cloudbuild.yaml on the fly (verification build only, no push)
          cat << 'EOF' > cloudbuild.yaml
          steps:
          - name: 'gcr.io/cloud-builders/docker'
            entrypoint: 'bash'
            args:
            - '-c'
            - |
              echo -n "$_ACCESS_TOKEN" > /tmp/gcloud_token
              export DOCKER_BUILDKIT=1

              docker build \
                -f ./docker/Dockerfile \
                -t torchtpu-vllm-verify:test \
                --build-arg USE_TORCH_TPU_REGISTRY=1 \
                --secret id=gcloud_token,src=/tmp/gcloud_token \
                .
          EOF

          # 2. Submit the build to GCP Cloud Build
          gcloud builds submit \
            --quiet \
            --project ${{ env.PROJECT_ID }} \
            --billing-project ${{ env.PROJECT_ID }} \
            --region ${{ env.GAR_LOCATION }} \
            --config cloudbuild.yaml \
            --substitutions=_ACCESS_TOKEN="$(gcloud auth print-access-token)" \
            --gcs-source-staging-dir="gs://torch-tpu-vllm-ci-transient/docker-build-staging/source" \
            --gcs-log-dir="gs://torch-tpu-vllm-ci-transient/docker-build-staging/logs" \
            .
