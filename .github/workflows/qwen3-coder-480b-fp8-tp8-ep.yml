name: CI - Perf and Eval Nightly (qwen3-coder-480b-fp8-tp8-ep)

on:
  schedule:
    - cron: '0 10 * * *' # 10 AM UTC, after nightly build
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-eval-nightly:
    name: "Perf and Eval Nightly: 480B"
    runs-on: linux-x86-tpu7x-224-4tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest
      options: --privileged --net=host --shm-size=16g --device /dev/fuse
      env:
        HF_HOME: /local_hf_cache
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        UV_INDEX_TORCH_TPU_REGISTRY_USERNAME: oauth2accesstoken
    timeout-minutes: 360

    env:
      FORCE_COLOR: "1"
      UV_NO_CACHE: "1"
      TQDM_MININTERVAL: "30"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Keyring for Auth
        run: |
          uv pip install --system --no-config --index-url https://pypi.org/simple keyring keyrings.google-artifactregistry-auth
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"

      - name: Install crc32c for gsutil
        run: |
          uv pip install --system crc32c

      - name: Copy model to local cache
        # Use gsutil with multi-threading for faster download
        run: |
          mkdir -p /local_hf_cache/hub
          gsutil -m cp -r gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-480B-A35B-Instruct-FP8/ /local_hf_cache/hub/

      - name: Run 480B nightly perf and eval
        shell: bash
        env:
          MODEL_IMPL_TYPE: vllm
          EVALPLUS_DATASETS: "humaneval mbpp"
          EVALPLUS_PARALLEL: "8"
        run: |
          uv pip install --system ".[test,benchmarking]"
          bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-coder-480b-fp8-tp8-ep --run-lm-eval --run-evalplus

      - name: Stage artifacts for upload
        if: always()
        # Copy files to workspace to avoid path traversal error in 'gh run download'
        run: |
          mkdir -p perf_eval_results
          cp -r /tmp/perf_eval_* perf_eval_results/ || true

      - name: Upload nightly JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-eval-nightly-results-qwen3-coder-480b-fp8-tp8-ep
          path: perf_eval_results/
          retention-days: 30
          if-no-files-found: warn
