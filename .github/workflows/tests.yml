name: Run Tests on TPU

on:
  workflow_call:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'



jobs:
  run_tests:
    name: "Tests on ${{ matrix.job_info.runner }}"
    strategy:
      matrix:
        job_info: [
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            container: "us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest",
          }
        ]
        python-version: [3.12]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
      options: --privileged --net=host --shm-size=16g

    env:
      FORCE_COLOR: "1"
      # Disable UV cache to save disk space on self-hosted runners
      UV_NO_CACHE: "1"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          # /dev/shm is too small on K8s runners; symlink to disk so the
          # tier-2 compilation cache still works without filling tmpfs.
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Mount GCS bucket via gcsfuse
        run: |
          mkdir -p /root/.cache/huggingface
          gcsfuse --implicit-dirs hf-llm-model-checkpoints /root/.cache/huggingface

      - name: Setup UV Auth Env Vars
        run: |
          # UV uses these to auth into the torch-tpu index defined in pyproject.toml
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"
          echo UV_INDEX_TORCH_TPU_REGISTRY_PASSWORD="$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: Install torchtpu-vllm from source
        run: uv pip install --system --prerelease allow ".[test]"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Run tests
        run: |
          echo "Installed packages:"
          uv pip freeze

          export MODEL_IMPL_TYPE="vllm"

          # Run tests from a temp dir to force Python to test the installed package, not local source files.
          TEST_DIR="$PWD/tests"
          cd "$(mktemp -d)"
          pytest "$TEST_DIR" -sv --timeout=300 -m "not nightly"
