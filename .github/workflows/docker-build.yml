name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: cloud-tpu-inference-test
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: mhhua-dev
  IMAGE_NAME: torchtpu-vllm

jobs:
  build-and-push:
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate short SHA tag
        id: vars
        run: |
          # Use the PR head SHA if available, otherwise fallback to the commit SHA
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SHORT_SHA=$(echo "$SHA" | cut -c1-8)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.short_sha }}
            type=ref,event=pr
            type=ref,event=branch

      - name: Build and Push with Google Cloud Build
        run: |
          # The local runner is too restricted to run container engines (mount permissions denied).
          # We will outsource the build to Google Cloud Build, which has full Docker/BuildKit support!

          # 1. Get the tags from metadata step
          TAGS="${{ steps.meta.outputs.tags }}"

          # Convert newline separated TAGS into space separated string for substitution
          ALL_TAGS_SPACES=$(echo "$TAGS" | tr '\n' ' ')

          # 2. Generate a cloudbuild.yaml on the fly
          cat << 'EOF' > cloudbuild.yaml
          steps:
          - name: 'gcr.io/cloud-builders/docker'
            entrypoint: 'bash'
            args:
            - '-c'
            - |
              # Use the access token provided from the GitHub Runner
              echo -n "$_ACCESS_TOKEN" > /tmp/gcloud_token

              # Enable BuildKit
              export DOCKER_BUILDKIT=1

              # Prepare multiple -t arguments for the build command
              BUILD_ARGS=()
              for tag in $_ALL_TAGS; do
                BUILD_ARGS+=("-t" "$$tag")
              done

              # Build the image using the full Docker daemon on Cloud Build
              docker build \
                -f ./docker/Dockerfile \
                "${BUILD_ARGS[@]}" \
                --build-arg USE_TORCH_TPU_REGISTRY=1 \
                --secret id=gcloud_token,src=/tmp/gcloud_token \
                .

              # Push all generated tags
              for tag in $_ALL_TAGS; do
                docker push "$$tag"
              done
          EOF

          # 3. Submit the build to GCP
          gcloud builds submit \
            --quiet \
            --project ${{ env.PROJECT_ID }} \
            --billing-project ${{ env.PROJECT_ID }} \
            --region ${{ env.GAR_LOCATION }} \
            --config cloudbuild.yaml \
            --substitutions=_ALL_TAGS="$ALL_TAGS_SPACES",_ACCESS_TOKEN="$(gcloud auth print-access-token)" \
            --gcs-source-staging-dir="gs://mhhua-tt-dev/docker-build-staging/source" \
            --gcs-log-dir="gs://mhhua-tt-dev/docker-build-staging/logs" \
            .
