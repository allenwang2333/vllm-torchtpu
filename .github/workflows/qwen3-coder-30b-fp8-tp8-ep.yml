name: CI - Perf and Eval Guard (qwen3-coder-30b-fp8-tp8-ep)

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            src:
              - '!**.md'
              - '!docs/**'
              - '!docker/**'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.pre-commit-config.yaml'
              - '!.readthedocs.yaml'
              - '!mkdocs.yml'
              - '!LICENSE'
              - '!DCO'
              - '!MANIFEST.in'

  perf-eval-guard:
    name: "Perf and Eval Guard (qwen3-coder-30b-fp8-tp8-ep)"
    needs: check_changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.check_changes.outputs.should_run == 'true')
    runs-on: linux-x86-tpu7x-224-4tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest
      options: --privileged --net=host --shm-size=16g --device /dev/fuse
      env:
        HF_HOME: /local_hf_cache
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        UV_INDEX_TORCH_TPU_REGISTRY_USERNAME: oauth2accesstoken
    timeout-minutes: 180

    env:
      FORCE_COLOR: "1"
      UV_NO_CACHE: "1"
      TQDM_MININTERVAL: "30"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Save installed packages list
        run: uv pip list > /tmp/perf_eval_pip_list.txt

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Setup Keyring for Auth
        run: |
          uv pip install --system --no-config --index-url https://pypi.org/simple keyring keyrings.google-artifactregistry-auth
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"

      - name: Copy model to local cache
        # Use gsutil with multi-threading for faster download
        run: |
          mkdir -p /local_hf_cache/hub
          gsutil -m cp -r gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-30B-A3B-Instruct-FP8/ /local_hf_cache/hub/

      - name: Run perf and eval guard configs
        shell: bash
        env:
          MODEL_IMPL_TYPE: vllm
          BENCHMARK_WARMUP_RUNS: "1"
        run: |
          uv pip install --system ".[test,benchmarking]"
          bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-coder-30b-fp8-tp8-ep --run-lm-eval

      - name: Stage artifacts for upload
        if: always()
        # Copy files to workspace to avoid path traversal error in 'gh run download'
        run: |
          mkdir -p perf_eval_results
          cp -r /tmp/perf_eval_* perf_eval_results/ || true

      - name: Upload guard JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-eval-guard-results-qwen3-coder-30b-fp8-tp8-ep
          path: perf_eval_results/
          retention-days: 14
          if-no-files-found: warn
