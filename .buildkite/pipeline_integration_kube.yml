# Diagnostic branch only, not for merge: the kube integration lane cut down to
# one step that boots the compilation-cache-e2e model repeatedly with
# TORCH_TRACE set. Run with CI_FLEET=kube CI_LANES=integration.
env:
  ARTIFACTS_DIR: "perf_eval_results"

x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

x-shape-2-core: &shape_2_core "tpu7x-standard-1t/1x1x1"

steps:
  - label: ":kubernetes: Diag: compilation-cache flake"
    key: "diag_compilation_cache_flake"
    depends_on:
      - "build_docker"
    concurrency_group: "tpu/v7x"
    concurrency: 12
    timeout_in_minutes: 180
    parallelism: 4
    agents:
      queue: "kube"
    env:
      SHAPE: *shape_2_core
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/kubernetes/run.sh bash ./scripts/vllm/integration/diag_compilation_cache_flake.sh
