# tpu7x-32 fleet smoke: one basic job per agent on tpu_v7x_32_queue.
# Each job brings up the Ray cluster across the 4 hosts of its slice and
# checks every host can see its 4 chips (jax.devices() reports 8 devices per
# host on tpu7x: 2 TensorCores per chip).

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "tpu7x-32 smoke: jax.devices() on every host (pinned tpu7x-32-ci-0)"
    key: smoke_ci_0
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: "tpu_v7x_32_queue"
      hostname: "tpu7x-32-ci-0-cicd-us-central1-c"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh python3 .buildkite/scripts/tpu_slice_smoke.py --hosts 4 --devices-per-host 8"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "tpu7x-32 smoke: jax.devices() on every host (pinned tpu7x-32-ci-1)"
    key: smoke_ci_1
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: "tpu_v7x_32_queue"
      hostname: "tpu7x-32-ci-1-cicd-us-central1-c"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh python3 .buildkite/scripts/tpu_slice_smoke.py --hosts 4 --devices-per-host 8"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "tpu7x-32 smoke: jax.devices() on every host (any agent)"
    key: smoke_any
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh python3 .buildkite/scripts/tpu_slice_smoke.py --hosts 4 --devices-per-host 8"
    artifact_paths:
      - "perf_eval_results/**/*"
