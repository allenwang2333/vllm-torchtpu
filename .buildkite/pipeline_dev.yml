# PR #170 A/B evidence — AFTER arms.
# This branch is c94523a3c (the #170 merge commit) plus this test harness
# only. See scripts/vllm/benchmarking/pr170_ab/.
#
# Arm "after": #170 as merged (unified pool auto-enabled for Qwen3.5).
# Arm "after_pool_off": same image, TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL=0 —
# isolates the pool default flip from the rest of the PR's code changes.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 A/B: after @ c94523a3c (#170, pool on)"
    key: ab_after
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_ab_test.sh after
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "PR170 A/B: after @ c94523a3c (#170, pool forced OFF)"
    key: ab_after_pool_off
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_ab_test.sh after_pool_off
    artifact_paths:
      - "perf_eval_results/**/*"
