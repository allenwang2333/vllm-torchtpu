# Scoping run for a KDA (gdn/v3) kernel optimization campaign.
#
#   kda_micro  the multi-arm microbenchmark that would be the campaign's
#              fitness function: golden as the control, a second copy of golden
#              on the same clock, and five injected faults it has to catch.
#              Three replicates, because one A/A pair is not a noise floor.
#   kda_e2e    the workload the campaign exists to improve: the reproduce
#              recipe verbatim, the same recipe under the profiler (for the
#              kernel's share of step time), and the same recipe with the
#              kernel's two launches replaced by a zero of the same shape --
#              the latency floor an infinitely fast kernel would reach.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # Three agents at once, which is this run's whole share of the queue -- so
  # the e2e step below waits for them rather than running beside them.
  - label: "KDA scorer: 7 arms x 4 configs (replicate {{matrix}}) (v7x-2)"
    key: kda_micro
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_2_queue
    matrix: ["1", "2", "3"]
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'REPLICATE={{matrix}} bash bench/kda_arms.sh'
    artifact_paths:
      - "perf_eval_results/**/*"

  # Seven boots of a 48B model, so it takes a whole v7x-8 agent for about an
  # hour. It waits for the microbenchmark rather than running beside it: three
  # v7x-2 agents plus this one is more of a shared queue than one run should
  # hold. `allow_failure` because the two measure different things -- a broken
  # scorer is no reason to skip the workload's own numbers.
  - label: "KDA e2e: 3x baseline + 3x null kernel + profile, Kimi-Linear-48B TP8 (v7x-8)"
    key: kda_e2e
    depends_on:
      - build_docker
      - step: kda_micro
        allow_failure: true
    timeout_in_minutes: 150
    # No agent pin: any v7x-8 agent can run this. One whose model cache is
    # cold pays a 98 GB download before the first boot, so allow for it in the
    # timeout rather than pinning the job to the machine that happens to be warm.
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'PHASES="baseline nullkernel baseline nullkernel baseline nullkernel profile" bash bench/kda_e2e.sh; rc=$$?; python3 bench/xplane_op_share.py --dir /perf_eval_results/kda-e2e/profile --match "fused_conv1d_kda" --top 30 --out /perf_eval_results/kda-e2e/op-share.json || echo "no op shares"; rm -rf /perf_eval_results/kda-e2e/profile; exit $$rc'
    artifact_paths:
      - "perf_eval_results/**/*"
