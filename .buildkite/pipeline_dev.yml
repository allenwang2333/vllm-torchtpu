# Multi-host bring-up for tt, stage 2: serve a model across a whole slice.
#
# Kimi-Linear-48B rather than K3 on purpose. tt maps BOTH architectures to the
# same class (`models/vllm/__init__.py`: KimiLinearForCausalLM and
# KimiK3ForConditionalGeneration -> models/vllm/kimi_k3), so this exercises the
# identical KDA/MoE/MLA code path K3 uses, from a 98 GB checkpoint instead of
# 1561 GB. K3's checkpoint stream is what forces the 4-hour startup budget in
# tpu-inference-dev build 775; keeping it out of the loop means a failure here
# is the multi-host launcher, not the model.
#
# tpu_v7x_16_queue, not the 32 pod: those agents are CI-owned, whereas the
# tpu7x-32 slice belongs to ranlihao and its queue gets paused.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":rocket: tpu7x-16 multi-host Kimi-Linear-48B serve + bench"
    key: tpu7x_16_kimi_linear
    depends_on: build_docker
    timeout_in_minutes: 120
    agents:
      queue: tpu_v7x_16_queue
    env:
      # Weights stream from GCS at serve time; 98 GB over 2 hosts is minutes,
      # but leave headroom so a slow read fails as a real error rather than a
      # launcher timeout. (K3 needs 14400 here -- 1561 GB.)
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      # The CI image sets this to 1, which makes any compile at request time
      # fatal. The bench serves shapes the warmup sweep does not cover.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/linear-48b \
            --served-model-name moonshotai/Kimi-Linear \
            --port 8000 \
            --tensor-parallel-size 16 \
            --enable-expert-parallel \
            --max-model-len 9216 \
            --max-num-batched-tokens 512 \
            --max-num-seqs 1 \
            --attention-backend CUSTOM \
            --trust-remote-code \
            --no-enable-prefix-caching \
            --no-async-scheduling \
            --load-format runai_streamer \
            --gpu-memory-utilization 0.9" \
          "vllm bench serve \
            --host 127.0.0.1 --port 8000 \
            --model moonshotai/Kimi-Linear \
            --trust-remote-code \
            --dataset-name random \
            --random-input-len 8192 \
            --random-output-len 1024 \
            --random-range-ratio 0.8 \
            --num-prompts 10 \
            --max-concurrency 1 \
            --ignore-eos --seed 42 \
            --percentile-metrics ttft,tpot,itl,e2el \
            --metric-percentiles 50,90,99"
