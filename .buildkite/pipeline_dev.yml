# Dev pipeline for vllm-torchtpu-dev.
# Demo/sample steps showing how to run one-off experiments on TPU.
# Copy and adapt any step below for your own test.
#
# WHY THIS EXISTS
# ───────────────
# vllm-torchtpu-ci runs the full suite (~build + unit tests + integration +
# perf) on every push, which is slow and shared. This pipeline uploads ONLY the
# steps on YOUR branch, so a single test costs one image build + one job.
#
# HOW TO TRIGGER
# ──────────────
# Option A — Buildkite UI:
#   https://buildkite.com/tpu-commons/vllm-torchtpu-dev → "New Build",
#   set branch to your branch, "Create Build".
#
# Option B — Buildkite API (needs BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/vllm-torchtpu-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ────────────────
# 1. On your branch, edit this file — start from whichever demo is closest.
# 2. Delete the steps you don't need (each one costs a TPU slot).
# 3. Trigger the pipeline — only your branch's copy of this file is used, so
#    you can leave it modified indefinitely without affecting anyone else.
#
# NOTES
# ─────
# * The build step tags the image with $BUILDKITE_COMMIT and every TPU step
#   pulls that exact tag, so all steps must depend_on `build_docker`.
# * run_in_docker.sh runs your command inside the image at
#   /root/torchtpu-vllm — that is a COPY of the repo at this commit, not the
#   agent's checkout. Reference paths like `examples/...` / `tests/...`
#   relative to the repo root.
# * Anything written to /perf_eval_results inside the container is copied back
#   out and uploaded as a Buildkite artifact.

steps:

  # -----------------------------------------------------------------
  # Build step (required by every demo below)
  # Builds docker/Dockerfile --target dev and pushes it tagged with this
  # commit. Same script the CI pipeline_build.yml uses.
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # -----------------------------------------------------------------
  # Bring-up: multi-host smoke test on the smallest model we have.
  #
  # The only multi-host coverage today is the GLM-5.2-FP8 perf suite, which
  # takes ~an hour and needs a 355GB checkpoint — too heavy to gate a PR on.
  # This runs the same run_multihost.sh plumbing (Ray head + worker containers
  # across the two hosts of a v7x-16 slice, TP=16) against Qwen3-0.6B, so a
  # break in the multi-host path shows up in minutes instead of at 09:00 UTC.
  #
  # Qwen3-0.6B is a plain HF repo id on purpose: it isolates the multi-host
  # plumbing from object-storage staging, which the next step covers.
  # -----------------------------------------------------------------
  - label: "[multihost] offline_inference.py (Qwen3-0.6B, TP16, ray)"
    key: mh_offline_ray
    depends_on: build_docker
    agents:
      queue: tpu_v7x_16_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
    commands:
      - |
        bash .buildkite/scripts/run_multihost.sh \
          python3 examples/offline_inference.py \
            --model Qwen/Qwen3-0.6B \
            --tensor-parallel-size 16 \
            --max-model-len 256 \
            --max-num-batched-tokens 256 \
            --max-tokens 32
    artifact_paths:
      - "perf_eval_results/**/*"

  # -----------------------------------------------------------------
  # Verifies ensure_runai_assets_local (src/vllm_torchtpu/runai_assets.py).
  #
  # A gs:// model is staged into $VLLM_ASSETS_CACHE by ModelConfig.__post_init__
  # on whichever host builds the config; the resulting head-local path is then
  # shipped to the other host inside the pickled VllmConfig, where nothing was
  # ever written. Weights survive that (the streamer reads model_weights, which
  # is still the URI) but get_quant_config reads model_config.model and dies
  # with HFValidationError. Only unquantized checkpoints reach it — FP8 returns
  # early out of hf_config.quantization_config, which is why the GLM-5.2-FP8
  # multi-host perf suite never caught this.
  #
  # So the model here must be bf16 AND loaded from gs:// AND multi-host. That
  # is exactly the combination PR #338 failed on. offline_inference.py is used
  # rather than a server benchmark so the failure surfaces in minutes.
  # -----------------------------------------------------------------
  - label: "[multihost] offline_inference.py (Qwen3-30B-A3B bf16, gs://, TP16, ray)"
    key: mh_offline_ray_runai
    depends_on: build_docker
    agents:
      queue: tpu_v7x_16_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    commands:
      - |
        bash .buildkite/scripts/run_multihost.sh \
          python3 examples/offline_inference.py \
            --model gs://tpu-commons-ci/qwen/models--Qwen--Qwen3-30B-A3B/snapshots/ad44e777bcd18fa416d9da3bd8f70d33ebb85d39 \
            --load-format runai_streamer \
            --tensor-parallel-size 16 \
            --trust-remote-code \
            --max-model-len 1024 \
            --max-num-batched-tokens 1024 \
            --max-tokens 32
    artifact_paths:
      - "perf_eval_results/**/*"
