# Bisect for the gemma-4-26b-fp8-dp4-tp2-ep-text SparseCore halt (E0200
# RuntimeUnexpectedCoreHalt on SC2) on the post-#288 stack. Evidence so far
# (ci builds 2006 / 2024): halt is deterministic under the config's
# c512+ sweep, survives USE_MOE_SPARSE_CORE=0, and gemma is the ONLY perf
# config that serves with sampling enabled (generation_config: temp 1.0,
# top_k 64, top_p 0.95) - every other config forces BENCHMARK_TEMPERATURE=0,
# so only gemma ever executes the tt_jit_uniform_ RNG program that build
# 2024's halt was attributed to (torch.rand_like(logits) over the padded
# [batch, 262144] logits in tpu_runner.sample_tokens).
#
# Round 1 results (build 110): A greedy HALTED at c1024 (sampling ruled out),
# B kv-auto HALTED (kv fp8 ruled out), C mns128 c512 PASSED. The halt tracks
# per-rank batch crossing ~128->256, i.e. vocab-sized (262144) per-step
# tensors crossing the 64MiB SC-offload min-size threshold that
# env_override.py sets for AR/AG (PR #370) - collectives >= threshold are
# still offloaded to SparseCore.
#
# Round 2 variants (unmodified benchmark config, full c512/1024/2048 sweep):
#   D sc-thresh-16g: SC_ALLREDUCE_ALLGATHER_OFFLOAD_MIN_BYTES=17179869184 -
#       AR/AG never SC-offloaded. Passing pins the halt on an SC-offloaded
#       all-reduce/all-gather.
#   E sc-coll-off: LIBTPU_INIT_ARGS force-disables every SC collective
#       offload type. Passing (with D failing) points at a2a/reduce-scatter;
#       both failing rules collectives out entirely.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "gemma4 SC-halt D: AR/AG SC-offload threshold 16GiB"
    key: gemma_sc_halt_thresh16g
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash -c '
          SC_ALLREDUCE_ALLGATHER_OFFLOAD_MIN_BYTES=17179869184 \
          bash ./scripts/vllm/benchmarking/run_eval_flow.sh \
            --config gemma-4-26b-fp8-dp4-tp2-ep-text \
            --results-dir /perf_eval_results/gemma-D-thresh16g'
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "gemma4 SC-halt E: all SC collective offload disabled"
    key: gemma_sc_halt_coll_off
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash -c '
          LIBTPU_INIT_ARGS="--xla_tpu_enable_sparse_core_collective_offload_all_reduce=false --xla_tpu_enable_sparse_core_collective_offload_all_gather=false --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=false --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=false --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=false --xla_tpu_enable_sparse_core_collective_offload_dense_all_to_all=false --xla_tpu_enable_sparse_core_collective_offload_ragged_all_to_all=false" \
          bash ./scripts/vllm/benchmarking/run_eval_flow.sh \
            --config gemma-4-26b-fp8-dp4-tp2-ep-text \
            --results-dir /perf_eval_results/gemma-E-coll-off'
    artifact_paths:
      - "perf_eval_results/**/*"
