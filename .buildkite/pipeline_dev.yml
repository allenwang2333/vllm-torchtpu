# Bisect for the gemma-4-26b-fp8-dp4-tp2-ep-text SparseCore halt (E0200
# RuntimeUnexpectedCoreHalt on SC2) on the post-#288 stack. Evidence so far
# (ci builds 2006 / 2024): halt is deterministic under the config's
# c512+ sweep, survives USE_MOE_SPARSE_CORE=0, and gemma is the ONLY perf
# config that serves with sampling enabled (generation_config: temp 1.0,
# top_k 64, top_p 0.95) - every other config forces BENCHMARK_TEMPERATURE=0,
# so only gemma ever executes the tt_jit_uniform_ RNG program that build
# 2024's halt was attributed to (torch.rand_like(logits) over the padded
# [batch, 262144] logits in tpu_runner.sample_tokens).
#
# Variants:
#   A greedy:  BENCHMARK_TEMPERATURE=0, all else identical. If this passes,
#              the sampling/RNG path is the trigger.
#   B kv-auto: KV_CACHE_DTYPE=auto, sampling stays on. Tests the fp8-kv
#              numerics angle.
#   C mns128:  --max-num-seqs=128, c512 only, sampling stays on. Load bisect.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "gemma4 SC-halt A: greedy (BENCHMARK_TEMPERATURE=0)"
    key: gemma_sc_halt_greedy
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash -c '
          BENCHMARK_TEMPERATURE=0 bash ./scripts/vllm/benchmarking/run_eval_flow.sh \
            --config gemma-4-26b-fp8-dp4-tp2-ep-text \
            --results-dir /perf_eval_results/gemma-A-greedy'
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "gemma4 SC-halt B: kv-cache-dtype=auto (sampling on)"
    key: gemma_sc_halt_kv_auto
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash -c '
          KV_CACHE_DTYPE=auto bash ./scripts/vllm/benchmarking/run_eval_flow.sh \
            --config gemma-4-26b-fp8-dp4-tp2-ep-text \
            --results-dir /perf_eval_results/gemma-B-kv-auto'
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "gemma4 SC-halt C: max-num-seqs=128, c512 (sampling on)"
    key: gemma_sc_halt_mns128
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash \
          ./scripts/vllm/benchmarking/run_eval_flow.sh \
          --config gemma-4-26b-fp8-dp4-tp2-ep-text-mns128 \
          --results-dir /perf_eval_results/gemma-C-mns128
    artifact_paths:
      - "perf_eval_results/**/*"
