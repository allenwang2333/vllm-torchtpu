# Forge smoke step: one job on the 2-chip queue, no image build. It only
# proves that a build can be triggered over the API, dispatched to a TPU
# host, and read back. The RESULT line is what a reader greps for.

steps:
  - label: "forge smoke: 2-chip host check"
    key: forge_smoke
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - hostname
      - ls -la /dev/vfio || true
      - echo "RESULT forge-smoke ok chips=$(ls /dev/vfio 2>/dev/null | grep -c '^[0-9]')"
