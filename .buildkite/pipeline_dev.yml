# Scoping run for a KDA (gdn/v3) kernel optimization campaign.
#
#   kda_micro  the multi-arm microbenchmark that would be the campaign's
#              fitness function: golden as the control, a second copy of golden
#              on the same clock, and two injected faults it has to catch.
#              Three replicates, because one A/A pair is not a noise floor.
#   kda_e2e    the workload the campaign exists to improve: the reproduce
#              recipe verbatim, the same recipe under the profiler (for the
#              kernel's share of step time), and the same recipe with the
#              kernel perturbed (does the micro number predict this one).

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "KDA scorer: 4 arms x 2 configs (replicate {{matrix}}) (v7x-2)"
    key: kda_micro
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_2_queue
    matrix: ["1", "2", "3"]
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'REPLICATE={{matrix}} bash bench/kda_arms.sh'
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "KDA e2e: baseline + profile + perturbed, Kimi-Linear-48B TP8 (v7x-8)"
    key: kda_e2e
    depends_on: build_docker
    timeout_in_minutes: 150
    agents:
      queue: tpu_v7x_8_queue
      hostname: "tpu7x-8-ci-10-cicd-us-central1-c"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'bash bench/kda_e2e.sh; rc=$$?; python3 bench/xplane_op_share.py --dir /perf_eval_results/kda-e2e/profile --match "kda|gdn|conv1d" --out /perf_eval_results/kda-e2e/op-share.json || echo "no op shares"; rm -rf /perf_eval_results/kda-e2e/profile; exit $$rc'
    artifact_paths:
      - "perf_eval_results/**/*"
