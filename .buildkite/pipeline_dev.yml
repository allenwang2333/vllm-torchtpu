# Scratch branch. Runs the one step from pipeline_perf_kube.yml that has never
# gone green - GLM-5.2-FP8 across a full v7x-16 slice - and nothing else.
#
# A full perf-kube build is ~18 steps two at a time on the fleet's eight v7x
# chips, better than ten hours, and all of it would be re-run to learn one
# thing: whether the Ray head now counts its hosts correctly. This costs one
# image build and one step.
#
# No soft_fail and no NIGHTLY gate, unlike the real lane: the point is a plain
# pass or fail.

x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher
    checkout:
      cloneFlags: -v --depth 1 --filter=blob:none
      fetchFlags: -v --prune --depth 1 --filter=blob:none

steps:
  - label: ":docker: Build and Push CI Image"
    key: "build_docker"
    timeout_in_minutes: 120
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":kubernetes: Perf/Eval: Nightly glm-5.2-fp8-dp16-ep (TPU v7x-16)"
    key: "perf_nightly_glm_5_2_fp8_dp16_ep"
    depends_on: "build_docker"
    # Covers queueing as well as running: the sixteen-chip slice waits for every
    # four-chip step already in line ahead of it.
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/kubernetes/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config glm-5.2-fp8-dp16-ep --run-lm-eval --results-dir /perf_eval_results/glm-5.2-fp8-dp16-ep
