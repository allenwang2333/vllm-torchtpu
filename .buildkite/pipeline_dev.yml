# Unified-pool A/B for the 397B TP8/DP1 `isl8192_osl1024_c512` nightly gate.
#
# QUESTION
# ────────
# The nightly `Perf: Nightly qwen3.5-397b-fp8-tp8-dp1-ep` job has failed since
# 2026-08-06 on one metric: isl8192_osl1024_c512 median_tpot_ms ~110 against a
# 95.77 baseline. Two changes landed in the same window and the nightly cannot
# separate them: #170 (c94523a3, unified KV pool on by default, merged 08-05
# 19:44 UTC) and #288 (a40ace87, torch 2.13 + vLLM 0.26.1rc0, merged 08-06
# 08:12 UTC). The first red nightly ran 08-06 09:00 UTC with both present.
#
# DESIGN
# ──────
# Both arms run the SAME commit, SAME image, SAME harness and SAME client, and
# differ only in TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL — the escape hatch #170
# added, which run_in_docker.sh already forwards into the container. That
# isolates the pool from the dependency bump and from any harness difference.
#
# WHAT TO READ OUT
# ────────────────
# 1. `GPU KV cache size` and `Maximum concurrency` in each arm's server.log.
#    The nightly showed 1,867,966 tok / 182.42x (separate, on vLLM 0.26.0) vs
#    2,167,265 tok / 211.65x (pool, on vLLM 0.26.1rc0). If this A/B reproduces
#    that ~1.16x capacity ratio on a single commit, the pool owns the change.
# 2. total_token_throughput at c512 — the operating-point-invariant metric.
#    TPOT at this cell is batch-depth arithmetic and moves with capacity
#    whatever the cause, so it is not the number that decides "regression".
# 3. c256 TTFT, where the nightly showed a 5x improvement (10,420 -> ~2,100 ms)
#    that the gate cannot see because every median_ttft_ms baseline is 0.
#
# The config `qwen3.5-397b-fp8-tp8-dp1-ep-abcell` is the nightly config trimmed
# to these two cells. It deliberately has no baseline file, so run_eval_flow.sh
# skips the regression check and both arms report raw numbers, not pass/fail.

x-ab-defaults: &ab_defaults
  depends_on: build_docker
  agents:
    queue: tpu_v7x_8_queue
  artifact_paths:
    - "perf_eval_results/**/*"

x-ab-env: &ab_env
  TPU_ACCELERATOR_TYPE: "tpu7x"
  VLLM_ENGINE_READY_TIMEOUT_S: "7200"
  BENCHMARK_WARMUP_RUNS: "1"

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "A/B arm 1: separate layout (pool=0)"
    key: ab_separate
    <<: *ab_defaults
    env:
      <<: *ab_env
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
    commands:
      - >-
        bash .buildkite/scripts/run_in_docker.sh
        bash ./scripts/vllm/benchmarking/run_eval_flow.sh
        --config qwen3.5-397b-fp8-tp8-dp1-ep-abcell
        --results-dir /perf_eval_results/ab-separate

  - label: "A/B arm 2: unified pool (pool=1)"
    key: ab_pool
    <<: *ab_defaults
    env:
      <<: *ab_env
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "1"
    commands:
      - >-
        bash .buildkite/scripts/run_in_docker.sh
        bash ./scripts/vllm/benchmarking/run_eval_flow.sh
        --config qwen3.5-397b-fp8-tp8-dp1-ep-abcell
        --results-dir /perf_eval_results/ab-pool
