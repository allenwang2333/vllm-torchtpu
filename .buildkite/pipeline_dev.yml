# Dev pipeline for vllm-torchtpu-dev (branch: glm-perf-nightly).
# Iterating on the GLM-5.2 multihost perf benchmark without a PR / full CI.
#
# The image is REBUILT each run (libtpu 0.0.45 rolls back the multihost
# HOST_BOUNDS validation regression; the previously pinned images bake in
# the broken 0.0.43). The abtest step is the fast canary: with the fixed
# libtpu, torchrun's 16-rank all-reduce should pass, and only then is the
# full GLM perf run worth its queue time.
#
# Trigger:
#   https://buildkite.com/tpu-commons/vllm-torchtpu-dev → "New Build",
#   branch glm-perf-nightly, or POST to the Buildkite API.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # Diagnostic only (soft_fail): torch_tpu's official torchrun flow. On
  # libtpu 0.0.45 the HOST_BOUNDS validation is gone, but this bare
  # payload does no per-process device assignment and dies with "No TPU
  # devices found after filtering" — the vLLM executor path assigns
  # devices properly, so the smoke step below is the real gate.
  - label: "abtest: torchrun 8 procs/host (libtpu A/B)"
    key: abtest_torchrun
    depends_on:
      - build_docker
      - smoke_multihost
    soft_fail: true
    agents:
      queue: tpu_v7x_16_queue
      # TEMPORARY: pin to the healthy slice; the other agent's worker host
      # (currently tpu7x-16-ci-2) drops every ssh session. Remove once that
      # slice is rebooted/repaired.
      hostname: tpu7x-16-ci-1-cicd-us-central1-c
    commands:
      - "bash .buildkite/scripts/torchrun_ab_test.sh"
    artifact_paths:
      - "perf_eval_results/**/*"

  # The real gate: tiny model through the actual Ray executor path.
  - label: "smoke: multihost offline_inference TP=16"
    key: smoke_multihost
    depends_on: build_docker
    agents:
      queue: tpu_v7x_16_queue
      # TEMPORARY: pin to the healthy slice; the other agent's worker host
      # (currently tpu7x-16-ci-2) drops every ssh session. Remove once that
      # slice is rebooted/repaired.
      hostname: tpu7x-16-ci-1-cicd-us-central1-c
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh python3 examples/offline_inference.py --model Qwen/Qwen3-0.6B --tensor_parallel_size=16 --max-model-len 256 --max-num-batched-tokens 256 --max-tokens 16"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "Perf: glm-5.2-fp8-tp16-ep (TPU v7x-16 multihost)"
    key: perf_glm_5_2_fp8_tp16_ep
    depends_on:
      - build_docker
      - smoke_multihost
    agents:
      queue: tpu_v7x_16_queue
      # TEMPORARY: pin to the healthy slice; the other agent's worker host
      # (currently tpu7x-16-ci-2) drops every ssh session. Remove once that
      # slice is rebooted/repaired.
      hostname: tpu7x-16-ci-1-cicd-us-central1-c
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config glm-5.2-fp8-tp16-ep --results-dir /perf_eval_results/glm-5.2-fp8-tp16-ep"
    artifact_paths:
      - "perf_eval_results/**/*"
