# Dev pipeline for vllm-torchtpu-dev.
# Demo/sample steps showing how to run one-off experiments on TPU.
# Copy and adapt any step below for your own test.
#
# WHY THIS EXISTS
# ───────────────
# vllm-torchtpu-ci runs the full suite (~build + unit tests + integration +
# perf) on every push, which is slow and shared. This pipeline uploads ONLY the
# steps on YOUR branch, so a single test costs one image build + one job.
#
# HOW TO TRIGGER
# ──────────────
# Option A — Buildkite UI:
#   https://buildkite.com/vllm/vllm-torchtpu-dev → "New Build",
#   set branch to your branch, "Create Build".
#
# Option B — Buildkite API (needs BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/vllm/pipelines/vllm-torchtpu-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ────────────────
# 1. On your branch, edit this file — start from whichever demo is closest.
# 2. Delete the steps you don't need (each one costs a TPU slot).
# 3. Trigger the pipeline — only your branch's copy of this file is used, so
#    you can leave it modified indefinitely without affecting anyone else.
#
# NOTES
# ─────
# * The build step tags the image with $BUILDKITE_COMMIT and every TPU step
#   pulls that exact tag, so all steps must depend_on `build_docker`.
# * run_in_docker.sh runs your command inside the image at
#   /root/torchtpu-vllm — that is a COPY of the repo at this commit, not the
#   agent's checkout. Reference paths like `examples/...` / `tests/...`
#   relative to the repo root.
# * Anything written to /perf_eval_results inside the container is copied back
#   out and uploaded as a Buildkite artifact.

steps:

  # -----------------------------------------------------------------
  # Build step (required by every step below)
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # -----------------------------------------------------------------
  # Kimi-K3 baseline on the tpu7x-32 pod, mirroring the nightly
  # perf_nightly_kimi_k3_tp32_ep step in pipeline_perf.yml (same config,
  # same run_multihost.sh + run_eval_flow.sh path), plus phased profiling:
  #   USE_PHASED_PROFILER=true        one trace per inference phase
  #   VLLM_RAY_EXTRA_ENV_VARS_TO_COPY  propagate that switch to the Ray
  #                                    workers on the other 3 hosts (it is
  #                                    not in TpuPlatform.additional_env_vars)
  #   CAPTURE_PROFILE=1               run_benchmarks.sh adds the
  #                                    --profiler-config flags and passes
  #                                    --profile to the bench client, so the
  #                                    warmup pass is not traced
  #   EXTRA_SERVE_ARGS                5 steps per phase; skip the first ~200
  #                                    decode steps so decode_only shows
  #                                    steady-state KV length (8192 prompt)
  # Traces land in /perf_eval_results/kimi-k3-tp32-ep/profile on the head
  # host (ranks 0-7); the other hosts' containers have no results mount, so
  # their captures are not collected. Profiling costs ~+11% TTFT / -4%
  # throughput, so this run's numbers are NOT baseline-comparable.
  # -----------------------------------------------------------------
  - label: "K3 baseline + phased profile: kimi-k3-tp32-ep (TPU v7x-32)"
    key: dev_k3_baseline_profile
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_multihost.sh \
          env USE_PHASED_PROFILER=true \
              VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=USE_PHASED_PROFILER \
              CAPTURE_PROFILE=1 \
              EXTRA_SERVE_ARGS='--profiler-config.max_iterations 5 --additional-config {"phased_profiler_decode_only_kv_len_threshold":8400}' \
          bash ./scripts/vllm/benchmarking/run_eval_flow.sh \
            --config kimi-k3-tp32-ep \
            --results-dir /perf_eval_results/kimi-k3-tp32-ep
    artifact_paths:
      - "perf_eval_results/**/*"
