# Proof of concept for tpu-perf-forge: a dev build that runs in an image built
# and pushed OUTSIDE Buildkite. There is no build step; the image comes from the
# build's meta-data CI_IMAGE_TAG, set when the build is created over the API.
steps:
  - label: "forge prebuilt-image PoC (no build step)"
    key: forge_poc
    timeout_in_minutes: 20
    agents:
      queue: tpu_v7x_2_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - 'echo "CI_IMAGE_TAG from meta-data: $(buildkite-agent meta-data get CI_IMAGE_TAG --default MISSING)"'
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
          echo "marker in the image:"; cat /root/torchtpu-vllm/FORGE_POC.txt
          python3 -c "import vllm_torchtpu, jax; print(\"vllm_torchtpu at\", vllm_torchtpu.__file__); print(\"devices\", jax.devices())"'
