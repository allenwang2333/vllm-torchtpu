# Multi-host bring-up, step 1: what can a multi-host agent see of its slice?
#
# Runs directly on the agent (no Docker) so host processes, /dev and gcloud are
# all visible, and never initializes the TPU runtime -- on a multi-host slice
# that would block until every peer VM joins.
#
# tpu_v7x_16_queue, not tpu_v7x_32_queue: the 16-chip agents are provisioned by
# ci-infra terraform (modules/ci_v7x, instance_count 3) whose startup script
# installs the GitHub App git credential helper plus
# url."https://github.com/".insteadOf "git@github.com:", so they can check out
# this private repo. The single tpu7x-32 agent is hand-built and not in that
# terraform, so it has neither and fails checkout with "Permission denied
# (publickey)" (vllm-torchtpu-dev builds 71-73).

steps:
  - label: ":mag: tpu7x-16 multi-host probe (read-only)"
    key: tpu7x_16_multihost_probe
    agents:
      queue: tpu_v7x_16_queue
    commands:
      - python3 .buildkite/scripts/multihost_probe.py
