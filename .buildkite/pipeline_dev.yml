# Dependency isolation for the E0200 SparseCore SC2 halt (see
# docs/sc2-sparsecore-halt-2026-08.md on branch
# mhhua/sc2-sparsecore-halt-evidence). #288 bumped torch 2.11->2.13,
# torch-tpu dev20260728->dev20260804, vllm 0.26.0->v0.26.1rc0 (git), and
# torchvision atomically; this pipeline tests one pin change per build
# against a fast gemma reproducer.
#
# Prior rounds (builds 110/112) ruled out: sampling/RNG, fp8 KV cache,
# USE_MOE_SPARSE_CORE kernels, SC-offloaded AR/AG (threshold 16GiB), and
# all 8 SC collective-offload types. mns128@c512 passes; the halt needs
# per-rank decode batch bucket >=256 (c1024 with max-num-seqs=512).
#
# Trigger modes (set env on the build):
#   RUN_PROBE=1  - CPU-only step: enumerate torch-tpu / torch versions in
#                  the private registry and dump each nightly's
#                  Requires-Dist torch pin (ABI compatibility map).
#   RUN_REPRO=1  - build the image from this commit's pyproject and run the
#                  gemma c1024-only reproducer (halts ~10 min into serving
#                  on the bad stack; pre-#288 stack completed c1024+c2048).
#
# Iteration loop: edit pyproject.toml pins, commit, trigger with
# RUN_REPRO=1. PASS = "Benchmark completed successfully" for c1024 and no
# E0200 in perf_eval_results/**/server.log; FAIL = E0200 SC2 halt.

steps:

  - label: ":mag: Probe registry: torch-tpu nightlies + torch ABI map"
    key: probe_registry
    if: 'build.env("RUN_PROBE") == "1"'
    agents:
      queue: cpu_64_core
    commands:
      - |
        bash -c '
          set -euo pipefail
          if command -v gcloud >/dev/null 2>&1; then
            TOKEN="$(gcloud auth print-access-token)"
          else
            TOKEN="$(curl -s -H "Metadata-Flavor: Google" \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
              | sed -nE "s/.*\"access_token\"[[:space:]]*:[[:space:]]*\"([^\"]+)\".*/\1/p")"
          fi
          REG="https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple"
          echo "--- torch versions in registry"
          curl -su "oauth2accesstoken:${TOKEN}" "${REG}/torch/" \
            | grep -oE "torch-[0-9][^<\"#]*\.whl" | sort -u | tail -30
          echo "--- torch-tpu versions in registry (dev202607xx onward)"
          curl -su "oauth2accesstoken:${TOKEN}" "${REG}/torch-tpu/" > /tmp/tt_index.html
          grep -oE "0\.1\.1\.dev20260[78][0-9]{9,}" /tmp/tt_index.html | sort -u
          echo "--- per-nightly torch requirement (PEP 658 metadata)"
          for v in $(grep -oE "0\.1\.1\.dev20260[78][0-9]{9,}" /tmp/tt_index.html | sort -u); do
            url=$(grep -oE "href=\"[^\"]*torch_tpu-${v}[^\"]*\.whl[^\"]*\"" /tmp/tt_index.html \
                  | head -1 | sed -e "s/^href=\"//" -e "s/\"$//" -e "s/#.*//")
            [ -z "${url}" ] && continue
            case "${url}" in http*) full="${url}";; *) full="${REG}/torch-tpu/${url}";; esac
            req=$(curl -sfu "oauth2accesstoken:${TOKEN}" "${full}.metadata" 2>/dev/null \
                  | grep -iE "^Requires-Dist: torch([ =<>!~]|$)" | head -2 | tr "\n" ";" || true)
            echo "${v} -> ${req:-METADATA-UNAVAILABLE (${full})}"
          done
        '

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    if: 'build.env("RUN_REPRO") == "1"'
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "gemma4 SC-halt reproducer: c1024 only (this commit's pins)"
    key: gemma_sc_halt_repro
    if: 'build.env("RUN_REPRO") == "1"'
    depends_on: build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - |
        bash .buildkite/scripts/run_in_docker.sh bash \
          ./scripts/vllm/benchmarking/run_eval_flow.sh \
          --config gemma-4-26b-fp8-dp4-tp2-ep-text-c1024 \
          --results-dir /perf_eval_results/gemma-repro-c1024
    artifact_paths:
      - "perf_eval_results/**/*"
