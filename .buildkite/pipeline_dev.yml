# Dev pipeline: one-off run of the Kimi-K2.6 nightly perf+eval step.
#
# Mirrors `perf_nightly_kimi_k2_6_real` in pipeline_perf.yml exactly (same
# config, same --run-lm-eval, same env) so the wall time and the mmlu_pro
# score measured here are what the nightly will see. Exists to give #875 a
# real build link and an end-to-end exercise of the new --run-lm-eval path,
# which PR CI never runs (that step is behind the NIGHTLY gate).

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "Perf/Eval: Kimi-K2.6 (TPU v7x-8)"
    key: dev_kimi_k2_6_perf_eval
    depends_on: build_docker
    timeout_in_minutes: 120
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "1"
      EVAL_SOFT_FAIL: "1"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimik-2.6-w4a16-tp8-ep --run-lm-eval --results-dir /perf_eval_results/kimik-2.6-w4a16-tp8-ep"
    artifact_paths:
      - "perf_eval_results/**/*"
