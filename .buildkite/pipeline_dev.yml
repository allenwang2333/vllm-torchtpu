# PR #170 A/B evidence — BASELINE arm.
# This branch is 74d86c2fc (the immediate parent of the #170 merge commit)
# plus this test harness only. See scripts/vllm/benchmarking/pr170_ab/.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 A/B: baseline @ 74d86c2fc (pre-#170)"
    key: ab_baseline
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_ab_test.sh baseline
    artifact_paths:
      - "perf_eval_results/**/*"
