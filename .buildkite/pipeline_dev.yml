# Dev pipeline for vllm-torchtpu-dev.
# Demo/sample steps showing how to run one-off experiments on TPU.
# Copy and adapt any step below for your own test.
#
# WHY THIS EXISTS
# ───────────────
# vllm-torchtpu-ci runs the full suite (~build + unit tests + integration +
# perf) on every push, which is slow and shared. This pipeline uploads ONLY the
# steps on YOUR branch, so a single test costs one image build + one job.
#
# HOW TO TRIGGER
# ──────────────
# Option A — Buildkite UI:
#   https://buildkite.com/vllm/vllm-torchtpu-dev → "New Build",
#   set branch to your branch, "Create Build".
#
# Option B — Buildkite API (needs BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/vllm/pipelines/vllm-torchtpu-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ────────────────
# 1. On your branch, edit this file — start from whichever demo is closest.
# 2. Delete the steps you don't need (each one costs a TPU slot).
# 3. Trigger the pipeline — only your branch's copy of this file is used, so
#    you can leave it modified indefinitely without affecting anyone else.
#
# NOTES
# ─────
# * The build step tags the image with $BUILDKITE_COMMIT and every TPU step
#   pulls that exact tag, so all steps must depend_on `build_docker`.
# * run_in_docker.sh runs your command inside the image at
#   /root/torchtpu-vllm — that is a COPY of the repo at this commit, not the
#   agent's checkout. Reference paths like `examples/...` / `tests/...`
#   relative to the repo root.
# * Anything written to /perf_eval_results inside the container is copied back
#   out and uploaded as a Buildkite artifact.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # -----------------------------------------------------------------
  # Kimi-K3-pruned75 1P1D smoke (PR #857 Raiden Stage-3 path):
  #   node 0 = prefill TP8/EP8, node 1 = decode TP8/EP8 (dst shards 8),
  #   the other two hosts of the v7x-32 slice idle. Weights stream from
  #   GCS (475 GB does not fit the 100 GB boot disk). run_disagg_multihost
  #   drives one container per host; the role script launches the
  #   servers, a toy proxy, and a 10-prompt `vllm bench serve`.
  # -----------------------------------------------------------------
  - label: "Kimi-K3-pruned75 1P1D smoke: TP8 -> TP8 (TPU v7x-32)"
    key: dev_kimi_k3_pruned75_pd_smoke
    depends_on: build_docker
    timeout_in_minutes: 300
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      DISAGG_ROLE_SCRIPT: "scripts/vllm/integration/run_kimi_k3_pd_smoke.sh"
      DISAGG_RUN_ROOT: "/perf_eval_results/kimi_k3_pruned75_pd_smoke"
      MODEL_PATH: "gs://tpu-commons-ci/moonshootai/kimi/k3-pruned75"
      SERVED_MODEL_NAME: "mgoin/Kimi-K3-pruned75"
      TOKENIZER: "mgoin/Kimi-K3-pruned75"
      PREFILL_PCP: "1"
      PREFILL_TP: "8"
      DECODE_DP: "1"
      DECODE_TP: "8"
      TPU_RAIDEN_TRANSFER_PARALLELISM: "8"
      STARTUP_TIMEOUT_S: "5400"
      LOAD_FORMAT: "runai_streamer"
      ENABLE_EP_WEIGHT_FILTER: "1"
      MODEL_LOADER_MEMORY_LIMIT: "17179869184"
      BENCH_NUM_PROMPTS: "10"
      BENCH_MAX_CONCURRENCY: "2"
      BENCH_INPUT_LEN: "1024"
      BENCH_OUTPUT_LEN: "64"
      DISAGG_PASSTHROUGH_ENV: "TPU_ACCELERATOR_TYPE VLLM_ENGINE_READY_TIMEOUT_S TOKENIZER LOAD_FORMAT ENABLE_EP_WEIGHT_FILTER MODEL_LOADER_MEMORY_LIMIT BENCH_NUM_PROMPTS BENCH_MAX_CONCURRENCY BENCH_INPUT_LEN BENCH_OUTPUT_LEN"
    commands:
      - bash .buildkite/scripts/run_disagg_multihost.sh
    artifact_paths:
      - "perf_eval_results/**/*"
