# Four features that every K3 recipe turns off, asked of the engine directly.
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_probes.yml
#
# Each probe is a short server on the 8-layer surrogate; a refusal is recorded
# as K3PROBE status=REFUSED rather than failing the step, because "the engine
# refuses this" is the answer we came for. Four v7x-8 agents in parallel,
# ~10 min each.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":test_tube: K3 probe {{matrix}} (TPU v7x-8)"
    key: k3_probes
    depends_on: build_docker
    timeout_in_minutes: 90
    agents:
      queue: tpu_v7x_8_queue
    matrix: ["apc", "apcpool", "async", "fp8kv"]
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/k3_feature_probe.sh --config kimi-k3-sliced8-tp8-{{matrix}} --name {{matrix}} --results-dir /perf_eval_results/probe-{{matrix}}"
    artifact_paths:
      - "perf_eval_results/**/*"
