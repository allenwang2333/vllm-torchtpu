# MoE-focused diagnosis of the conc-32 gsm8k collapse on the per-layer KV
# path (pre-#170 baseline). Trigger with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_moe.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 MoE diag: baseline @ 74d86c2fc, conc sweep + SC on/off"
    key: moe_diag
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_moe_diag.sh
    artifact_paths:
      - "perf_eval_results/**/*"
