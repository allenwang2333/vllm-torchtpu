# Concurrency curve for Kimi-K3 on the v7x-32 pod. Select with
#   DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_conc.yml
# Every K3 serving number on record is bs=1; this is the first curve.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":chart_with_upwards_trend: Kimi-K3 concurrency 1/4/16 (TPU v7x-32)"
    key: k3_conc
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep-conc --results-dir /perf_eval_results/kimi-k3-tp32-ep-conc"
    artifact_paths:
      - "perf_eval_results/**/*"
