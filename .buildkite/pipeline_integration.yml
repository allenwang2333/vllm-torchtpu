steps:
  - group: "Integration Tests on TPU"
    depends_on: "build_docker"
    steps:
      - label: "Integration: qwen35-pcp4-dp4-disagg-correctness"
        key: "integration_qwen35_pcp4_dp4_disagg_correctness"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "1"
          RUN_ROOT: "/perf_eval_results/qwen35_pcp4_dp4_disagg_ci"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/integration/run_qwen35_p4d2_disagg_correctness.sh"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Integration: qwen35-pcp8-dp8-disagg-correctness"
        key: "integration_qwen35_pcp8_dp8_disagg_correctness"
        agents:
          queue: "tpu_v7x_16_queue"
        env:
          TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "1"
          RUN_ROOT: "/perf_eval_results/qwen35_pcp8_dp8_disagg_ci"
        commands:
          - "bash .buildkite/scripts/run_disagg_multihost.sh"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Presubmit: disagg-single-host"
        key: "presubmit_disagg_single_host"
        if: "build.pull_request.id != null"
        agents:
          queue: "tpu_v7x_8_queue"
        commands:
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            env
            -u TPU_USE_RAIDEN_CONNECTOR
            -u TPU_USE_RAIDEN_KV_CACHE_MANAGER
            -u TPU_RAIDEN_QWEN35_ADMISSION
            TPU_KV_RESHARD_TRANSPORT=zmq
            LOG_DIR=/perf_eval_results/disagg_single_host
            bash ./examples/disagg/run_disagg_single_host.sh

      - label: "Integration: qwen35-gpc-correctness"
        key: "integration_qwen35_gpc_correctness"
        agents:
          queue: "tpu_v7x_16_queue"
        commands:
          - "bash .buildkite/scripts/run_gpc_multihost.sh"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Integration: qwen35-apc-correctness"
        key: "integration_qwen35_apc_correctness"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          RUN_ROOT: "/perf_eval_results/qwen35_apc_ci"
        commands:
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3.5-35B-A3B-FP8/"
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/integration/run_qwen35_apc_correctness.sh"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Integration: qwen35-gpc-global-dram-pool"
        key: "integration_qwen35_gpc_global_dram_pool"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          RUN_ROOT: "/perf_eval_results/qwen35_gpc_dram_pool_ci"
        commands:
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3.5-35B-A3B-FP8/"
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/integration/run_qwen35_gpc_global_dram_pool.sh"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Multihost TorchTPU Presubmit (v7x 16-chip)"
        key: "vllm_torchtpu_multihost_presubmit"
        agents:
          queue: "tpu_v7x_16_queue"
        commands:
          - |
            bash .buildkite/scripts/run_multihost.sh \
              python3 examples/offline_inference.py \
                --model Qwen/Qwen3-0.6B \
                --tensor-parallel-size 16 \
                --max-model-len 256 \
                --max-num-batched-tokens 256 \
                --max-tokens 32

      - label: "Integration: Nightly dsv4-offload-correctness"
        key: "integration_nightly_dsv4_offload_correctness"
        # Nightly only: a full DSv4 boot is ~27 min of weight load plus compile
        # before the smoke even starts, which is too much to spend on every PR.
        # The same boot cost is why the Buildkite default timeout is not enough
        # headroom here.
        if: 'build.env("NIGHTLY") == "1"'
        timeout_in_minutes: 120
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          TPU_ACCELERATOR_TYPE: "tpu7x"
          RUN_ROOT: "/perf_eval_results/dsv4_offload_ci"
        commands:
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/models--deepseek-ai--DeepSeek-V4-Flash/"
          # MODEL is not on run_in_docker.sh's forwarding list, and the rig
          # defaults it to a dev-box path; hand it the HF id the staged
          # snapshot resolves under HF_HOME instead.
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            env MODEL=deepseek-ai/DeepSeek-V4-Flash
            bash ./scripts/vllm/integration/run_dsv4_offload_correctness.sh
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Integration: glm52-fp4-offload-correctness"
        key: "integration_glm52_fp4_offload_correctness"
        # Pre-merge, like the other Integration steps in this group, and
        # unlike its still-nightly DSv4 sibling above.
        #
        # The explicit timeout stays, and stays larger than that sibling's:
        # the Buildkite default does not cover this checkpoint. At ~465 GB the
        # weight load alone is ~16 min before the smoke starts, and an agent
        # that has not yet cached the snapshot pays a one-time GCS stage of
        # the same ~465 GB ahead of that. The smoke itself is under a minute.
        timeout_in_minutes: 180
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          TPU_ACCELERATOR_TYPE: "tpu7x"
          RUN_ROOT: "/perf_eval_results/glm52_fp4_offload_ci"
          SERVED_MODEL_NAME: "nvidia/GLM-5.2-NVFP4"
        commands:
          # Deliberately NOT staged with stage_model_snapshot.sh. At ~433 GiB
          # this checkpoint does not fit a tpu7x-8 agent's disk alongside what
          # else lives there: the staging copy died at 123/174 files with
          # ENOSPC and the rig never started. Nightly hid that behind a warm
          # per-agent cache; pre-merge means every agent would need its own
          # copy, so the step streams from GCS instead and stages nothing.
          #
          # MODEL is not on run_in_docker.sh's forwarding list, and the rig
          # defaults it to the HF id, which would download the checkpoint;
          # hand it the bucket URI. A gs:// MODEL makes the rig serve with
          # --load-format runai_streamer (runai-model-streamer[gcs] is a
          # pyproject dependency). The prefix is a plain checkpoint directory
          # with config.json at its root, not a models--<org>--<name> hub
          # snapshot, so it needs no snapshots/ subdirectory resolution.
          #
          # It is a copy of gs://cloud-devkit/ckpt/hf/nvidia/GLM-5.2-NVFP4,
          # and the copy is what makes streaming work at all. runai's GCS
          # backend resolves a prefix through storage.Client.get_bucket()
          # (runai_model_streamer_gcs/files/files.py), a bucket-metadata GET
          # needing storage.buckets.get. The agent SA has only object-level
          # access to cloud-devkit -- enough for the gcloud staging copy that
          # ENOSPC'd above, not for get_bucket, which 403'd before a single
          # weight moved. On tpu-commons-ci the same SA is covered by the
          # bucket's projectEditor/projectViewer legacy bindings, so
          # get_bucket resolves. Sibling of the GLM-5.2-FP8 prefix already
          # there.
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            env MODEL=gs://tpu-commons-ci/glm/GLM-5.2-NVFP4
            bash ./scripts/vllm/integration/run_glm52_fp4_offload_correctness.sh
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Integration: compilation-cache-e2e"
        key: "integration_compilation_cache_e2e"
        agents:
          queue: "tpu_v7x_2_queue"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/integration/run_compilation_cache_e2e.sh"
