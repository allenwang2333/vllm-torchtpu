# [branch-local] Concurrency probe for issue #845. One server boot, N identical
# short requests at each N in K3_PROBE_CONC_LIST, replies classified.
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_probe.yml.
# Knobs (build env, baked in at upload): K3_PROBE_QUEUE (tpu_v7x_32_queue |
# tpu_v7x_8_queue), K3_PROBE_CONFIG, K3_PROBE_CONC_LIST, K3_PROBE_CTX,
# K3_PROBE_MNS, K3_PROBE_MAX_TOKENS, K3_PROBE_ENV (space-separated KEY=VAL),
# K3_PROBE_EXTRA_SERVE_ARGS, K3_PROBE_GCS_ROOT, K3_PROBE_HOST (pod agent hostname tag;
# the stable pod has no hostname tag and a full disk). No quotes or $ in values.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "probe ${K3_PROBE_CONFIG:-kimi-k3-tp32-ep-concsweep} N=${K3_PROBE_CONC_LIST:-128,160,192,256} mns ${K3_PROBE_MNS:-256} env [${K3_PROBE_ENV:-}] extra [${K3_PROBE_EXTRA_SERVE_ARGS:-}] (v7x-32 pod)"
    key: probe_pod
    if: 'build.env("K3_PROBE_QUEUE") == null || build.env("K3_PROBE_QUEUE") == "tpu_v7x_32_queue"'
    depends_on: build_docker
    timeout_in_minutes: 240
    agents:
      queue: "tpu_v7x_32_queue"
      hostname: "${K3_PROBE_HOST:-tpu7x-32-ci-1-cicd-us-central1-c}"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash -c 'ENVARGS=\"\"; for kv in ${K3_PROBE_ENV:-}; do ENVARGS=\"$$ENVARGS --env $$kv\"; done; bash ./scripts/vllm/benchmarking/k3_conc_probe.sh --results-dir /perf_eval_results/k3-conc-probe --config ${K3_PROBE_CONFIG:-kimi-k3-tp32-ep-concsweep} --conc-list ${K3_PROBE_CONC_LIST:-128,160,192,256} --ctx ${K3_PROBE_CTX:-16384} --max-num-seqs ${K3_PROBE_MNS:-256} --max-tokens ${K3_PROBE_MAX_TOKENS:-300} $$ENVARGS --extra-serve-args \"${K3_PROBE_EXTRA_SERVE_ARGS:-}\" --gcs-root \"${K3_PROBE_GCS_ROOT:-}\"'"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "probe ${K3_PROBE_CONFIG:-deepseek-v2-tp8-ep-probe} N=${K3_PROBE_CONC_LIST:-128,160,192,256} mns ${K3_PROBE_MNS:-256} env [${K3_PROBE_ENV:-}] extra [${K3_PROBE_EXTRA_SERVE_ARGS:-}] (v7x-8)"
    key: probe_8chip
    if: 'build.env("K3_PROBE_QUEUE") == "tpu_v7x_8_queue"'
    depends_on: build_docker
    timeout_in_minutes: 180
    agents:
      queue: "tpu_v7x_8_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash -c 'ENVARGS=\"\"; for kv in ${K3_PROBE_ENV:-}; do ENVARGS=\"$$ENVARGS --env $$kv\"; done; bash ./scripts/vllm/benchmarking/k3_conc_probe.sh --results-dir /perf_eval_results/k3-conc-probe --config ${K3_PROBE_CONFIG:-deepseek-v2-tp8-ep-probe} --conc-list ${K3_PROBE_CONC_LIST:-128,160,192,256} --ctx ${K3_PROBE_CTX:-8192} --max-num-seqs ${K3_PROBE_MNS:-256} --max-tokens ${K3_PROBE_MAX_TOKENS:-300} $$ENVARGS --extra-serve-args \"${K3_PROBE_EXTRA_SERVE_ARGS:-}\" --gcs-root \"${K3_PROBE_GCS_ROOT:-}\"'"
    artifact_paths:
      - "perf_eval_results/**/*"
