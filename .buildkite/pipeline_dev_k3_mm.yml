# Kimi-K3 vision path on one v7x-8 host. Select with
#   DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_mm.yml
# Every other K3 recipe serves --language-model-only, so MoonViT has no
# coverage. The sliced checkpoint carries the vision tower intact, so this
# costs one v7x-8 host instead of the pod.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":eyes: K3-sliced8 multimodal smoke (TPU v7x-8)"
    key: k3_mm
    depends_on: build_docker
    timeout_in_minutes: 120
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/k3_mm_smoke.sh --config kimi-k3-sliced8-tp8-mm --results-dir /perf_eval_results/kimi-k3-sliced8-tp8-mm"
    artifact_paths:
      - "perf_eval_results/**/*"
