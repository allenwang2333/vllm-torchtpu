# Kimi-K3 InferenceX AgentX performance sweep on the TPU v7x-32 pod.
#
# WHAT IT DOES
# ────────────
# Boots the K3 AgentX server once (config kimi-k3-tp32-ep-agentx: TP32/EP,
# long context, tool-call + reasoning parsers), runs a GSM8K probe on the fresh
# server, then replays the InferenceX AgentX trace corpus (aiperf, Claude Code
# sessions) at each concurrency in ascending order, draining the engine
# between points. The summary table (output tok/s per chip, TTFT, TPOT, P90
# interactivity, cache hit) and every point's aiperf export are uploaded as
# artifacts. Driver: scripts/vllm/benchmarking/k3_agentx_sweep.sh.
#
# A run below the model's native context replays only the traces that fit
# (the client logs how many), so it is a bring-up number, not a submission.
#
# HOW TO TRIGGER
# ──────────────
# Own Buildkite pipeline whose "Steps" setting is
#   DEV_PIPELINE_FILE=.buildkite/pipeline_k3_agentx_sweep.yml bash .buildkite/scripts/bootstrap_dev.sh
# then "New Build". Or select this file on vllm-torchtpu-dev with
# DEV_PIPELINE_FILE in the build env.
#
# KNOBS (build env; interpolated into the command at upload time because
# run_multihost.sh forwards only an allowlist of env vars into the containers)
#   K3_CONC_LIST         default 1,2,4,8   (none = GSM8K probe only)
#   K3_CTX               default 131072    (max-model-len; client filters traces above it)
#   K3_KV                default fp8       (fp8 | auto = bf16)
#   K3_APC               default 0         (1 = prefix caching + unified KV pool)
#   K3_SPEC              default none      (dspark = DSpark draft, synthetic acceptance)
#   K3_FAST              default 1         (1 = 20 min windows; 0 = canonical 30 min)
#   K3_GSM8K_LIMIT       default 100       (0 = skip the probe)
#   K3_GSM8K_CONC        default 8         (comma list = one GSM8K run per value)
#   K3_MOE_REQUANT       default 0         (512 = W4A8 MoE via MOE_REQUANTIZE_BLOCK_SIZE)
#   K3_EXTRA_SERVE_ARGS  default empty     (prepended to the serve command)
#   K3_IX_REF            default main      (InferenceX git ref to clone)
#   K3_GCS_ROOT          default empty     (no GCS copy; artifacts only)
#
# Runtime at the defaults: ~25 min boot + ~30 min per concurrency (fast mode).

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "K3 AgentX sweep conc ${K3_CONC_LIST:-1,2,4,8} ctx ${K3_CTX:-131072} kv ${K3_KV:-fp8} apc ${K3_APC:-0} spec ${K3_SPEC:-none} fast ${K3_FAST:-1} rq ${K3_MOE_REQUANT:-0} (TPU v7x-32)"
    key: k3_agentx_sweep
    depends_on: build_docker
    timeout_in_minutes: 600
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_agentx_sweep.sh --config kimi-k3-tp32-ep-agentx --results-dir /perf_eval_results/k3-agentx-sweep --conc-list ${K3_CONC_LIST:-1,2,4,8} --max-model-len ${K3_CTX:-131072} --kv ${K3_KV:-fp8} --apc ${K3_APC:-0} --spec ${K3_SPEC:-none} --fast ${K3_FAST:-1} --gsm8k-limit ${K3_GSM8K_LIMIT:-100} --gsm8k-conc ${K3_GSM8K_CONC:-8} --moe-requant ${K3_MOE_REQUANT:-0} --ix-ref ${K3_IX_REF:-main} --extra-serve-args \"${K3_EXTRA_SERVE_ARGS:-}\" --gcs-root \"${K3_GCS_ROOT:-}\""
    artifact_paths:
      - "perf_eval_results/**/*"
