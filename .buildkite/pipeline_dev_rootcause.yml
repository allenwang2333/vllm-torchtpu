# Root-cause phase for the conc-32 gsm8k collapse, now pinned to the one-hot
# MoE permute path (ONEHOT_MOE_PERMUTE_THRESHOLD=32768) on the pre-#170
# per-layer KV baseline. Two independent lines of evidence:
#   replay   reproduce the divergence in standalone JAX, no server
#   irdump   capture post-optimization HLO from the real server, both paths
# Trigger with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_rootcause.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 rootcause: standalone MoE replay"
    key: replay
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'python3 scripts/vllm/benchmarking/pr170_ab/moe_standalone_replay.py 2>&1 | tee /perf_eval_results/replay.log'
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "PR170 rootcause: IR dump onehot"
    key: irdump_onehot
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_ir_dump.sh onehot
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "PR170 rootcause: IR dump gather"
    key: irdump_gather
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_ir_dump.sh gather
    artifact_paths:
      - "perf_eval_results/**/*"
