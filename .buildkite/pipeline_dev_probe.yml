# Capacity probe for the tpu7x-32 pod: can a 1561 GB checkpoint be staged on
# local disk, and how much RAM does each host really have?
#
# Streaming K3 from GCS OOMs the host during load (builds 82 and 83, at 44% and
# 73%; projected resident ~1043 GB against 945 GB of RAM). Staging to local disk
# and letting the default loader mmap it is the alternative, but only if the
# disk exists. Read-only, seconds to run.

steps:
  - label: ":mag: tpu7x-32 pod capacity (disk + RAM, read-only)"
    key: tpu7x_32_capacity
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        echo "=== head node $(hostname)"
        df -h --output=target,size,avail,pcent / /tmp /mnt 2>/dev/null || df -h
        free -g | head -2
        echo "=== peers"
        for ip in $(gcloud compute tpus tpu-vm describe "$(curl -s -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/description)" --zone us-central1-c --format='value(networkEndpoints[].ipAddress)' | tr ';,' '  '); do
          echo "--- $ip"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_rsa "$ip" \
            "hostname; df -h / | tail -1; free -g | sed -n 2p" 2>&1 | head -4
        done
