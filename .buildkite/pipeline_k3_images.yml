# Rebuild the two images the Kimi-K3 CDK recipes use: this commit's dev image
# (the AgentX client) and the megakernel engine image. No TPU step.
#   DEV_PIPELINE_FILE=.buildkite/pipeline_k3_images.yml

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
    retry: &image_build_retry
      automatic:
        - exit_status: 1
          limit: 2

  - label: ":docker: Build Kimi-K3 megakernel engine image"
    key: k3_engine_image
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/build_k3_engine_image.sh
    retry: *image_build_retry
