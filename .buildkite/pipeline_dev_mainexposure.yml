# Main-branch exposure check: with the unified pool forced OFF (per-layer KV)
# and DEFAULT MoE envs, main auto-enables the one-hot permute (auto cap 512).
# If the batch-32 miscompile persists on main, this arm garbles at conc 32.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 main exposure: pool off, default envs, conc32"
    key: main_exposure
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_matrix_arm.sh onehot_default
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "PR170 main exposure: pool off, explicit onehot 32768, conc32"
    key: main_exposure_explicit
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_matrix_arm.sh repro_ctrl
    artifact_paths:
      - "perf_eval_results/**/*"
