# Validation/calibration run for the kimi-k3-tp32-ep nightly perf config:
# the exact pipeline_perf.yml step, minus the NIGHTLY gate. Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_perf.yml. Result JSONs land
# in the perf_eval_results artifacts; feed them to
# check_regression.py --mode perf --calibrate to (re)derive the baseline.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "Perf: kimi-k3-tp32-ep (TPU v7x-32)"
    key: perf_kimi_k3_tp32_ep
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep --results-dir /perf_eval_results/kimi-k3-tp32-ep"
    artifact_paths:
      - "perf_eval_results/**/*"
