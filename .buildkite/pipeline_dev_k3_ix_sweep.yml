# [branch-local] Kimi-K3 8k/1k InferenceX concurrency sweep (8..128) with
# per-concurrency GSM8K, on the tpu7x-32 pod. Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_ix_sweep.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "K3 InferenceX sweep 8k/1k conc 8-128 (TPU v7x-32)"
    key: k3_ix_sweep
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_ix_sweep.sh --config kimi-k3-tp32-ep-ix --results-dir /perf_eval_results/k3-ix --concs '8 16 32 64 128' --gsm8k-limit 200"
    artifact_paths:
      - "perf_eval_results/**/*"
