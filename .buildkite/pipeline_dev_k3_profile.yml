# One phase-classified decode window from the real Kimi-K3 on the v7x-32 pod.
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_profile.yml
#
# Needs run_multihost.sh's PASSTHROUGH_ENV_NAMES to carry USE_PHASED_PROFILER
# to the three worker hosts: the profiler is constructed per rank, so rank 0
# alone would classify nothing.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":mag: Profile: kimi-k3-tp32-ep decode window (TPU v7x-32)"
    key: k3_profile
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      USE_PHASED_PROFILER: "1"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep-profile --results-dir /perf_eval_results/kimi-k3-tp32-ep-profile"
      # 32 ranks of xplane.pb is not a per-file artifact upload.
      - "tar czf perf_eval_results/k3_profile_traces.tgz -C perf_eval_results kimi-k3-tp32-ep-profile/profile && rm -rf perf_eval_results/kimi-k3-tp32-ep-profile/profile"
      - "du -sh perf_eval_results/* || true"
    artifact_paths:
      - "perf_eval_results/**/*"
