# Where does the K3 surrogate's prefill time actually go, and does fp8 KV pay
# off at batch? Select with
#   DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_ladder.yml
#
# BK #313 showed 650 ms -> ~200 ms of TTFT between the shipped recipe and one
# built to select the MLA tuned row. Three knobs moved at once there. The
# ladder walks them one at a time, palindromically (L0..L4,L4..L0) so a linear
# drift over the job is orthogonal to every rung contrast.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":ladder: TTFT attribution ladder (shipped -> block 256 -> 4096 tok -> tuned row)"
    key: ladder
    depends_on: build_docker
    timeout_in_minutes: 300
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/k3_knob_matrix.sh --config kimi-k3-sliced8-tp8-ladder --results-dir /perf_eval_results/ladder --reps 3 --arms L0_ship,L1_blk256,L2_tok4096,L3_both,L4_hit,L4_hit,L3_both,L2_tok4096,L1_blk256,L0_ship"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: ":floppy_disk: fp8 KV at concurrency 1/4/16 (A-B-B-A-A-B)"
    key: fp8conc
    depends_on: build_docker
    timeout_in_minutes: 300
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    commands:
      - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/k3_knob_matrix.sh --config kimi-k3-sliced8-tp8-ep-conc --results-dir /perf_eval_results/fp8conc --reps 3 --arms base,fp8kv,fp8kv,base,base,fp8kv"
    artifact_paths:
      - "perf_eval_results/**/*"
