# Multi-host bring-up for tt, stage 3: Kimi-K3 on the tpu7x-32 pod, 8k/1k at
# batch size 1. Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3.yml
# so pipeline_dev.yml stays on the cheaper stage-2 rehearsal.
#
# Run this only after stage 2 (Kimi-Linear-48B on tpu_v7x_16_queue) is green:
# both go through the same tt class, so stage 2 clears the model and the
# launcher, leaving scale as the only new variable here.
#
# The slice is ranlihao-v7x-32 -- someone else's pod. Coordinate before running,
# and note its queue has been dispatch-paused before.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":rocket: tpu7x-32 multi-host Kimi-K3 8k/1k bs=1"
    key: tpu7x_32_k3
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      # 1561 GB of checkpoint, and runai_streamer defaults to
      # MemoryCapMode.unlimited -- it sizes its host buffer as the SUM of all
      # chunks, i.e. the whole checkpoint. On the pod that hit a Ray OOM kill at
      # 44% of the stream, head node at 898/944 GB (build 82). The serve command
      # therefore pins RUNAI_STREAMER_MEMORY_LIMIT to 16 GiB per worker via
      # --model-loader-extra-config; 8 workers per host is ~128 GiB of buffer
      # rather than everything.
      #
      # Each worker still READS the whole checkpoint and keeps only its shard --
      # tt has no sharded-read equivalent of tpu-inference's
      # K3_SHARDED_EXPERT_STREAMING -- so the cap trades load time for fitting in
      # RAM. Hence the 4-hour budget, same as tpu-inference-dev build 775.
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      # The CI image sets this to 1, making any compile at request time fatal.
      # The bench serves shapes the warmup sweep does not cover.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/k3 \
            --served-model-name moonshotai/Kimi-K3 \
            --port 8000 \
            --tensor-parallel-size 32 \
            --enable-expert-parallel \
            --max-model-len 9216 \
            --max-num-batched-tokens 512 \
            --max-num-seqs 1 \
            --compilation-config '{\"compile_sizes\":[16,64,256,512]}' \
            --model-loader-extra-config '{\"memory_limit\":17179869184}' \
            --attention-backend CUSTOM \
            --trust-remote-code \
            --language-model-only \
            --limit-mm-per-prompt '{\"image\":0,\"video\":0}' \
            --no-enable-prefix-caching \
            --no-async-scheduling \
            --load-format runai_streamer \
            --gpu-memory-utilization 0.9" \
          "python3 .buildkite/scripts/stage_tokenizer.py \
             gs://tpu-commons-ci/moonshootai/kimi/k3 /tmp/tok \
           && vllm bench serve \
            --host 127.0.0.1 --port 8000 \
            --model moonshotai/Kimi-K3 \
            --tokenizer /tmp/tok \
            --trust-remote-code \
            --dataset-name random \
            --random-input-len 8192 \
            --random-output-len 1024 \
            --random-range-ratio 0 \
            --num-prompts 10 \
            --max-concurrency 1 \
            --ignore-eos --seed 42 \
            --percentile-metrics ttft,tpot,itl,e2el \
            --metric-percentiles 50,90,99"
