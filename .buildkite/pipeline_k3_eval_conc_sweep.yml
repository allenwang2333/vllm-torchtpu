# Kimi-K3 accuracy vs client concurrency on the TPU v7x-32 pod (issue #841).
#
# WHAT IT DOES
# ────────────
# Boots the nightly Kimi-K3 server once (config kimi-k3-tp32-ep-concsweep:
# the nightly kimi-k3-tp32-ep serve flags with a 16k context, max-num-seqs
# 256 and matching compile buckets), then runs lm_eval for each task at each
# client concurrency in ascending order, draining the engine between points.
# summary.md and every point's lm_eval output/samples are uploaded as
# artifacts. Driver: scripts/vllm/benchmarking/k3_eval_conc_sweep.sh.
#
# HOW TO TRIGGER
# ──────────────
# Own Buildkite pipeline whose "Steps" setting is
#   DEV_PIPELINE_FILE=.buildkite/pipeline_k3_eval_conc_sweep.yml bash .buildkite/scripts/bootstrap_dev.sh
# then "New Build" on main (or any branch). Or select this file on
# vllm-torchtpu-dev with DEV_PIPELINE_FILE in the build env.
#
# KNOBS (build env; interpolated into the command at upload time because
# run_multihost.sh forwards only an allowlist of env vars into the containers)
#   K3_SWEEP_CONC_LIST     default 1,2,4,8,16,32,64,128,256
#   K3_SWEEP_TASKS         default mmlu_pro,gsm8k
#   K3_SWEEP_GSM8K_LIMIT   default 128   (questions; raised to 2*conc above 64)
#   K3_SWEEP_MMLU_LIMIT    default 10    (per subject x 14; raised to 2*conc/14 above 64)
#   K3_SWEEP_CTX           default 16384
#   K3_SWEEP_MAX_NUM_SEQS  default 256
#   K3_SWEEP_GCS_ROOT      default empty (no GCS copy; artifacts only)
#
# Runtime: ~20 min boot + ~90 min sweep at the defaults (timeout 7 h).

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "K3 accuracy vs eval concurrency ${K3_SWEEP_CONC_LIST:-1,2,4,8,16,32,64,128,256} tasks ${K3_SWEEP_TASKS:-mmlu_pro,gsm8k} ctx ${K3_SWEEP_CTX:-16384} max-num-seqs ${K3_SWEEP_MAX_NUM_SEQS:-256} (TPU v7x-32)"
    key: k3_eval_conc_sweep
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_eval_conc_sweep.sh --results-dir /perf_eval_results/k3-eval-conc-sweep --conc-list ${K3_SWEEP_CONC_LIST:-1,2,4,8,16,32,64,128,256} --tasks ${K3_SWEEP_TASKS:-mmlu_pro,gsm8k} --gsm8k-limit ${K3_SWEEP_GSM8K_LIMIT:-128} --mmlu-limit ${K3_SWEEP_MMLU_LIMIT:-10} --ctx ${K3_SWEEP_CTX:-16384} --max-num-seqs ${K3_SWEEP_MAX_NUM_SEQS:-256} --gcs-root \"${K3_SWEEP_GCS_ROOT:-}\""
    artifact_paths:
      - "perf_eval_results/**/*"
