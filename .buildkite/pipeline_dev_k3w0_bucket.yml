# Is the decode token bucket of 16 costing 16x at concurrency 1?
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3w0_bucket.yml
#
# `tpu_runner.py:632` sets `num_tokens_paddings = compile_sizes`, so the decode
# batch pads to the smallest compiled size. Every K3 config ever run pins that
# at 16 -- `_get_token_paddings(min_token_size=16, ...)` when compile_sizes is
# unset (tpu_platform.py:915), and our configs then set [16, 8192] by hand. So
# "1 real token padded to 16" is a *choice in the config*, not a floor.
#
# BK #316 pays 2055.1 us of routing/permute, 1085.5 us of AttentionResidual and
# a routed gmm at m=256 on that padding. The three arms differ in exactly one
# token of the serve command line and are otherwise byte-identical, and they
# run concurrently on tpu_v7x_8_queue's 18 agents.
#
# PRE-REGISTERED: bucket 8 saves 10..20% of surrogate device busy and bucket 1
# saves 25..45%, both concentrated in routing/permute, AttentionResidual, the
# gmm and the per-token projections; the MoE latent projections (weight-stream
# bound, 61% of HBM peak) move less than 3%, and the MLA decode kernel (KV-read
# bound) moves less than 5%. If bucket 1 does not compile, that is the answer
# and `[1, 8, 8192]` in the yml is why the 8 arm exists as well.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":mag: bucket 8 (compile_sizes [8,8192])"
    key: k3w0_b8
    depends_on: build_docker
    timeout_in_minutes: 120
    agents: { queue: tpu_v7x_8_queue }
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
      USE_PHASED_PROFILER: "1"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/k3_profile_run.sh run_in_docker.sh kimi-k3-sliced8-tp8-w0bucket8 k3w0b8"
      - "du -sh perf_eval_results/* || true"
    artifact_paths: ["perf_eval_results/**/*"]

  - label: ":mag: bucket 1 (compile_sizes [1,8,8192])"
    key: k3w0_b1
    depends_on: build_docker
    timeout_in_minutes: 120
    agents: { queue: tpu_v7x_8_queue }
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "5400"
      USE_PHASED_PROFILER: "1"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/k3_profile_run.sh run_in_docker.sh kimi-k3-sliced8-tp8-w0bucket1 k3w0b1"
      - "du -sh perf_eval_results/* || true"
    artifact_paths: ["perf_eval_results/**/*"]
