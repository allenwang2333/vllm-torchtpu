    # ---------------------------------------------------------
    # BENCHMARK -- throughput/latency baseline through the disagg proxy.
    #
    # Shape: 64K input / 1K output (RANDOM_INPUT_LEN below).
    # To run the 32K/1K leg instead, set RANDOM_INPUT_LEN=32768; the
    # baseline report compares both side by side.
    #
    # 64K in + 1K out = 65536 tokens, inside --max-model-len 81920.
    # Concurrency is kept low: at 64K per request the prefill block pool
    # is the binding constraint, and over-subscribing it makes Raiden
    # sends queue rather than measuring steady-state transfer.
    # ---------------------------------------------------------
    - name: benchmark
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          # Hard cap. A server that hits a fatal error can stop logging
          # without the container exiting, so the Job never goes Failed and
          # the JobSet waits on the bench pod. One run burned 8h28m that way
          # after failing at 59 min. 90 min is ~3x a healthy end-to-end run.
          activeDeadlineSeconds: 7200
          template:
            spec:
              containers:
              - name: sidecar-bench
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/bench:reneezhu
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -o pipefail
                    PREFILLER_DNS="${JS_NAME}-prefill-0-0.${JS_NAME}"
                    DECODER_DNS="${JS_NAME}-decode-0-0.${JS_NAME}"
                    export PREFILLER_DNS DECODER_DNS
                    # ONE shared deadline for "both servers up", not two
                    # sequential per-server waits. Sequential waits add up: two
                    # 30-minute loops could exceed the job's activeDeadline on
                    # their own, and a slow prefill used to consume the whole
                    # prefill budget before decode was even polled.
                    #
                    # 397B startup observed at ~25 min with one prefill compile
                    # bucket. Adding the 4608 bucket pushed it past 30 min, the
                    # bench abandoned prefill mid-compile and then ran every
                    # shape against a server that was never up (0/32 on both,
                    # including the 32K shape that had passed 32/32). Budget is
                    # now 55 min for all servers combined.
                    SERVERS_DEADLINE=$(( $(date +%s) + SERVER_WAIT_S ))
                    wait_up() {
                      local name="$1" url="$2"
                      echo "Waiting for ${name} up (shared deadline)"
                      while [ "$(date +%s)" -lt "$SERVERS_DEADLINE" ]; do
                        if curl -s -m 5 "$url" > /dev/null; then
                          echo "${name} up at $(( SERVER_WAIT_S - (SERVERS_DEADLINE - $(date +%s)) ))s"
                          return 0
                        fi
                        sleep 10
                      done
                      echo "RESULT: FAIL (${name} not healthy within ${SERVER_WAIT_S}s)"
                      return 1
                    }
                    wait_up prefill "http://$PREFILLER_DNS:8000/health" || exit 1
                    wait_up decode  "http://$DECODER_DNS:7200/health"  || exit 1
                    echo "Waiting for proxy up"
                    # toy_proxy_server.py exposes ONLY POST /v1/completions and
                    # POST /v1/chat/completions -- it has no /health route, so
                    # polling /health returns 404 forever. Any HTTP status at all
                    # (404/405 included) proves uvicorn is listening and routing;
                    # curl exit 000 means nothing is accepting connections yet.
                    proxy_code() {
                      curl -s -o /dev/null -m 5 -w '%{http_code}' \
                        "http://$PREFILLER_DNS:10000/v1/completions" 2>/dev/null || echo 000
                    }
                    for i in $(seq 1 60); do
                      [ "$(proxy_code)" != "000" ] && break
                      sleep 10
                    done
                    PROXY_CODE="$(proxy_code)"
                    echo "proxy probe http_code=$PROXY_CODE"
                    [ "$PROXY_CODE" != "000" ] || {
                      echo "RESULT: FAIL (proxy not accepting connections)"; exit 1; }
                    # Raise aiohttp's per-line cap in the bench client before running.
                    # The single failing 64K request was NOT a server rejection: it
                    # died client-side in
                    #   async for chunk_bytes in response.content
                    #     -> aiohttp streams.readline -> readuntil(max_size=max_line_length)
                    # i.e. one streamed SSE data: line exceeded aiohttp's default
                    # 8190-byte line limit. vLLM had already accepted and served the
                    # request, which is why no server log ever showed an error, why
                    # 32K never hit it, and why it was independent of concurrency
                    # (8, 4 and 1 all gave exactly one loss). The cap is NOT
                    # max_line_size (that governs header parsing only): streams.py
                    # readuntil does `max_size = max_size or self._high_water`, and
                    # _high_water is 2 x read_bufsize = 2 x 65536 = 131072. So the
                    # knob is read_bufsize; 8 MiB gives a 16 MiB line cap.
                    sed -i 's/aiohttp.ClientSession(trust_env=True,/aiohttp.ClientSession(trust_env=True, read_bufsize=8388608,/g' \
                      /bench_serving/backend_request_func.py
                    echo "patched ClientSession call sites: $(grep -c 'read_bufsize=8388608' /bench_serving/backend_request_func.py)"
                    # Warmup uses benchmark_serving's built-in --num-warmups,
                    # not a separate invocation. It runs in-process, honours
                    # --max-concurrency (so it warms the concurrent path the leg
                    # actually uses) and is excluded from the reported metrics.
                    # A separate pre-run at concurrency 1 warmed the wrong path
                    # and still left one cold-start failure in the measured leg
                    # (warmup 1/2, leg 31/32).
                    run_leg() {
                      local NAME="$1" PREFIX_LEN="$2" INPUT_LEN="$3" CONC="$4"
                      local OUT="/tmp/leg_${NAME}.out"
                      echo "===== LEG ${NAME} prefix=${PREFIX_LEN} input=${INPUT_LEN} output=${RANDOM_OUTPUT_LEN} conc=${CONC} ====="
                      python3 benchmark_serving.py \
                        --model="$SERVED_MODEL" --tokenizer="$TOKENIZER_ID" \
                        --host="$PREFILLER_DNS" --port=10000 --backend=vllm \
                        --dataset-name=random \
                        --random-prefix-len="$PREFIX_LEN" \
                        --random-input-len="$INPUT_LEN" \
                        --random-output-len="$RANDOM_OUTPUT_LEN" \
                        --num-prompts="$NUM_PROMPTS" --max-concurrency="$CONC" \
                        --ignore-eos --request-rate=inf \
                        --num-warmups="$WARMUP_PROMPTS" \
                        --save-result --save-detailed \
                        --result-dir /tmp --result-filename "leg_${NAME}.json" \
                        --percentile-metrics=ttft,tpot,itl,e2el \
                        --metadata leg="${NAME}" topology=pcp8_to_dp8 \
                                   connector=TPURaidenConnector unified_block_pool=1 \
                                   prefix_caching=1 offloading=1 \
                                   concurrency="${CONC}" 2>&1 | tee "$OUT"
                      local RC=${PIPESTATUS[0]}
                      # benchmark_serving.py exits 0 even when every request fails, so
                      # assert on the completed-request count as well. Without this a run
                      # where 0/32 requests succeeded still reported the job as Succeeded.
                      local SUCC
                      SUCC="$(sed -nE 's/^Successful requests: *([0-9]+).*/\1/p' "$OUT" | tail -1)"
                      SUCC="${SUCC:-0}"
                      echo "===== LEG ${NAME} exit=${RC} successful=${SUCC}/${NUM_PROMPTS} ====="
                      # benchmark_serving only keeps per-request "errors" when
                      # --save-detailed is set. Print the distinct non-empty ones:
                      # counts alone cannot tell us why a request failed, and
                      # inferring from them has been wrong repeatedly.
                      python3 - "$NAME" <<'PYERR' || true
                    import json, sys, collections, glob
                    name = sys.argv[1]
                    for p in glob.glob(f"/tmp/leg_{name}.json") + glob.glob(f"/tmp/*leg_{name}*.json"):
                        try: d = json.load(open(p))
                        except Exception as e: print(f"ERRDUMP {p}: unreadable {e}"); continue
                        errs = [e for e in (d.get("errors") or []) if e]
                        print(f"ERRDUMP {p}: {len(errs)} failed request(s)")
                        for msg, n in collections.Counter(errs).most_common(5):
                            print(f"ERRDUMP   x{n}: {str(msg)[:2000]}")
                        break
                    PYERR
                      if [ "$RC" != "0" ] || [ "$SUCC" -lt "$NUM_PROMPTS" ]; then
                        echo "RESULT: FAIL (leg ${NAME}: only ${SUCC}/${NUM_PROMPTS} requests succeeded)"
                        return 1
                      fi
                      return 0
                    }
                    # ---- one-shot diagnostic: capture the actual rejection body ----
                    # 64512-token requests fail with 400 on /v1/completions/render
                    # while 32768 succeeds. Nothing logs the response body, so send
                    # one full-size request and print status + body verbatim before
                    # the measured shapes run. Cheap (seconds) and removes guesswork.
                    echo "===== DIAGNOSTIC: isolate the 64K rejection ====="
                    # A 64512-token request sent as TOKEN IDS, non-streaming, no
                    # ignore_eos returned 200 OK. The bench sends TEXT, stream=True,
                    # ignore_eos=True. Tokenization was verified identical (64512
                    # in, 64512 out, no special tokens), so vary the remaining
                    # fields one at a time and print each response body.
                    python3 - <<'PYPROBE' || echo "probe script failed (non-fatal)"
                    import json, os, urllib.request, urllib.error
                    host=os.environ["PREFILLER_DNS"]; model=os.environ["SERVED_MODEL"]
                    n=int(os.environ["RANDOM_INPUT_LEN"]); out=int(os.environ["RANDOM_OUTPUT_LEN"])
                    url=f"http://{host}:10000/v1/completions"
                    def post(tag, body):
                        req=urllib.request.Request(url, data=json.dumps(body).encode(),
                                                   headers={"Content-Type":"application/json"})
                        try:
                            with urllib.request.urlopen(req, timeout=300) as r:
                                d=r.read(200)
                                print(f"PROBE[{tag}] -> {r.status} OK body[:200]={d!r}", flush=True)
                        except urllib.error.HTTPError as e:
                            print(f"PROBE[{tag}] -> {e.code} BODY={e.read(1500).decode('utf-8','replace')}", flush=True)
                        except Exception as e:
                            print(f"PROBE[{tag}] -> EXC {type(e).__name__}: {e}", flush=True)
                    ids=[1234]*n
                    base={"model":model,"prompt":ids,"temperature":0.0,"max_tokens":out}
                    post("ids_plain", dict(base))
                    post("ids_ignore_eos", dict(base, ignore_eos=True))
                    post("ids_stream", dict(base, stream=True, stream_options={"include_usage":True}))
                    post("ids_stream_ignore_eos", dict(base, stream=True,
                         stream_options={"include_usage":True}, ignore_eos=True, best_of=1, logprobs=None))
                    # exactly what the bench sends, but max_tokens reduced by 1 so
                    # prompt+max_tokens is 65535 rather than exactly 65536
                    post("ids_stream_eos_minus1", dict(base, max_tokens=out-1, stream=True,
                         stream_options={"include_usage":True}, ignore_eos=True, best_of=1, logprobs=None))
                    PYPROBE
                    echo "===== DIAGNOSTIC END ====="
                    FAIL=0
                    # Baseline report shapes: 64K/1K and 32K/1K, run back to
                    # back so they can be compared side by side. Neither uses
                    # a shared prefix -- every prompt is unique.
                    # Concurrency is per-shape, not global. vLLM reports
                    #   GPU KV cache size: 381,300 tokens
                    #   Maximum concurrency for 65,536 tokens per request: 5.82x
                    # so 8 concurrent 64K requests cannot be admitted (we saw
                    # 1/32 succeed). 32K needs 33,792 tokens/req -> 11.3x, so 8
                    # is comfortable there. Server flags stay identical across
                    # shapes; only the client load differs.
                    run_leg "64k" 0 "$RANDOM_INPUT_LEN"  "$CONCURRENCY_64K" || FAIL=1
                    run_leg "32k" 0 "$SECOND_INPUT_LEN"  "$MAX_CONCURRENCY" || FAIL=1
                    # NOTE: reaching the CPU offload tier requires a shared
                    # prefix of at least ONE PCP8 scheduler block. With
                    # block_size 8192 that is 8192*8 = 65536 tokens, so no
                    # 64K-total prompt can reach it -- that leg needs ~128K
                    # total prompts and max_model_len raised to match.
                    echo "ALL_LEGS_DONE fail=${FAIL}"
                    exit $FAIL
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  # bench sends --model as the request payload name, so it must
                  # match the servers' --served-model-name. The tokenizer comes
                  # separately from the HF repo id (a few MB, not the checkpoint).
                  - name: SERVED_MODEL
                    value: "Qwen3.5-397B-A17B-FP8"
                  - name: TOKENIZER_ID
                    value: "Qwen/Qwen3.5-397B-A17B-FP8"
                  # 64K/1K primary shape; set to 32768 for the 32K/1K leg.
                  - name: RANDOM_INPUT_LEN
                    value: "64512"
                  - name: RANDOM_OUTPUT_LEN
                    value: "1024"
                  # Second reported shape (32K/1K).
                  - name: SECOND_INPUT_LEN
                    value: "32768"
                  - name: WARMUP_PROMPTS
                    value: "4"
                  - name: NUM_PROMPTS
                    value: "32"
                  - name: MAX_CONCURRENCY
                    value: "8"
                  # Under the 5.82x ceiling the KV pool allows at 64K.
                  - name: CONCURRENCY_64K
                    value: "4"
                  # Shared budget for all servers to become healthy.
                  - name: SERVER_WAIT_S
                    value: "3300"
                resources:
                  requests: { cpu: "8", memory: "32Gi" }
                  limits: { cpu: "16", memory: "64Gi" }
              restartPolicy: Never