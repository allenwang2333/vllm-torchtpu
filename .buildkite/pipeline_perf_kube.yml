# SAMPLE BRANCH ONLY, do not merge. The perf lane is cut down to the Kimi-K3
# 1P1D step, without its NIGHTLY gate or the nightly steps it normally waits
# for, so a manual build (CI_FLEET=kube, CI_LANES=perf) runs that step alone.

env:
  ARTIFACTS_DIR: "perf_eval_results"

x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

steps:
  # Prefill TP8 x DP4 x EP32 to decode TP8 x DP4 x EP32, each on its own 2x2x4
  # slice.
  - label: ":kubernetes: Perf/Eval: Nightly Kimi-K3 1P1D (TPU v7x 2x2x4 x2)"
    key: "perf_nightly_kimi_k3_1p1d"
    depends_on:
      - "build_docker"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/kubernetes/run_multihost.sh --manifest kimi-k3-1p1d-4dp8tp.yaml
