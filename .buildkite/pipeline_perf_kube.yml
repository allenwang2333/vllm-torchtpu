# The perf/eval suite on the Kueue fleet. Keys and labels match
# pipeline_perf.yml so the two read side by side.

# Every step here writes its results under this directory and the pod uploads
# whatever it finds there. Declared once for the pipeline rather than per step:
# it is a property of this lane, not of any one benchmark.
env:
  ARTIFACTS_DIR: "perf_eval_results"

x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

# Under the workload's step budget: the workload's deadline starts at admission
# and the step's at the agent pod, so a workload given the whole step budget is
# killed by Buildkite mid-report and loses its artifacts.
x-eval-runtime: &eval_runtime "18000"

x-perf-step-defaults: &perf_step
  depends_on:
    - "build_docker"
  # Matches the quota: eight v7x chips, four to a step. More would stage faster
  # but every pod loading a model rewrites refs/<rev> in the shared bucket, and
  # a pod holding a handle across another's rewrite gets
  # OSError: [Errno 116] Stale file handle.
  concurrency_group: "tpu/v7x"
  concurrency: 2
  # Covers queueing as well as running, so it cannot be set from how long the
  # work takes. The sum of the launcher's two limits, so a step is stopped by
  # whichever of those it exceeded and not by this.
  timeout_in_minutes: 1440
  agents:
    queue: "kube"

# Eight TensorCores, which is four v7x chips on one host. Machine type names
# chips, the queue names cores, so the two numbers differ for one shape.
x-shape-8-core: &shape_8_core "tpu7x-standard-4t/2x2x1"
x-shape-2-core: &shape_2_core "tpu7x-standard-1t/1x1x1"

steps:
  # Repeated from pipeline_build.yml because this pipeline is uploaded on its
  # own rather than beside that one.
  - label: ":docker: Build and Push CI Image"
    key: "build_docker"
    timeout_in_minutes: 120
    agents:
      queue: cpu_64_core
    commands:
      # setup_docker_env.sh reads the pinned vLLM commit from build metadata,
      # which bootstrap.sh publishes only for the bare-metal pipeline slugs, so
      # this lane resolves it from the same pyproject.toml pin itself.
      - |
        source .buildkite/scripts/configs/pipeline_config.sh
        buildkite-agent meta-data set VLLM_COMMIT_HASH \
          "${VLLM_COMMIT_HASH_OVERRIDE:-$(get_vllm_commit_hash)}"
      - bash .buildkite/scripts/setup_docker_env.sh

  # Kimi-K3 on one 2x2x4 slice, four hosts of four chips: the tpu7x-32 pod the
  # bare-metal step runs on. That shape has a queue and chips of its own, so
  # this waits only for the image, not for the v7x-8 and v7x-16 steps above.
  - label: ":kubernetes: Perf/Eval: Nightly kimi-k3-tp32-ep (TPU v7x-32)"
    key: "perf_nightly_kimi_k3_tp32_ep"
    depends_on: "build_docker"
    if: 'build.env("NIGHTLY") == "1"'
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "1"
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/kubernetes/run_multihost.sh --topology 2x2x4 bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep --run-lm-eval
