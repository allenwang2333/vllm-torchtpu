# Smoke test of a published release image: offline generation, then server
# bring-up with a few online requests, on kube from the image as it is.
#
# Run it from the vllm-torchtpu-dev pipeline with
#   DEV_PIPELINE_FILE=.buildkite/pipeline_dev_release_smoke.yml
#   CI_IMAGE=<release prod image, pinned by digest>
# The steps run the scripts baked into that image, so they exercise the
# release's own code; only this file and the launcher come from the branch.
# The prod image has no test or benchmark extras, so nothing here needs pytest
# or lm-eval.

steps:
  - label: ":docker: Use the given release image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":tpu: offline: offline_inference.py Qwen3-0.6B (1 chip)"
    key: offline_qwen3_0_6b
    depends_on: build_docker
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-1t/1x1x1"
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c '
          set -euo pipefail
          python3 -c "import importlib.metadata as m; [print(p, m.version(p)) for p in (\"vllm\", \"vllm-torchtpu-core\", \"torch\", \"torch-tpu\", \"jax\", \"libtpu\", \"tpu-sync-torch\")]"
          python3 examples/offline_inference.py \
            --model Qwen/Qwen3-0.6B \
            --max-model-len 256 \
            --max-num-batched-tokens 256 \
            --max-tokens 32'

  - label: ":tpu: online: vllm serve Qwen3-0.6B + requests (1 chip)"
    key: online_qwen3_0_6b
    depends_on: build_docker
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-1t/1x1x1"
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c '
          set -euo pipefail
          M=Qwen/Qwen3-0.6B
          vllm serve $$M --max-model-len 1024 --port 8000 > /tmp/serve.log 2>&1 &
          trap "echo --- server log tail; tail -60 /tmp/serve.log" EXIT
          for i in $$(seq 1 90); do curl -sf localhost:8000/health >/dev/null && break; sleep 10; done
          curl -sf localhost:8000/health >/dev/null
          echo "--- server healthy after about $$((i * 10)) s"
          curl -sf localhost:8000/v1/models; echo
          echo "--- completion"
          curl -sf localhost:8000/v1/completions -H "Content-Type: application/json" \
            -d "{\"model\": \"$$M\", \"prompt\": \"The capital of France is\", \"max_tokens\": 16, \"temperature\": 0}" \
            | python3 -c "import json, sys; t = json.load(sys.stdin)[\"choices\"][0][\"text\"]; print(repr(t)); assert t.strip()"
          echo "--- chat completion"
          curl -sf localhost:8000/v1/chat/completions -H "Content-Type: application/json" \
            -d "{\"model\": \"$$M\", \"messages\": [{\"role\": \"user\", \"content\": \"Name three primary colors.\"}], \"max_tokens\": 64, \"temperature\": 0}" \
            | python3 -c "import json, sys; t = json.load(sys.stdin)[\"choices\"][0][\"message\"][\"content\"]; print(repr(t)); assert t.strip()"
          echo "--- streaming completion"
          curl -sfN localhost:8000/v1/completions -H "Content-Type: application/json" \
            -d "{\"model\": \"$$M\", \"prompt\": \"Count from one to five:\", \"max_tokens\": 24, \"temperature\": 0, \"stream\": true}" > /tmp/stream.txt
          grep -c "^data: {" /tmp/stream.txt; grep -q "^data: \[DONE\]" /tmp/stream.txt
          echo "--- 16 concurrent completions"
          pids=()
          for n in $$(seq 1 16); do
            curl -sf localhost:8000/v1/completions -H "Content-Type: application/json" \
              -d "{\"model\": \"$$M\", \"prompt\": \"Request $$n: write one sentence about TPUs.\", \"max_tokens\": 32}" -o /tmp/c$$n.json &
            pids+=($$!)
          done
          # Only the requests: a bare wait would also wait on the server.
          for p in "$${pids[@]}"; do wait "$$p"; done
          python3 -c "import json; r = [json.load(open(f\"/tmp/c{n}.json\"))[\"choices\"][0][\"text\"] for n in range(1, 17)]; print(len(r), \"responses, all non-empty:\", all(t.strip() for t in r)); assert all(t.strip() for t in r)"'

  - label: ":tpu: online: vllm serve Qwen3-8B TP=4 + requests (4 chips)"
    key: online_qwen3_8b_tp4
    depends_on: build_docker
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-4t/2x2x1"
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c '
          set -euo pipefail
          M=Qwen/Qwen3-8B
          vllm serve $$M --tensor-parallel-size 4 --max-model-len 2048 --port 8000 > /tmp/serve.log 2>&1 &
          trap "echo --- server log tail; tail -60 /tmp/serve.log" EXIT
          for i in $$(seq 1 120); do curl -sf localhost:8000/health >/dev/null && break; sleep 10; done
          curl -sf localhost:8000/health >/dev/null
          echo "--- server healthy after about $$((i * 10)) s"
          echo "--- completion"
          curl -sf localhost:8000/v1/completions -H "Content-Type: application/json" \
            -d "{\"model\": \"$$M\", \"prompt\": \"The capital of France is\", \"max_tokens\": 16, \"temperature\": 0}" \
            | python3 -c "import json, sys; t = json.load(sys.stdin)[\"choices\"][0][\"text\"]; print(repr(t)); assert t.strip()"
          echo "--- chat completion"
          curl -sf localhost:8000/v1/chat/completions -H "Content-Type: application/json" \
            -d "{\"model\": \"$$M\", \"messages\": [{\"role\": \"user\", \"content\": \"Explain in two sentences what a TPU is.\"}], \"max_tokens\": 128, \"temperature\": 0}" \
            | python3 -c "import json, sys; t = json.load(sys.stdin)[\"choices\"][0][\"message\"][\"content\"]; print(repr(t)); assert t.strip()"
          echo "--- 16 concurrent completions"
          pids=()
          for n in $$(seq 1 16); do
            curl -sf localhost:8000/v1/completions -H "Content-Type: application/json" \
              -d "{\"model\": \"$$M\", \"prompt\": \"Request $$n: write one sentence about TPUs.\", \"max_tokens\": 32}" -o /tmp/c$$n.json &
            pids+=($$!)
          done
          # Only the requests: a bare wait would also wait on the server.
          for p in "$${pids[@]}"; do wait "$$p"; done
          python3 -c "import json; r = [json.load(open(f\"/tmp/c{n}.json\"))[\"choices\"][0][\"text\"] for n in range(1, 17)]; print(len(r), \"responses, all non-empty:\", all(t.strip() for t in r)); assert all(t.strip() for t in r)"'
