# Component bisect for the bucket-32 one-hot miscompute: broken-era code
# (74d86c2fc) with a SINGLE dependency pin bumped to current main's version.
# Arm config: run_matrix_arm.sh repro_ctrl (the known-garbage trigger).
# Clean result => the bumped component's update changes the composed graph
# enough to dodge the latent codegen bug; garbage => component exonerated.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 bisect: repro_ctrl @ conc32"
    key: bisect_arm
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_matrix_arm.sh repro_ctrl
    artifact_paths:
      - "perf_eval_results/**/*"
