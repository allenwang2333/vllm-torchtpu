# Masking-commit bisect: pool forced OFF (typed-view/per-layer path) with the
# repro env; find the first commit where conc-32 gsm8k goes clean.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - docker system prune -af || true
      - df -h / | tail -1
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "PR170 bisect: repro_ctrl pool-off @ conc32"
    key: bisect_arm
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash scripts/vllm/benchmarking/pr170_ab/run_matrix_arm.sh repro_ctrl
    artifact_paths:
      - "perf_eval_results/**/*"
