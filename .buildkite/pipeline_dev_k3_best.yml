# Kimi-K3 on the tpu7x-32 pod at the best flag set found by the round 1-4 A/B
# campaign, on stock main with NO SOURCE CHANGES, plus a dummy-weight A/B twin
# on the same hardware and image. Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_best.yml.
#
# The two pod steps are chained, not parallel: there is exactly one v7x-32
# agent in the org, and the real-weight number is the one that must not be put
# at risk by the experimental arm.
#
# NOTE for anyone reaching for .buildkite/pipeline_dev_k3_gcs.yml instead: that
# file is stale. It passes a serve command and a bench command as two arguments
# to run_multihost.sh, which is the pre-#483 interface; today's runner execs
# "$@" as a single argv in the head container, so argv[0] becomes the whole
# serve string and the cell dies with "No such file or directory". It also
# calls .buildkite/scripts/stage_tokenizer.py, which never landed on main.
# Both are fixed here by going through run_eval_flow.sh, which is the interface
# every working multihost step in pipeline_perf.yml uses.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":rocket: K3 TP32 best-known flags on main, REAL weights (8k/1k)"
    key: k3_best_real
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      # Budget for the 1561 GB EP-sharded stream plus a cold XLA compile.
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      # The CI image sets this to 1, making any compile at request time fatal.
      # The bench serves shapes the warmup sweep does not cover.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
      # A flag-comparison run has no business writing to the perf database.
      SKIP_DB_UPLOAD: "1"
      # Every value in this block must be space-free: run_multihost_ray.sh
      # interpolates the passthrough env unquoted into the worker ssh command
      # line, and builds 341/342 died pulling an image named '2:8' -- the
      # second word of a prompt-count table. The recipe lives in the config
      # file for that reason.
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep-best --results-dir /perf_eval_results/k3-best-real"
      - "du -sh perf_eval_results/* || true"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: ":game_die: K3 TP32 best-known flags on main, DUMMY weights (8k/1k)"
    key: k3_best_dummy
    # Chained behind the real arm on purpose (single shared agent), and allowed
    # to run even if it failed: an infrastructure failure on the real arm says
    # nothing about this one, and pod slots are scarce.
    depends_on: k3_best_real
    allow_dependency_failure: true
    timeout_in_minutes: 300
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      VLLM_XLA_CHECK_RECOMPILATION: "0"
      SKIP_DB_UPLOAD: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep-best-dummy --results-dir /perf_eval_results/k3-best-dummy"
      - "du -sh perf_eval_results/* || true"
    artifact_paths:
      - "perf_eval_results/**/*"
