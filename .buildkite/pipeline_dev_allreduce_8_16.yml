# [branch-local] The 112-MiB all-reduce microbench on smaller slices, to tell
# whether the fused SparseCore all-reduce is slow only across hosts / on the
# 2x2x4 mesh: tpu7x-8 (one host, 2x2x1 chips) and tpu7x-16 (two hosts, 2x2x2).
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_allreduce_8_16.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "112-MiB all-reduce microbench (TPU v7x-8, single host)"
    key: allreduce_bench_8
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: "tpu_v7x_8_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - ".buildkite/scripts/run_in_docker.sh bash /root/torchtpu-vllm/scripts/allreduce_variants.sh baseline rs_ag rs_only ag_only chunks2 decode_16tok"
      - |
        out=perf_eval_results/allreduce
        find "$$out" -name 'results_node0.jsonl' -o -name '*.xplane.pb' | sed 's/^/  /' || true
        dest="gs://cuiq-inference-test/woosuk1/build-$${BUILDKITE_BUILD_NUMBER}-8chip"
        gcloud storage cp -r perf_eval_results/* "$$dest/" && echo "uploaded to $$dest" || echo "GCS upload failed"
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "112-MiB all-reduce microbench (TPU v7x-16, two hosts)"
    key: allreduce_bench_16
    depends_on: build_docker
    timeout_in_minutes: 90
    agents:
      queue: "tpu_v7x_16_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh --backend torchrun scripts/allreduce_variants.sh baseline rs_ag rs_only ag_only chunks2 decode_16tok"
      - |
        out=perf_eval_results/allreduce
        find "$$out" -name 'results_node0.jsonl' -o -name '*.xplane.pb' | sed 's/^/  /' || true
        dest="gs://cuiq-inference-test/woosuk1/build-$${BUILDKITE_BUILD_NUMBER}-16chip"
        gcloud storage cp -r perf_eval_results/* "$$dest/" && echo "uploaded to $$dest" || echo "GCS upload failed"
    artifact_paths:
      - "perf_eval_results/**/*"
