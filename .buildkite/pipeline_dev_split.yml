# Validation for the unit-test queue split: run the "not multichip" set on a
# 2-chip agent and the "multichip" set on an 8-chip agent, mirroring the new
# pipeline_tests.yml layout.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "split-validation: general set on tpu_v7x_2"
    key: split_general_2chip
    depends_on: build_docker
    timeout_in_minutes: 90
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
          pytest -sv --timeout=600 -m "not nightly and not multichip" \
            --ignore=tests/entrypoints/llm/test_speculative_decoding.py \
            tests/'

  - label: "split-validation: multichip set on tpu_v7x_8"
    key: split_multichip_8chip
    depends_on: build_docker
    timeout_in_minutes: 60
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
          pytest -sv --timeout=600 -m "not nightly and multichip" \
            --ignore=tests/entrypoints/llm/test_speculative_decoding.py \
            tests/'
