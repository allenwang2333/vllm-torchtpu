# 1P1D end-to-end benchmark aligned with aios-tpu-infra/tpu_benchmark_daily.
#
# Server engine flags and performance-relevant env are mirrored verbatim from
# that repository's launch scripts so that the delta between our e2e numbers
# and their prefill-only / decode-only numbers isolates the KV-transfer and
# proxy overhead:
#   - prefill server <- scripts/start_dp_server.sh        (DP8/TP1/EP8 prefill)
#   - decode  server <- scripts/start_dp_decode_server.sh (TP1/DP8/EP8 C256 decode)
#   - workload       <- scripts/bench_all.sh (8192/1 concurrency sweep),
#                       scripts/bench_prefill_ttft.sh (single-request TTFT),
#                       and the C256/P65536/D1024 decode protocol (smoke +
#                       three independent rounds).
#
# Intentional deviations from tpu_benchmark_daily (everything else matches):
#   - TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL=0 on both roles (they set 1): the v1
#     HMA connector needs the typed per-layer KV layout; the unified pool
#     exposes GDN layers as [pool] which it cannot register.
#   - --mamba-cache-mode=align stays on the prefill server (their standalone
#     prefill omits it): disagg requires the aligned mamba cache layout on
#     both ends of the transfer.
#   - --kv-transfer-config / TPU_KV_* / TPU_HMA_* transfer env exist only
#     here; the daily rig benchmarks each role standalone with no transfer.
#   - --trust-remote-code + HF model id instead of their local checkpoint
#     dir; PVC-backed VLLM_XLA_CACHE_PATH and VLLM_ENGINE_READY_TIMEOUT_S=7200
#     are container startup plumbing (their rig clears caches per run) —
#     startup-only, no steady-state perf effect.
#   - TTFT sweep stops at 65536 input tokens: their 131072/258048 lengths
#     exceed the decode server's max-model-len of 66560 (65536+1024), which
#     is itself part of their decode config.
#   - Decode rounds send 256 requests through the proxy's load balancing;
#     their client pins 32 requests per DP rank via X-data-parallel-rank.

apiVersion: v1
kind: Service
metadata:
  name: vllm-service-prefill
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-prefill
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-decode
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-decode
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-torchtpu-pd-disagg
  namespace: vllm-torchtpu-disagg
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - benchmark
  ttlSecondsAfterFinished: 300
  replicatedJobs:
    # ---------------------------------------------------------
    # PREFILL SERVER — mirrors tpu_benchmark_daily start_dp_server.sh
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-prefill
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                      fi
                  securityContext:
                    privileged: true
                # The XLA compile cache is keyed on image sources and engine
                # config, so nightly image bumps orphan prior entries; prune
                # anything untouched for 14 days to bound PVC growth.
                - name: cache-prune
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      find /usr/vllm/xla_cache -mindepth 1 -maxdepth 1 -atime +14 -exec rm -rf {} + 2>/dev/null || true
                      df -h /usr/vllm || true
                  volumeMounts:
                  - name: pvc-vllm-vol
                    mountPath: "/usr/vllm"
              containers:
              - name: vllm-tpu
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                command: [ "/bin/bash", "-c", "--" ]
                args: ["vllm serve --model=Qwen/Qwen3.5-397B-A17B-FP8 --trust-remote-code --generation-config=vllm --seed=42 --max-model-len=262144 --max-num-batched-tokens=4096 --max-num-seqs=64 --data-parallel-size=8 --tensor-parallel-size=1 --enable-expert-parallel --attention-backend=CUSTOM --gpu-memory-utilization=0.90 --kv-cache-dtype=fp8 --language-model-only --disable-custom-all-reduce --no-enable-prefix-caching --prefill-context-parallel-size=1 --cp-kv-cache-interleave-size=256 --no-disable-hybrid-kv-cache-manager --return-tokens-as-token-ids --mamba-cache-mode=align --compilation-config '{\"backend\":\"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor\",\"compile_sizes\":[2,4,8,16,4096],\"inductor_compile_config\":{\"enable_auto_functionalized_v2\":false,\"size_asserts\":false,\"alignment_asserts\":false,\"scalar_asserts\":false}}' --kv-transfer-config '{\"kv_connector\":\"TPUConnector\",\"kv_connector_module_path\":\"vllm_torchtpu.distributed.kv_transfer.tpu_connector\",\"kv_role\":\"kv_producer\",\"kv_connector_extra_config\":{\"use_hma_connector\":true}}'"]
                env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                - name: HF_HOME
                  value: /usr/vllm
                - name: VLLM_LOGGING_LEVEL
                  value: "INFO"
                # start_dp_server.sh env (verbatim; vars it leaves unset are
                # deliberately absent here so plugin defaults apply, e.g.
                # MODEL_IMPL_TYPE, USE_BATCHED_RPA_KERNEL, USE_MOE_SPARSE_CORE).
                - name: PJRT_DEVICE
                  value: TPU
                - name: SKIP_JAX_PRECOMPILE
                  value: "1"
                - name: VLLM_DISABLE_COMPILE_CACHE
                  value: "1"
                - name: TORCHINDUCTOR_AUTOGRAD_CACHE
                  value: "0"
                - name: RAY_memory_monitor_refresh_ms
                  value: "0"
                - name: TPU_VLLM_SKIP_DYNAMIC_SMEM_NEGOTIATION_FLAG
                  value: "1"
                - name: VLLM_XLA_CHECK_RECOMPILATION
                  value: "0"
                # Deviation: daily sets 1, but the v1 HMA connector requires
                # the typed per-layer KV layout; the unified pool exposes GDN
                # layers as [pool] which it cannot register.
                - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                  value: "0"
                # GKE topology plumbing (not part of the daily env).
                - name: TPU_TOPOLOGY
                  value: "2x2x1"
                - name: TPU_HOST_BOUNDS
                  value: "1,1,1"
                - name: TPU_ACCELERATOR_TYPE
                  value: "tpu7x"
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: RAY_LOG_TO_STDERR
                  value: "1"
                # KV-transfer configuration (disagg-only; no daily counterpart).
                - name: TPU_KV_PIN_SHM
                  value: "1"
                - name: TPU_ENABLE_D2H_TRANSFER
                  value: "1"
                - name: TPU_HMA_D2H_COPY_IMPL
                  value: "device_put"
                - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_PULLS
                  value: "8"
                - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                  value: "64"
                - name: TPU_P2P_WAIT_PULL_TIMEOUT
                  value: "600"
                - name: TPU_KV_SHM_POOL_GB
                  value: "16"
                - name: TPU_KV_TRANSFER_PORT
                  value: "9100"
                - name: TPU_SIDE_CHANNEL_PORT
                  value: "9600"
                - name: TPU_PREMAPPED_BUFFER_SIZE
                  value: "8589934592"
                - name: TPU_PREMAPPED_BUFFER_TRANSFER_THRESHOLD_BYTES
                  value: "8589934592"
                # Container startup plumbing: cold in-container compiles need
                # the longer ready timeout and the PVC-backed XLA cache.
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "7200"
                - name: VLLM_XLA_CACHE_PATH
                  value: "/usr/vllm/xla_cache_v2"
                ports:
                - containerPort: 8000
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: pvc-vllm-vol
                  mountPath: "/usr/vllm"
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: pvc-vllm-vol
                persistentVolumeClaim:
                  claimName: pvc-vllm-p

    # ---------------------------------------------------------
    # DECODE SERVER — mirrors tpu_benchmark_daily start_dp_decode_server.sh
    # ---------------------------------------------------------
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-decode
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                      fi
                  securityContext:
                    privileged: true
                # The XLA compile cache is keyed on image sources and engine
                # config, so nightly image bumps orphan prior entries; prune
                # anything untouched for 14 days to bound PVC growth.
                - name: cache-prune
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      find /usr/vllm/xla_cache -mindepth 1 -maxdepth 1 -atime +14 -exec rm -rf {} + 2>/dev/null || true
                      df -h /usr/vllm || true
                  volumeMounts:
                  - name: pvc-vllm-vol
                    mountPath: "/usr/vllm"
              containers:
              - name: vllm-tpu
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                command: [ "/bin/bash", "-c", "--" ]
                args: ["vllm serve --model=Qwen/Qwen3.5-397B-A17B-FP8 --trust-remote-code --seed=42 --tensor-parallel-size=1 --data-parallel-size=8 --data-parallel-size-local=8 --enable-expert-parallel --language-model-only --mamba-cache-mode=align --no-disable-hybrid-kv-cache-manager --kv-cache-dtype=fp8 --max-model-len=66560 --max-num-batched-tokens=4384 --max-num-seqs=32 --gpu-memory-utilization=0.932285943 --async-scheduling --enable-prompt-tokens-details --disable-log-stats --no-enable-log-requests --no-enable-prefix-caching --attention-backend=CUSTOM --limit-mm-per-prompt '{\"image\":0,\"video\":0}' --compilation-config '{\"backend\":\"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor\",\"compile_sizes\":[8,16,32,4352,4384],\"inductor_compile_config\":{\"enable_auto_functionalized_v2\":false,\"size_asserts\":false,\"alignment_asserts\":false,\"scalar_asserts\":false}}' --kv-transfer-config '{\"kv_connector\":\"TPUConnector\",\"kv_connector_module_path\":\"vllm_torchtpu.distributed.kv_transfer.tpu_connector\",\"kv_role\":\"kv_consumer\",\"kv_connector_extra_config\":{\"use_hma_connector\":true}}'"]
                env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                - name: HF_HOME
                  value: /usr/vllm
                - name: VLLM_LOGGING_LEVEL
                  value: "INFO"
                # start_dp_decode_server.sh env (verbatim; vars it leaves
                # unset, e.g. USE_MOE_EP_KERNEL, are deliberately absent).
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: PJRT_DEVICE
                  value: TPU
                - name: MODEL_IMPL_TYPE
                  value: "vllm"
                - name: NEW_MODEL_DESIGN
                  value: "1"
                - name: SKIP_JAX_PRECOMPILE
                  value: "1"
                - name: VLLM_XLA_CHECK_RECOMPILATION
                  value: "0"
                - name: XLA_PYTHON_CLIENT_PREALLOCATE
                  value: "false"
                - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                  value: "1"
                - name: VLLM_DISABLE_COMPILE_CACHE
                  value: "1"
                - name: TORCHINDUCTOR_AUTOGRAD_CACHE
                  value: "0"
                - name: RAY_memory_monitor_refresh_ms
                  value: "0"
                - name: TPU_KV_CACHE_HEADROOM_MIB
                  value: "6144"
                - name: USE_BATCHED_RPA_KERNEL
                  value: "1"
                - name: RAGGED_GATED_DELTA_RULE_IMPL
                  value: "chunked_kernel_v3_pd"
                - name: USE_MOE_SPARSE_CORE
                  value: "1"
                - name: RAGGED_GATHER_VERSION
                  value: "v2"
                - name: RAGGED_GATHER_REDUCE_VERSION
                  value: "v2"
                - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                  value: "32768"
                - name: DP_SCHED_BATCH_PREFILL_MAX_ADMIT_PER_FLUSH
                  value: "0"
                - name: TORCH_TPU_DP_MASTER_ADDR
                  value: "127.0.0.1"
                - name: TORCH_TPU_DP_MASTER_PORT
                  value: "29645"
                - name: LIBTPU_INIT_ARGS
                  value: "--xla_tpu_use_dynamic_smem_negotiation=true --xla_tpu_scoped_vmem_limit_kib=65536"
                # Deviation: daily sets 1, but the v1 HMA connector requires
                # the typed per-layer KV layout; the unified pool exposes GDN
                # layers as [pool] which it cannot register.
                - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                  value: "0"
                # GKE topology plumbing (not part of the daily env).
                - name: TPU_TOPOLOGY
                  value: "2x2x1"
                - name: TPU_HOST_BOUNDS
                  value: "1,1,1"
                - name: TPU_ACCELERATOR_TYPE
                  value: "tpu7x"
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: RAY_LOG_TO_STDERR
                  value: "1"
                # KV-transfer configuration (disagg-only; no daily counterpart).
                - name: TPU_KV_PIN_SHM
                  value: "1"
                - name: TPU_ENABLE_D2H_TRANSFER
                  value: "1"
                - name: TPU_HMA_D2H_COPY_IMPL
                  value: "device_put"
                - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_PULLS
                  value: "8"
                - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                  value: "64"
                - name: TPU_P2P_WAIT_PULL_TIMEOUT
                  value: "600"
                - name: TPU_KV_SHM_POOL_GB
                  value: "16"
                - name: TPU_KV_TRANSFER_PORT
                  value: "9100"
                - name: TPU_SIDE_CHANNEL_PORT
                  value: "9600"
                - name: TPU_PREMAPPED_BUFFER_SIZE
                  value: "8589934592"
                - name: TPU_PREMAPPED_BUFFER_TRANSFER_THRESHOLD_BYTES
                  value: "8589934592"
                # Container startup plumbing: cold in-container compiles need
                # the longer ready timeout and the PVC-backed XLA cache.
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "7200"
                - name: VLLM_XLA_CACHE_PATH
                  value: "/usr/vllm/xla_cache_v2"
                ports:
                - containerPort: 8000
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: pvc-vllm-vol
                  mountPath: "/usr/vllm"
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: pvc-vllm-vol
                persistentVolumeClaim:
                  claimName: pvc-vllm-d

    # ---------------------------------------------------------
    # BENCHMARK CLIENT & PROXY
    # ---------------------------------------------------------
    - name: benchmark
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-benchmark
            spec:
              restartPolicy: Never
              containers:
              - name: benchmark-runner
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                env:
                # vllm bench serve is a pure HTTP client on a CPU node; loading
                # the torchtpu platform plugin there makes vLLM's CLI call
                # torch.device("tpu"), which fails without import torch_tpu.
                - name: VLLM_PLUGINS
                  value: ""
                # PyTorch auto-imports torch_tpu at `import torch` via the
                # torch.backends entry point; without libtpu its native init
                # fatally aborts. Disable backend autoload on this CPU client.
                - name: TORCH_DEVICE_BACKEND_AUTOLOAD
                  value: "0"
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -e
                    # This pod is a CPU-only HTTP client. The image ships
                    # libtpu, which makes vLLM's built-in platform detection
                    # pick TPU and fail (tpu_inference is not installed).
                    # Remove it so vLLM falls back to the CPU platform.
                    pip uninstall -y libtpu libtpu-nightly >/dev/null 2>&1 || true
                    echo "Starting proxy server..."
                    python3 /root/torchtpu-vllm/examples/disagg/toy_proxy_server.py \
                      --host 0.0.0.0 \
                      --port 10000 \
                      --prefiller-host vllm-service-prefill \
                      --prefiller-port 8000 \
                      --decoder-host vllm-service-decode \
                      --decoder-port 8000 &

                    echo "Waiting for prefill (vllm-service-prefill:8000) and decode (vllm-service-decode:8000) servers..."
                    until curl -s http://vllm-service-prefill:8000/health && curl -s http://vllm-service-decode:8000/health; do
                      echo "Waiting for prefill and decode health checks..."
                      sleep 10
                    done

                    echo "Both prefill and decode servers are HEALTHY!"

                    mkdir -p /tmp/benchmark_results
                    model="Qwen/Qwen3.5-397B-A17B-FP8"

                    # Client flags mirror tpu_benchmark_daily's bench_all.sh /
                    # bench_prefill_ttft.sh: openai backend on /v1/completions,
                    # random dataset with range-ratio 0, temperature 0, seed
                    # 42, request-rate inf, percentiles 50/90/99. Per-cell
                    # percentile metrics differ: the o=1 prefill cells use
                    # their ttft,e2el selection; the decode cells add tpot,itl
                    # since TPOT is the decode-tracking metric.
                    run_cell() {
                      local filename=$1 concurrency=$2 input_len=$3 output_len=$4 num_prompts=$5 pmetrics=$6
                      local path="/tmp/benchmark_results/$filename"
                      echo "Starting benchmark cell: $filename (c=$concurrency, i=$input_len, o=$output_len, n=$num_prompts)"
                      vllm bench serve \
                        --backend=openai \
                        --endpoint=/v1/completions \
                        --model="$model" \
                        --dataset-name=random \
                        --random-input-len="$input_len" \
                        --random-output-len="$output_len" \
                        --random-range-ratio=0 \
                        --num-prompts="$num_prompts" \
                        --request-rate=inf \
                        --max-concurrency="$concurrency" \
                        --ignore-eos \
                        --temperature=0 \
                        --seed=42 \
                        --percentile-metrics="$pmetrics" \
                        --metric-percentiles=50,90,99 \
                        --host=localhost \
                        --port=10000 \
                        --label="${filename%.json}" \
                        --append-result \
                        --result-file="$path"

                      # Emit each cell's result immediately so a timeout
                      # mid-sweep still yields the completed cells.
                      if [ -f "$path" ]; then
                        echo "===BEGIN_RESULT_FILE $filename==="
                        cat "$path"
                        echo ""
                        echo "===END_RESULT_FILE==="
                      fi
                      sleep 10
                    }

                    # Decode-shape smoke (their C8/P65536/D32 smoke process):
                    # warms the long-prefill + transfer + decode path before
                    # any measured cell.
                    run_cell "pd_disagg_decode_smoke_c8_i65536_o32.json" 8 65536 32 8 "ttft,tpot,itl,e2el"

                    # Prefill throughput sweep (bench_all.sh): 8192/1 at
                    # concurrency 8-256, 512 prompts per level.
                    for c in 8 16 32 64 128 256; do
                      run_cell "pd_disagg_prefill_c${c}_i8192_o1.json" "$c" 8192 1 512 "ttft,e2el"
                    done

                    # Single-request TTFT sweep (bench_prefill_ttft.sh): 16
                    # serial requests per input length. Their 131072/258048
                    # lengths are omitted: they exceed the decode server's
                    # max-model-len of 66560.
                    for ilen in 8192 16384 32768 65536; do
                      run_cell "pd_disagg_ttft_c1_i${ilen}_o1.json" 1 "$ilen" 1 16 "ttft,e2el"
                    done

                    # Decode protocol (their C256/P65536/D1024): three
                    # independent rounds of 256 concurrent requests. Heaviest
                    # cells run last so a stall here still leaves the prefill
                    # comparisons extracted above.
                    for round in 1 2 3; do
                      run_cell "pd_disagg_decode_round${round}_c256_i65536_o1024.json" 256 65536 1024 256 "ttft,tpot,itl,e2el"
                    done

                    echo "Benchmark complete! Results saved in /tmp/benchmark_results."

                    # The pod terminates when this script exits, so kubectl cp
                    # can't fetch results afterwards. Emit them to stdout with
                    # markers; the runner extracts them from the streamed log.
                    for f in /tmp/benchmark_results/pd_disagg_*.json; do
                      [ -f "$f" ] || continue
                      echo "===BEGIN_RESULT_FILE $(basename "$f")==="
                      cat "$f"
                      echo ""
                      echo "===END_RESULT_FILE==="
                    done
                resources:
                  requests:
                    cpu: "8"
                    memory: "16Gi"
                    ephemeral-storage: "20Gi"
                  limits:
                    cpu: "16"
                    memory: "32Gi"
