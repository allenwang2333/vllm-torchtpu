# Dev only: the single-host Qwen3.5 block-major disagg+offload rig with a PP4
# prefill engine, run on host 0 of a 2x2x4 slice. GKE places a multi-host
# slice as the pods of one Job, so the Job takes all four hosts; hosts 1-3
# exit at once and host 0 runs as a lone 2x2x1 host (single_host_engine.sh).
#
# ${WORKLOAD_NAME} and ${IMAGE} are substituted; a literal dollar is $$.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          backoffLimit: 0
          successPolicy:
            rules:
              - succeededIndexes: "0"
          activeDeadlineSeconds: 10800
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x4
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -o pipefail
                      [ "$${JOB_COMPLETION_INDEX}" = 0 ] || exit 0
                      mkdir -p "$${ARTIFACTS_DIR}"
                      bash .buildkite/kubernetes/single_host_engine.sh \
                        bash ./scripts/vllm/integration/run_qwen35_block_major_disagg_offload.sh
                      rc=$$?
                      find "$${ARTIFACTS_DIR}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
                      buildkite-agent artifact upload "$${ARTIFACTS_DIR}/**/*" || true
                      exit $$rc
                  env:
                    - name: ARTIFACTS_DIR
                      value: perf_eval_results
                    - name: RUN_ROOT
                      value: perf_eval_results/qwen35_pp4_multi_connector
                    - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                      value: "1"
                    - name: PREFILL_PCP
                      value: "1"
                    - name: PREFILL_PP
                      value: "4"
                    # The block-major pool refuses pipeline parallelism.
                    - name: VLLM_TPU_BLOCK_MAJOR_KV
                      value: "0"
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
