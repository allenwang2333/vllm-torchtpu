# Dev only: the single-host Qwen3.5 disagg+offload rig, one variant per host
# of a 2x2x4 slice, each host running as a lone 2x2x1 host
# (single_host_engine.sh). Every host exits 0 so one failing variant does not
# stop the others; each prints "VARIANT <name> rc=<rc>".
#   0: one PP4 engine, no KV connector, no Raiden env
#   1: PP4 prefill, Raiden disagg only, prefix caching off
#   2: PP2 prefill, Raiden disagg only
#   3: PP4 prefill, Raiden disagg + offload (TPUMultiConnector)
#
# ${WORKLOAD_NAME} and ${IMAGE} are substituted; a literal dollar is $$.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          backoffLimit: 0
          activeDeadlineSeconds: 10800
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x4
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -o pipefail
                      case "$${JOB_COMPLETION_INDEX}" in
                        0) variant=pp4_standalone; export PREFILL_PP=4
                           rig=run_qwen35_pp_standalone.sh ;;
                        1) variant=pp4_disagg_no_prefix_cache
                           export PREFILL_PP=4 OFFLOAD=0 ENABLE_PREFIX_CACHING=0 MAMBA_CACHE_MODE=none ;;
                        2) variant=pp2_disagg_only; export PREFILL_PP=2 OFFLOAD=0 ;;
                        3) variant=pp4_multi; export PREFILL_PP=4 OFFLOAD=1 ;;
                      esac
                      export RUN_ROOT="$${ARTIFACTS_DIR}/qwen35_$${variant}"
                      mkdir -p "$${RUN_ROOT}"
                      bash .buildkite/kubernetes/single_host_engine.sh \
                        bash "./scripts/vllm/integration/$${rig:-run_qwen35_block_major_disagg_offload.sh}"
                      rc=$$?
                      echo "VARIANT $${variant} rc=$${rc}"
                      echo "VARIANT $${variant} rc=$${rc}" > "$${RUN_ROOT}/variant_result.txt"
                      find "$${ARTIFACTS_DIR}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
                      buildkite-agent artifact upload "$${ARTIFACTS_DIR}/**/*" || true
                      exit 0
                  env:
                    - name: ARTIFACTS_DIR
                      value: perf_eval_results
                    - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                      value: "1"
                    - name: P4D2_CORRECTNESS_TIMEOUT
                      value: "180"
                    - name: PREFILL_PCP
                      value: "1"
                    # The block-major pool refuses pipeline parallelism.
                    - name: VLLM_TPU_BLOCK_MAJOR_KV
                      value: "0"
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
