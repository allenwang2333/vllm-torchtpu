steps:
  - label: ":warning: Test CI Failure BigQuery Recording"
    key: "test_ci_failure_recording"
    agents:
      queue: cpu_64_core
    commands:
      - |
        echo "Simulating CI runner failure: disk full..."
        echo "Writing cache..." > /tmp/test_error.log
        echo "OSError: [Errno 28] No space left on device" >> /tmp/test_error.log
        export BQ_FAILURE_TABLE="cloud-ullm-inference-ci-cd.llm_benchmark_analytics.ci_failures"
        python3 .buildkite/scripts/record_ci_failure.py \
          --log-file /tmp/test_error.log \
          --exit-code 1 \
          --step-label "Test CI Failure BigQuery Recording"
        rm -f /tmp/test_error.log
        exit 1

  - group: "Build Docker Images"
    key: "build_docker_group"
    steps:
      - label: ":docker: Build and Push CI Image"
        key: "build_docker"
        agents:
          queue: cpu_64_core
        commands:
          - bash .buildkite/scripts/setup_docker_env.sh dev
        # The torch-tpu virtual registry sometimes 404s a wheel it serves
        # moments later; a build that fails that way passes on the next try.
        retry: &image_build_retry
          automatic:
            - exit_status: 1
              limit: 1

      - label: ":docker: Build and Push Omni CI Image"
        key: "build_docker_omni"
        # Empty, and so not skipped, unless bootstrap.sh uploads no tests lane,
        # the only lane that runs on this image.
        skip: "${OMNI_IMAGE_SKIP:-}"
        agents:
          queue: cpu_64_core
        commands:
          - bash .buildkite/scripts/setup_docker_env.sh omni
        retry: *image_build_retry
