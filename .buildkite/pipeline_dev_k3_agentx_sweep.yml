# [branch-local] Kimi-K3 InferenceX AgentX concurrency sweep on the v7x-32 pod:
# one server boot, GSM8K probe, then trace replay at conc 1 -> 2 -> 4 -> 8.
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_agentx_sweep.yml.
# Knobs via build env: K3_CONC_LIST, K3_CTX, K3_KV, K3_APC, K3_SPEC, K3_FAST,
# K3_GSM8K_LIMIT (run_multihost.sh only forwards BUILDKITE_* + allowlist into the
# containers, so they are baked into the command line here at upload time).
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "K3 AgentX sweep conc ${K3_CONC_LIST:-1,2,4,8} ctx ${K3_CTX:-131072} kv ${K3_KV:-fp8} apc ${K3_APC:-0} spec ${K3_SPEC:-none} rq ${K3_MOE_REQUANT:-0} (TPU v7x-32)"
    key: k3_agentx_sweep
    depends_on: build_docker
    timeout_in_minutes: 600
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_agentx_sweep.sh --config kimi-k3-tp32-ep-agentx --results-dir /perf_eval_results/k3-agentx-sweep --conc-list ${K3_CONC_LIST:-1,2,4,8} --max-model-len ${K3_CTX:-131072} --kv ${K3_KV:-fp8} --apc ${K3_APC:-0} --spec ${K3_SPEC:-none} --fast ${K3_FAST:-1} --gsm8k-limit ${K3_GSM8K_LIMIT:-100} --moe-requant ${K3_MOE_REQUANT:-0}"
    artifact_paths:
      - "perf_eval_results/**/*"
