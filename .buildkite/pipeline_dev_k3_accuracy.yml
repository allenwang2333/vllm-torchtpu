# First accuracy numbers for Kimi-K3 on the v7x-32 pod. Select with
#   DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_accuracy.yml
#
# One server lifetime: gsm8k over /v1/completions (needs no chat template)
# then mmlu_llama over /v1/chat/completions (which also tests the template).
# Deliberately separate from pipeline_dev_k3_status.yml so it can queue behind
# that build's perf leg on the single tpu_v7x_32 agent.
steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":bar_chart: Accuracy: Kimi-K3 gsm8k + mmlu (TPU v7x-32)"
    key: k3_accuracy
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_accuracy.sh --config kimi-k3-tp32-ep-eval --results-dir /perf_eval_results/kimi-k3-accuracy"
    artifact_paths:
      - "perf_eval_results/**/*"
