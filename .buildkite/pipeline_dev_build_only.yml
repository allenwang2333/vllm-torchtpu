# Build-only dev pipeline: validates that the image resolves the dependency
# pins (tpu-sync-torch + libtpu bump) without occupying a TPU agent.
# Select with build env DEV_PIPELINE_FILE=.buildkite/pipeline_dev_build_only.yml.
steps:
  - label: ":docker: Build and Push Dev Image (deps check)"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
