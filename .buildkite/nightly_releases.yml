# Publishes the public prod image to Docker Hub as nightly from the scheduled
# NIGHTLY=1 build of main. As in tpu-inference, it does not wait for tests.
# Release branches publish from release_images.yml, which waits for all tests.
# The internal GAR nightlies (pipeline_nightly_image.yml) are not affected.

steps:
  - label: ":docker: Publish vllm-torchtpu nightly image to Docker Hub"
    key: "publish_dockerhub_nightly"
    # TODO(test-only): jefft/docker_image_ci added for a CI dry run. Remove before merging.
    if: '(build.branch == "main" || build.branch == "jefft/docker_image_ci") && build.env("NIGHTLY") == "1" && pipeline.slug == "vllm-torchtpu-ci"'
    agents:
      # The prod build pulls torch-tpu from a private registry and needs the
      # gcloud credentials these agents carry (see docker/build_image.sh).
      queue: cpu_64_core
    env:
      # TODO(docker-hub): the Docker Hub repository, e.g. vllm/vllm-torchtpu.
      # Docker rejects this uppercase placeholder, so the build fails at once.
      # DOCKERHUB_REPO: "REPLACE_WITH_DOCKERHUB_REPO"
      # TODO(test-only): dummy lowercase repo for a CI dry run; nothing is pushed.
      DOCKERHUB_REPO: "test/vllm-torchtpu"
      # Makes publish_nightly_images.sh build prod only and push to Docker Hub.
      PUBLISH_DOCKERHUB: "1"
    # TODO(test-only): secret and Docker Hub login disabled for a CI dry run.
    # Restore before merging.
    # TODO(docker-hub): the secret name configured in the Buildkite cluster.
    # secrets:
    #   - DOCKERHUB_TOKEN
    # plugins:
    #   - docker-login#v3.0.0:
    #       # TODO(docker-hub): the Docker Hub bot account with push access to
    #       # DOCKERHUB_REPO. Login fails until this is set.
    #       username: "REPLACE_WITH_DOCKERHUB_USERNAME"
    #       password-env: DOCKERHUB_TOKEN
    commands:
      - bash .buildkite/scripts/publish_nightly_images.sh
