# The P/D disaggregated benchmark on the managed kube fleet.

# Named by build number so the tag is immutable: submission can be hours after
# the push, and a second build sharing a tag would decide what the first
# measures.
env:
  WORKLOAD_IMAGE: "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-dev:kube-disagg-${BUILDKITE_BUILD_NUMBER}"

steps:
  - label: ":docker: Build the benchmark image"
    key: "build_kube_disagg_image"
    agents:
      queue: cpu_64_core
    commands:
      - ./docker/build_image.sh --target dev -t "$$WORKLOAD_IMAGE"
      - docker push "$$WORKLOAD_IMAGE"

  # One-off: write the Kimi-K3 megakernel pre-shard into the model bucket.
  - label: ":kubernetes: :tpu: Kimi-K3 megakernel pre-shard (TPU v7x 2x2x4)"
    depends_on: "build_kube_disagg_image"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - /opt/launcher/launch --manifest .buildkite/kubernetes/manifests/workloads/kimi-k3-preshard.yaml
