# Kimi-K3 on the tpu7x-32 pod, loaded directly from GCS with EP-sharded
# Run:AI streaming. Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_gcs.yml.
#
# This is the nightly kimi-k3-tp32-ep perf step from pipeline_perf.yml
# without the NIGHTLY gate, for validating the config and (re)calibrating
# its baseline: run it twice, download the perf_eval_results artifacts and
# feed both result dirs to
#   check_regression.py --mode perf --calibrate --results-dir A --results-dir B
# The serve recipe lives in scripts/vllm/benchmarking/configs/kimi-k3-tp32-ep.sh
# so it cannot drift from the nightly.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "Perf: kimi-k3-tp32-ep (TPU v7x-32)"
    key: perf_kimi_k3_tp32_ep
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "1"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config kimi-k3-tp32-ep --results-dir /perf_eval_results/kimi-k3-tp32-ep"
    artifact_paths:
      - "perf_eval_results/**/*"
