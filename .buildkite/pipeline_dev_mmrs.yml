# [branch-local] PR-332 matmul-reduce-scatter ring kernel vs XLA on the
# tpu7x-32 pod (2x2x4), single-hop snake ring order (build_ring_mesh).
# Select with DEV_PIPELINE_FILE=.buildkite/pipeline_dev_mmrs.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "MM-RS ring kernel vs XLA (TPU v7x-32)"
    key: mmrs_bench_32
    depends_on: build_docker
    timeout_in_minutes: 90
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh --backend torchrun scripts/mmrs_bench.sh"
      - |
        grep -h "^ *[0-9]* |\|devices=\|M |" perf_eval_results/torchrun_node*.log perf_eval_results/mmrs/*.log 2>/dev/null | head -40 || true
        dest="gs://cuiq-inference-test/woosuk1/build-$${BUILDKITE_BUILD_NUMBER}-mmrs"
        gcloud storage cp -r perf_eval_results/* "$$dest/" && echo "uploaded to $$dest" || echo "GCS upload failed"
    artifact_paths:
      - "perf_eval_results/**/*"
