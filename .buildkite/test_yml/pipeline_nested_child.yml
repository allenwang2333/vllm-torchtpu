# Level 2: uploaded by the "upload_nested" step, not by bootstrap.sh.
# If the block in pipeline_wait.yml also waits for these, it stays
# un-unblockable until "nested_err" finishes and then does not continue.

steps:
  - label: ":work: Nested wait 60s"
    key: "nested_w60s"
    agents:
      queue: cpu
    commands:
      - sleep 60

  - label: ":err: Nested err"
    key: "nested_err"
    depends_on: "nested_w60s"
    agents:
      queue: cpu
    commands:
      - exit 1
