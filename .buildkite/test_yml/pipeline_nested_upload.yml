# Level 1: uploaded by bootstrap.sh. Mirrors pipeline_verify.yml, whose step
# runs upload_models_and_features.sh to upload the model/feature steps.
# The step itself passes; only the step it uploads (level 2) fails.

steps:
  - label: ":pipeline: Upload nested steps"
    key: "upload_nested"
    agents:
      queue: cpu
    commands:
      # Delay the upload so the block's other dependencies are already done
      # when the level 2 steps appear.
      - sleep 20
      - source .buildkite/scripts/configs/pipeline_config.sh
      - upload_with_priority .buildkite/test_yml/pipeline_nested_child.yml "$$JOB_PRIORITY"
