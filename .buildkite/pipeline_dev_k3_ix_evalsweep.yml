# [branch-local] K3 per-concurrency GSM8K accuracy sweep, eval-only (no
# throughput bench). Running GSM8K right after a saturating --ignore-eos
# bench cell corrupts the server's responses to 1-token junk (dev builds
# 346/348 scored 0.0; the eval-only diagnostic 353 scored 1.0), so accuracy
# is measured on a clean server at each eval concurrency. Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_ix_evalsweep.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "K3 GSM8K accuracy sweep conc 8-128 (TPU v7x-32)"
    key: k3_ix_evalsweep
    depends_on: build_docker
    timeout_in_minutes: 300
    agents:
      queue: "tpu_v7x_32_queue"
    env:
      TPU_ACCELERATOR_TYPE: "tpu7x"
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      BENCHMARK_WARMUP_RUNS: "0"
    commands:
      - "bash .buildkite/scripts/run_multihost.sh bash ./scripts/vllm/benchmarking/k3_ix_sweep.sh --config kimi-k3-tp32-ep-ix --results-dir /perf_eval_results/k3-ix-evalsweep --concs '8 16 32 64 128' --gsm8k-limit 100 --skip-bench"
    artifact_paths:
      - "perf_eval_results/**/*"
