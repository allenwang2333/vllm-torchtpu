# pipeline_tests.yml on the Kueue fleet.
#
# A pipeline of its own rather than a branch inside pipeline_tests.yml. The two
# run the same tests on different hardware from different pools, and while the
# fleet is being brought up a failure here must not read as a regression in the
# repo - so this one is non-blocking and pipeline_tests.yml is untouched.
#
# Every step of pipeline_tests.yml is here, with keys kept identical so the two
# files read side by side. Only the agent changes: a TPU step names a shape and
# a command, and chips, topology, Kueue queue, caches and deadlines all come
# from the cluster-side profile registry in ci-infra.
#
# The CPU steps and the image build stay on cpu_64_core. There is nothing to
# move: they hold no chips, so running them on the fleet would buy a different
# scheduler and nothing else, and the fleet has no CPU-only node pool to put
# them on.
#
# The `tests` plugin still runs on the agent - it ensures the suite exists and
# exports the BUILDKITE_TEST_ENGINE_* configuration - while bktec itself runs
# in the pod, out of the image. run.sh forwards that configuration across,
# which is what joins the two halves. The credentials the plugin mints beside
# it are dropped and re-obtained in the pod; see common.sh.

# The pod template the fleet publishes: it carries the launcher binary, the
# profile registry and the service account that may submit a workload. Repeated
# per step rather than merged in, because a step's `plugins:` is a list and a
# YAML merge key replaces it wholesale.
x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher
    # One commit, and no blobs until something opens them. A step clones this
    # repo to read run.sh; the tree the tests need is already in the image, and
    # nothing on this path reads history. Blobless alone still walks every tree
    # the repo has ever had, which is most of the time before the pod starts.
    # The working tree stays complete either way.
    checkout:
      cloneFlags: -v --depth 1 --filter=blob:none
      fetchFlags: -v --prune --depth 1 --filter=blob:none

x-tpu-step-defaults: &tpu_step
  depends_on: "build_docker"
  # soft_fail everywhere while the lane is being proven: a failure here is a
  # question about the fleet, not about the commit.
  soft_fail: true
  # Covers queueing as well as running, because Buildkite adds no queue time of
  # its own - the agent pod starts at once and then waits inside the step. So
  # this has to be the launcher's whole budget and not the length of a test
  # run: the fleet's eight v7x chips are routinely a day deep, and a step cut
  # off at four hours is one that was still in line, retried to the back of a
  # queue it had nearly reached the front of. The launcher's own admission
  # deadline is what stops a step waiting forever.
  timeout_in_minutes: 1440
  agents:
    queue: "kube"
  commands:
    # One command for every shape, as in pipeline_tests.yml, with the shape
    # itself the only thing a step varies.
    #
    # Exit 5 is pytest's "no tests collected", which a shard can legitimately
    # reach once the marker filter has emptied it. Tolerated inside the pod
    # rather than around the launcher: the launcher reports a workload as 0 or
    # 1, so a 5 never survives to be compared out here.
    - .buildkite/kubernetes/run.sh $$SHAPE bash -c 'bktec run || [ $$? -eq 5 ]'

x-cpu-unit-test-defaults: &cpu_unit_test_defaults
  depends_on: "build_docker"
  soft_fail: true
  commands:
    - bash .buildkite/scripts/run_in_docker.sh bktec run
  agents:
    queue: "cpu_64_core"
  env:
    CPU_ONLY: "1"

x-tests-plugin-defaults: &tests_plugin_defaults
  # Resolved relative to the Buildkite org running the build.
  suite-slug: tpu-ci
  test-runner: pytest
  install-client: false
  oidc-lifetime: 7200

# The hardware this suite is about, and what it defaults to: tpu_v7x_2_queue on
# bare metal is two TensorCores, which is one v7x chip, and tpu_v7x_8_queue is
# eight cores, four chips, one host. The queue name counts cores and the profile
# registry counts chips, so the two numbers differ for the same hardware.
#
# Overridable because the two families are not equally available: the fleet has
# eight v7x chips and rather more v6e, so pointing a run at whichever is idle -
# env KUBE_SHAPE_1_CHIP=ct6e-standard-1t/1x1 KUBE_SHAPE_4_CHIP=ct6e-standard-8t/2x4
# - takes hours off the wait. Scheduled and PR runs set neither and stay on v7x.
#
# Only worth doing to prove the plumbing reaches a chip at all. This suite is
# not portable between the families: several hundred kernel tests gate on v7+
# and call pytest.fail rather than skip when they find v6e, and the SparseCore
# tests that do run there fail on the narrower geometry - eight SIMD lanes
# against v7x's sixteen. On v6e the result is a red build whose redness says
# nothing about the lane, so it cannot stand in for a real one.
x-shape-1-chip: &shape_1_chip "${KUBE_SHAPE_1_CHIP:-tpu7x-standard-1t/1x1x1}"
x-shape-4-chip: &shape_4_chip "${KUBE_SHAPE_4_CHIP:-tpu7x-standard-4t/2x2x1}"

steps:
  # The builder pipeline_build.yml uses, repeated because this pipeline is
  # uploaded on its own rather than beside that one. A docker build is not a
  # TPU workload, so it does not go through the launcher.
  - label: ":docker: Build and Push CI Image"
    key: "build_docker"
    timeout_in_minutes: 120
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "Unit Tests - CPU (PR)"
    key: "unit_tests_cpu_pr"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") != "1"'
    plugins:
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true
          test-cmd: "pytest -sv --timeout=600 -m 'cpu_test and not nightly' --junit-xml={{resultPath}} {{testExamples}}"

  - label: "Unit Tests - CPU (Nightly)"
    key: "unit_tests_cpu_nightly"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") == "1"'
    plugins:
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true
          test-cmd: "pytest -sv --timeout=600 -m 'cpu_test' --junit-xml={{resultPath}} {{testExamples}}"

  - group: ":kubernetes: Unit Tests on TPU"
    steps:
      # test_speculative_decoding.py gets its own PR steps, mirroring the
      # nightly pair below, so spec-decode results are visible as their own
      # step rather than buried in the general run and so the suite runs on
      # its own chips instead of serializing behind everything else. The
      # general steps exclude the file to avoid running it twice.
      - label: ":kubernetes: Unit Tests - General (PR)"
        key: "unit_tests_general_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_1_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not cpu_test and not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: ":kubernetes: Unit Tests - Multichip (PR)"
        key: "unit_tests_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_4_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not cpu_test and not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Representative correctness cases run on PRs; the full parameter matrix
      # and acceptance-rate tests run nightly. Split by example because the
      # suite is a single file. bktec balances using recorded test durations.
      - label: ":kubernetes: Unit Tests - Speculative Decoding (PR)"
        key: "unit_tests_spec_decode_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        env:
          SHAPE: *shape_1_chip
          # bktec enumerates the examples to split with a plain
          # `pytest --collect-only`, which does not see the `-m` filter in
          # test-cmd. Without this the nightly-only cases would be handed to
          # the splitter carrying their (long) nightly timings and then
          # deselected at run time, so a shard could be planned full and
          # actually run almost nothing. PYTEST_ADDOPTS applies to collection
          # as well as to the run, which keeps the split over what a PR
          # actually executes. run.sh forwards it into the pod.
          PYTEST_ADDOPTS: "-m 'not nightly and not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=1800 -m 'not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: ":kubernetes: Unit Tests - Speculative Decoding Multichip (PR)"
        key: "unit_tests_spec_decode_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_4_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: ":kubernetes: Unit Tests - Speculative Decoding (Nightly)"
        key: "unit_tests_spec_decode_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 3
        env:
          SHAPE: *shape_1_chip
          PYTEST_ADDOPTS: "-m 'not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # The data-parallel MTP tests in the same file need DP*TP chips, which
      # the one-chip shape above cannot provide (they self-skip there). This
      # step is the only place they get enough chips to run.
      - label: ":kubernetes: Unit Tests - Speculative Decoding Multichip (Nightly)"
        key: "unit_tests_spec_decode_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_4_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: ":kubernetes: Unit Tests - General (Nightly)"
        key: "unit_tests_general_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_1_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not cpu_test and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: ":kubernetes: Unit Tests - Multichip (Nightly)"
        key: "unit_tests_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_4_chip
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not cpu_test and multichip' --junit-xml={{resultPath}} {{testExamples}}"
