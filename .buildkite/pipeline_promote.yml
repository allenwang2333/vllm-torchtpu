# Uploaded only by the integration pipeline, which builds vLLM main HEAD
# instead of the pinned LKG. If the whole suite passes on that vLLM, this step
# promotes it into the pin in pyproject.toml on main, and every other pipeline
# picks it up from there.
#
# Report-only until LKG_PROMOTE_PUSH=1: it logs the promotion it would make and
# commits nothing. See update_lkg_version.sh.

steps:
  # Gate on every step uploaded before this one. A promotion is only as
  # trustworthy as the suite that preceded it.
  - wait: ~

  # Runs on the cpu queue because those agents have the GitHub App git
  # credential helper installed, so once pushing is enabled `git push`
  # authenticates with a short-lived installation token and needs no secret
  # handling here.
  - label: ":arrow_up: Promote vLLM to Last Known Good (LKG)"
    key: "promote_lkg"
    agents:
      queue: cpu
    commands:
      - bash .buildkite/scripts/update_lkg_version.sh
