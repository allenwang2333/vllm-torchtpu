  - name: check
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
          spec:
            containers:
            - args:
              - |
                set -o pipefail
                : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"; mkdir -p "$CDK_OUTPUT_DIR"
                LAYOUT=pp4pcp8; [ "$BASELINE" = 1 ] && LAYOUT=pcp16tp2
                PREFILLER_DNS="${JS_NAME}-prefill-0-0.${JS_NAME}"
                DECODER_DNS="${JS_NAME}-decode-0-0.${JS_NAME}"
                PREFILL_METRICS="$PREFILLER_DNS:8000"; DECODE_METRICS="$DECODER_DNS:8000"
                PROXY=127.0.0.1:10000
                health() { curl -sf --max-time 5 "http://$1/health" >/dev/null 2>&1; }
                # Counters are exported with a _total suffix.
                metric() {
                  curl -sf "http://$1/metrics" | awk -v n="vllm:$2" -v t="vllm:$2_total" \
                    '{k=$1; sub(/\{.*/, "", k); if (k==n || k==t) s+=$NF} END {printf "%.0f", s+0}'
                }
                # count and mean of a histogram
                hist() {
                  curl -sf "http://$1/metrics" | awk -v c="vllm:$2_count" -v s="vllm:$2_sum" \
                    '{k=$1; sub(/\{.*/, "", k); if (k==c) n+=$NF; if (k==s) t+=$NF} END {printf "n=%.0f mean=%.2f", n+0, (n>0 ? t/n : 0)}'
                }
                # Phase spans for the job's perfetto trace.
                tstart() { echo "trace-start-event: name=$1 ts=$(date +'%s.%N') pid=bench tid=bench"; }
                tend() { echo "trace-end-event: name=$1 ts=$(date +'%s.%N') pid=bench tid=bench"; }
                echo "WAIT_SERVERS layout=$LAYOUT $(date -u +%FT%TZ)"
                for i in $(seq 1 540); do health "$PREFILL_METRICS" && health "$DECODE_METRICS" && break; sleep 10; done
                health "$PREFILL_METRICS" && health "$DECODE_METRICS" || { echo "RESULT: FAIL (servers not healthy after 90 min)"; exit 1; }
                echo "SERVERS_READY $(date -u +%FT%TZ)"
                python3 /root/torchtpu-vllm/examples/disagg/toy_proxy_server.py --host 0.0.0.0 --port 10000 \
                  --prefiller-host "$PREFILLER_DNS" --prefiller-port 8000 --decoder-host "$DECODER_DNS" --decoder-port 8000 \
                  > /tmp/proxy.log 2>&1 &
                for i in $(seq 1 60); do curl -sf --max-time 5 "http://$PROXY/healthcheck" >/dev/null 2>&1 && break; sleep 2; done
                curl -sf --max-time 5 "http://$PROXY/healthcheck" >/dev/null || { echo "RESULT: FAIL (proxy not up)"; tail -20 /tmp/proxy.log; exit 1; }
                tstart probe
                python3 - "$PROXY" "$CDK_OUTPUT_DIR/probe.json" <<'PY'
                import json, sys, urllib.request
                host, out = sys.argv[1], sys.argv[2]
                prompts = ["The capital of France is", " ".join(str(i) for i in range(1, 3000)) + " What comes next?"]
                results = []
                for p in prompts:
                    body = json.dumps({"model": "q38", "prompt": p, "max_tokens": 16, "temperature": 0}).encode()
                    req = urllib.request.Request(f"http://{host}/v1/completions", data=body, headers={"Content-Type": "application/json"})
                    try:
                        with urllib.request.urlopen(req, timeout=900) as r:
                            d = json.load(r); text = d["choices"][0]["text"]; usage = d.get("usage")
                    except Exception as e:
                        text = f"ERR {e!r}"[:300]; usage = None
                    results.append({"prompt": p[-40:], "text": text, "usage": usage})
                    print("PROBE", json.dumps(results[-1]), flush=True)
                json.dump(results, open(out, "w"), indent=1)
                PY
                tend probe
                p0=$(metric "$PREFILL_METRICS" request_success); d0=$(metric "$DECODE_METRICS" request_success)
                echo "PROBE_DONE prefill_reqs=$p0 decode_reqs=$d0"
                [ "$p0" -gt 0 ] && [ "$d0" -gt 0 ] || { echo "RESULT: FAIL (probe did not cross both engines: prefill_reqs=$p0 decode_reqs=$d0)"; exit 1; }
                # Windows over one pass's detailed result JSON. Token times
                # are start + ttft + cumulative itls. Steady state: order by
                # completion, drop the first and last K = max(10, conc).
                # Peak window: the daily benchmark's rule, the 1-second window
                # (stepped 0.1 s) with the highest token count among windows
                # where at least 90% of the requests are between their second
                # and last token. Fill: when the first wave has all started
                # decoding.
                cat > /tmp/windows.py <<'PY'
                import bisect, json, math, sys
                path, conc = sys.argv[1], int(sys.argv[2])
                d = json.load(open(path))
                starts, ttfts, itls = d["start_times"], d["ttfts"], d["itls"]
                in_lens, out_lens = d["input_lens"], d["output_lens"]
                n = len(starts)
                reqs = []
                for i in range(n):
                    if ttfts[i] is None or starts[i] is None:
                        continue
                    t = starts[i] + ttfts[i]
                    times = [t]
                    for x in itls[i] or []:
                        t += x; times.append(t)
                    reqs.append((starts[i], times, in_lens[i], out_lens[i], ttfts[i], list(itls[i] or [])))
                n = len(reqs)
                out = {"n": n}
                k = max(10, conc)
                by_end = sorted(reqs, key=lambda r: r[1][-1])
                if n > 2 * k + 1:
                    win = by_end[k:n - k]
                    span = by_end[n - k - 1][1][-1] - by_end[k - 1][1][-1]
                    out["steady_req_s"] = len(win) / span
                    out["steady_in_tok_s"] = sum(r[2] for r in win) / span
                    out["steady_out_tok_s"] = sum(r[3] for r in win) / span
                    out["steady_ttft_ms"] = 1000 * sum(r[4] for r in win) / len(win)
                    out["steady_k"] = k
                by_start = sorted(reqs, key=lambda r: r[0])
                wave = by_start[:min(conc, n)]
                out["fill_s"] = max(r[1][0] for r in wave) - min(r[0] for r in wave)
                dec = [(r[1][1], r[1][-1]) for r in reqs if len(r[1]) > 1]
                if dec:
                    tok = sorted(t for r in reqs for t in r[1][1:])
                    itl_at = sorted((t, x) for r in reqs for t, x in zip(r[1][1:], r[5]))
                    lo, hi = min(a for a, _ in dec), max(b for _, b in dec)
                    need = math.ceil(0.9 * conc); best = None; cur = lo
                    while cur + 1.0 <= hi + 1e-9:
                        act = sum(a <= cur and b >= cur + 1.0 for a, b in dec)
                        if act >= need:
                            cnt = bisect.bisect_left(tok, cur + 1.0) - bisect.bisect_left(tok, cur)
                            if best is None or cnt > best[0]:
                                best = (cnt, cur, act)
                        cur += 0.1
                    if best:
                        cnt, cur, act = best
                        w = [x for t, x in itl_at if cur <= t < cur + 1.0]
                        w.sort()
                        out["peak1s_tok_s"] = cnt
                        out["peak1s_active"] = act
                        out["peak1s_tpot_ms"] = 1000 * w[len(w) // 2] if w else None
                        out["peak1s_at_s"] = cur - min(r[0] for r in reqs)
                print(" ".join(f"{k}={v:.3f}" if isinstance(v, float) else f"{k}={v}" for k, v in out.items()))
                PY
                BENCH_MAIN='import argparse; from vllm.benchmarks.serve import add_cli_args, main; p = argparse.ArgumentParser(); add_cli_args(p); main(p.parse_args())'
                fails=0
                bench() {
                  # bench <tag> <concurrency> <num_prompts> <seed> <dataset args...>
                  local tag=$1 conc=$2 n=$3 seed=$4; shift 4
                  local p0 d0 m0 p1 d1 m1 h0 h1 ok
                  p0=$(metric "$PREFILL_METRICS" request_success); d0=$(metric "$DECODE_METRICS" request_success)
                  m0=$(metric "$PREFILL_METRICS" tpu_kv_megabytes_transferred); h0=$(metric "$PREFILL_METRICS" prefix_cache_hits)
                  echo "== bench $tag conc=$conc n=$n seed=$seed $(date -u +%FT%TZ)"
                  tstart "$tag"
                  python3 -c "$BENCH_MAIN" --backend vllm --host 127.0.0.1 --port 10000 \
                    --model q38 --tokenizer "$TOKENIZER" "$@" \
                    --num-prompts "$n" --max-concurrency "$conc" --request-rate inf \
                    --ignore-eos --temperature 0 --seed "$seed" --percentile-metrics ttft,tpot,itl,e2el --metric-percentiles 50,90,99 \
                    --save-result --save-detailed --result-dir "$CDK_OUTPUT_DIR" --result-filename "$tag.json" \
                    2>&1 | tee "/tmp/$tag.log"
                  tend "$tag"
                  p1=$(metric "$PREFILL_METRICS" request_success); d1=$(metric "$DECODE_METRICS" request_success)
                  m1=$(metric "$PREFILL_METRICS" tpu_kv_megabytes_transferred); h1=$(metric "$PREFILL_METRICS" prefix_cache_hits)
                  echo "$tag ${h1:-0} ${h0:-0}" >> /tmp/prefix-hits.txt
                  ok=$(sed -n 's/^Successful requests:[[:space:]]*\([0-9]*\).*/\1/p' "/tmp/$tag.log" | tail -1)
                  local ttft_med ttft_p99 in_tps out_tps
                  ttft_med=$(sed -n 's/^Median TTFT (ms):[[:space:]]*\([0-9.]*\).*/\1/p' "/tmp/$tag.log" | tail -1)
                  ttft_p99=$(sed -n 's/^P99 TTFT (ms):[[:space:]]*\([0-9.]*\).*/\1/p' "/tmp/$tag.log" | tail -1)
                  in_tps=$(sed -n 's/^Input token throughput (tok\/s):[[:space:]]*\([0-9.]*\).*/\1/p' "/tmp/$tag.log" | tail -1)
                  out_tps=$(sed -n 's/^Output token throughput (tok\/s):[[:space:]]*\([0-9.]*\).*/\1/p' "/tmp/$tag.log" | tail -1)
                  local win=""
                  [ -f "$CDK_OUTPUT_DIR/$tag.json" ] && win=$(python3 /tmp/windows.py "$CDK_OUTPUT_DIR/$tag.json" "$conc" 2>&1 | tail -1)
                  echo "BENCH_DONE tag=$tag successful=${ok:-0}/$n prefill_reqs=$((p1 - p0)) decode_reqs=$((d1 - d0)) kv_mb=$((m1 - m0)) prefix_hit_tokens=$((h1 - h0)) ttft_ms_p50=${ttft_med:-?} ttft_ms_p99=${ttft_p99:-?} in_tok_s=${in_tps:-?} out_tok_s=${out_tps:-?} pull=$(hist "$DECODE_METRICS" tpu_kv_pull_time_ms) h2d=$(hist "$DECODE_METRICS" tpu_h2d_transfer_time_ms) d2h=$(hist "$PREFILL_METRICS" tpu_d2h_transfer_time_ms)"
                  echo "WINDOWS tag=$tag conc=$conc $win"
                  echo "$tag conc=$conc n=$n ok=${ok:-0} ttft_p50=${ttft_med:-?} ttft_p99=${ttft_p99:-?} in_tok_s=${in_tps:-?} out_tok_s=${out_tps:-?} kv_mb=$((m1 - m0)) $win" >> "$CDK_OUTPUT_DIR/summary.txt"
                  [ "${ok:-0}" = "$n" ] || { echo "GATE: FAIL $tag: ${ok:-0} of $n requests succeeded"; fails=$((fails + 1)); }
                  [ "$((p1 - p0))" -gt 0 ] && [ "$((d1 - d0))" -gt 0 ] || { echo "GATE: FAIL $tag: requests did not cross both engines: prefill_reqs=$((p1 - p0)) decode_reqs=$((d1 - d0))"; fails=$((fails + 1)); }
                }
                random_args() {
                  # random_args <isl> <osl>
                  echo "--dataset-name random --random-input-len $1 --random-output-len $2 --random-range-ratio 0.0"
                }
                # A sweep knob set to "none" runs nothing (an empty value
                # falls back to the recipe default).
                for var in TTFT_SWEEP PREFILL_SWEEP DECODE_SWEEP SPEED_SWEEP POOL_SWEEP; do
                  [ "${!var}" = none ] && printf -v "$var" ''
                done
                s=2000
                for e in $TTFT_SWEEP; do
                  s=$((s + 1)); IFS=: read -r isl n <<< "$e"
                  bench "ttft-in${isl}-c1-n${n}" 1 "$n" $s $(random_args "$isl" 1)
                done
                if [ -n "$SPEED_SWEEP" ] && [ ! -f "$SPEED_DATASET" ]; then
                  echo "GATE: FAIL SPEED_DATASET $SPEED_DATASET missing"; fails=$((fails + 1)); SPEED_SWEEP=""
                fi
                sn=$([ -f "$SPEED_DATASET" ] && wc -l < "$SPEED_DATASET" || echo 0)
                for osl in $OUTPUT_LENS; do
                  for e in $PREFILL_SWEEP; do
                    s=$((s + 1)); IFS=: read -r conc n isl <<< "$e"; isl=${isl:-$INPUT_LEN}
                    bench "prefill-in${isl}-out${osl}-c${conc}-n${n}" "$conc" "$n" $s $(random_args "$isl" "$osl")
                  done
                  # The decode ladder runs once, after the OSL 1 prefill sweep.
                  if [ "$osl" = "${OUTPUT_LENS%% *}" ]; then
                    for e in $DECODE_SWEEP; do
                      s=$((s + 1)); IFS=: read -r disl dosl conc n <<< "$e"
                      bench "decode-in${disl}-out${dosl}-c${conc}-n${n}" "$conc" "$n" $s $(random_args "$disl" "$dosl")
                    done
                  fi
                  for conc in $SPEED_SWEEP; do
                    s=$((s + 1))
                    bench "speed-out${osl}-c${conc}-n${sn}" "$conc" "$sn" $s --dataset-name custom --dataset-path "$SPEED_DATASET" --custom-output-len "$osl" --no-oversample --skip-chat-template
                  done
                done
                # The warm and timed pool passes share their prefixes through
                # custom-dataset files built with vLLM's token generator
                # (decode, re-encode to the exact length).
                cat > /tmp/poolgen.py <<'PY'
                import json, multiprocessing as mp, random, sys
                import numpy as np
                from transformers import AutoTokenizer
                from vllm.benchmarks.datasets import gen_prompt_decode_to_target_len

                tok_path, seed, n_prefix, uses, prefix_len, suffix_len, warm_tail, out = sys.argv[1:9]
                seed, n_prefix, uses = int(seed), int(n_prefix), int(uses)
                prefix_len, suffix_len, warm_tail = int(prefix_len), int(suffix_len), int(warm_tail)
                tok = AutoTokenizer.from_pretrained(tok_path, trust_remote_code=True)


                def build(i):
                    rng = np.random.default_rng([seed, i])

                    def exact(n):
                        ids = rng.integers(0, tok.vocab_size, size=n).tolist()
                        return gen_prompt_decode_to_target_len(tok, ids, n, add_special_tokens=False, rng=rng)[1]

                    def join(prefix, tail_len):
                        # The server re-tokenizes the text; redraw the tail until
                        # the prefix survives the junction token for token.
                        for _ in range(20):
                            text = tok.decode(prefix + exact(tail_len))
                            ids = tok.encode(text, add_special_tokens=False)
                            if ids[: len(prefix)] == prefix and len(ids) == len(prefix) + tail_len:
                                return text
                        raise RuntimeError(f"prefix {i} does not survive re-tokenization")

                    p = exact(prefix_len)
                    if len(p) != prefix_len:
                        raise RuntimeError(f"prefix {i} is {len(p)} tokens, not {prefix_len}")
                    return join(p, warm_tail), [join(p, suffix_len) for _ in range(uses)]


                with mp.get_context("fork").Pool(min(8, n_prefix)) as pool:
                    built = pool.map(build, range(n_prefix))
                warm = [w for w, _ in built]
                timed = [t for _, ts in built for t in ts]
                random.Random(seed).shuffle(timed)
                for name, rows in (("warm", warm), ("timed", timed)):
                    with open(f"{out}/{name}.jsonl", "w") as f:
                        for t in rows:
                            f.write(json.dumps({"prompt": t, "output_tokens": 1}) + "\n")
                print(f"POOLGEN prefixes={n_prefix} warm={len(warm)} timed={len(timed)}", flush=True)
                PY
                POOL_ARGS="--dataset-name custom --skip-chat-template --disable-shuffle"
                for e in $POOL_SWEEP; do
                  s=$((s + 1))
                  IFS=: read -r conc uses count osl <<< "$e"; osl=${osl:-1}
                  n=$((count * uses))
                  tag="pool-prefix${PREFIX_LEN}-new${SUFFIX_LEN}-out${osl}-p${count}-c${conc}-n${n}"
                  rm -rf /tmp/pool && mkdir -p /tmp/pool
                  python3 /tmp/poolgen.py "$TOKENIZER" "$s" "$count" "$uses" "$PREFIX_LEN" "$SUFFIX_LEN" "$POOL_WARM_TAIL" /tmp/pool \
                    || { echo "GATE: FAIL $tag: prompt generation"; fails=$((fails + 1)); continue; }
                  bench "pool-warm-out${osl}-p${count}-c${conc}-n${count}" "$conc" "$count" "$s" $POOL_ARGS --custom-output-len 1 --dataset-path /tmp/pool/warm.jsonl
                  bench "$tag" "$conc" "$n" "$s" $POOL_ARGS --custom-output-len "$osl" --dataset-path /tmp/pool/timed.jsonl
                  read -r _ h1 h0 < <(tail -1 /tmp/prefix-hits.txt)
                  # Every timed request can hit its whole prefix; the shortfall is
                  # prefixes the prefill pool evicted.
                  echo "POOL_DONE tag=$tag prefixes=$count requests=$n hit_share=$(awk -v h=$((h1 - h0)) -v d=$((n * PREFIX_LEN)) 'BEGIN {printf "%.3f", h / d}')"
                  [ $((h1 - h0)) -gt 0 ] || { echo "GATE: FAIL $tag: no prefix-cache hit tokens"; fails=$((fails + 1)); }
                done
                rm -rf /tmp/pool
                echo "SUMMARY"; cat "$CDK_OUTPUT_DIR/summary.txt"
                echo "ALL_DONE layout=$LAYOUT fails=$fails $(date -u +%FT%TZ)"
                [ "$fails" = 0 ] && echo "RESULT: PASS ($LAYOUT)" || echo "RESULT: FAIL ($fails gates, $LAYOUT)"
              command:
              - /bin/bash
              - -c
              env:
              - name: JS_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: BASELINE
                value: "0"
              - name: TOKENIZER
                value: /root/models/Qwen3.8-dummy-92L-nvfp4
              - name: TTFT_SWEEP
