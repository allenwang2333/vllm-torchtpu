# Qwen3.8 92-layer dummy-weight 1P1D, without speculative decoding.
# PP4 x PCP8 prefill and TP32 + DCP8 decode on two tpu7x 2x2x4 slices.
# Configuration from the successful j-b1720b37 run on 2026-10-08.
# The source, wheel and model mounts refer to the experiment workspace.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-qwen38-disagg-1p1d-full-no-mtp
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: prefill
    replicas: 4
    template:
      spec:
        backoffLimit: 0
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gke-nodepool
          spec:
            containers:
            - args:
              - |
                set -o pipefail
                LAYOUT=pp4pcp8; [ "$BASELINE" = 1 ] && LAYOUT=pcp16tp2
                echo "BOOT role=prefill host=$JOBSET_JOB_INDEX pod=$(hostname) layout=$LAYOUT profile=$PROFILE $(date -u +%FT%TZ)"
                [ "$PROFILE" = 1 ] && export TPU_STDERR_LOG_LEVEL=0 TPU_VMODULE=tpu_pjrt_client=1
                cd /root/torchtpu-vllm
                export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}
                VLLM_SPEC=$(grep -E '^[[:space:]]*"vllm @ ' pyproject.toml | sed -E 's/^[[:space:]]*"([^"]+)".*/\1/' | head -n1)
                VLLM_TAG=${VLLM_SPEC##*@}; VLLM_TAG=${VLLM_TAG#v}
                VLLM_HAVE=$(pip show vllm 2>/dev/null | sed -n 's/^Version: //p')
                case "$VLLM_HAVE" in
                  "$VLLM_TAG"*) ;;
                  *) VLLM_TARGET_DEVICE=empty uv pip install --system --no-deps "$VLLM_SPEC" >/tmp/pip-vllm.log 2>&1 || { echo "FATAL: vllm install failed"; tail -20 /tmp/pip-vllm.log; exit 1; };;
                esac
                TT_WHL="/root/wheels/$TORCH_TPU_WHEEL"
                [ -f "$TT_WHL" ] || { echo "FATAL: $TT_WHL missing; stage it under /workspace/wheels"; exit 1; }
                uv pip install --system --no-deps --reinstall "$TT_WHL" >/tmp/pip-tt.log 2>&1 || { echo "FATAL: torch_tpu install failed"; tail -20 /tmp/pip-tt.log; exit 1; }
                RAIDEN_WHL="/root/wheels/$RAIDEN_WHEEL"
                [ -f "$RAIDEN_WHL" ] || { echo "FATAL: $RAIDEN_WHL missing; stage it under /workspace/wheels"; exit 1; }
                uv pip install --system --no-deps --reinstall "$RAIDEN_WHL" >/tmp/pip-raiden.log 2>&1 || { echo "FATAL: raiden install failed"; tail -20 /tmp/pip-raiden.log; exit 1; }
                python3 -c 'from tpu_sync.api.torch.kv_cache_manager import _torch_impl; print("raiden native extension OK:", _torch_impl().__file__, flush=True)' \
                  || { echo "FATAL: raiden native extension does not load against $TORCH_TPU_WHEEL"; exit 1; }
                python3 - <<'PY' || exit 1
                import inspect
                from importlib.metadata import version
                from torch_tpu._internal.pallas import pallas
                assert "process_group" in inspect.signature(pallas.get_pallas_mesh).parameters, \
                    "torch_tpu lacks get_pallas_mesh(process_group=); the stage mesh needs torch_tpu#4387"
                print("torch_tpu", version("torch-tpu"), flush=True)
                PY
                # vLLM's --nnodes check and its DP-local inference count dp x pp x tp only; a
                # prefill-context-parallel world fails the divisibility test and would infer
                # data_parallel_size_local from the wrong product.
                python3 - <<'PY' || exit 1
                import pathlib
                import vllm.engine.arg_utils as m
                p = pathlib.Path(m.__file__)
                s = p.read_text()
                old = "                * self.tensor_parallel_size\n            )\n            world_size_within_dp = (\n                self.pipeline_parallel_size * self.tensor_parallel_size\n            )\n"
                new = "                * self.tensor_parallel_size\n                * self.prefill_context_parallel_size\n            )\n            world_size_within_dp = (\n                self.pipeline_parallel_size * self.tensor_parallel_size\n                * self.prefill_context_parallel_size\n            )\n"
                assert s.count(old) == 1, s.count(old)
                p.write_text(s.replace(old, new))
                print("vllm --nnodes check counts prefill context parallelism", flush=True)
                PY
                ls "$MODEL_DIR/config.json" >/dev/null || { echo "FATAL: $MODEL_DIR has no config.json"; exit 1; }
                unset TPU_PROCESS_ADDRESSES TPU_PROCESS_PORT TPU_WORKER_HOSTNAMES TPU_WORKER_ID TPU_NAME MEGASCALE_COORDINATOR_ADDRESS MEGASCALE_PORT MEGASCALE_NUM_SLICES MEGASCALE_SLICE_ID TPU_VISIBLE_CHIPS TPU_VISIBLE_DEVICES
                HEAD_ADDR="${JS_NAME}-prefill-0-0.${JS_NAME}"
                for i in $(seq 1 360); do HEAD_IP=$(getent hosts "$HEAD_ADDR" | awk '{print $1}' | head -1); [ -n "$HEAD_IP" ] && break; sleep 5; done
                [ -n "$HEAD_IP" ] || { echo "FATAL: cannot resolve $HEAD_ADDR"; exit 1; }
                # One engine over four hosts: the reshard store lives in the
                # transfer-rank-0 worker on host 0, so every host advertises
                # host 0.
                NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                export TPU_KV_TRANSFER_NAMESPACE="${NS}_prefill"
                export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-prefill-engine"
                export TPU_RAIDEN_RESHARD_IMPL=store
                export TPU_RAIDEN_ADVERTISE_HOST="$HEAD_ADDR"
                export TPU_RAIDEN_RESHARD_PORT_BASE=28000
                export TPU_RAIDEN_STORE_DISPATCH_PORT_BASE=28100
                export RAIDEN_DISABLE_SINGLETON_WORKER=1
                export TPU_PP_DYNAMIC_CHUNKS=$DYNAMIC_CHUNKS TPU_PP_LAZY_PUSH=0
                # compile_sizes are per-rank token paddings: a 32768-token step
                # is 4096 tokens per rank at PCP8; PCP16 x TP2 takes a 65536-token
                # step at the same per-rank padding.
                case "$LAYOUT" in
                  pp4pcp8)
                    PAR="--pipeline-parallel-size 4 --tensor-parallel-size 1 --prefill-context-parallel-size 8"
                    MNBT=32768; SIZES="512,1024,2048,4096"
                    # A pipeline producer pairs pools by layer on both peers.
                    export TPU_RAIDEN_POOL_TAGS_PER_LAYER=1;;
                  pcp16tp2)
                    PAR="--pipeline-parallel-size 1 --tensor-parallel-size 2 --prefill-context-parallel-size 16"
                    MNBT=65536; SIZES="512,1024,2048,4096";;
                esac
                KV_OVERRIDE=""; [ "$KV_BLOCKS" = 0 ] || KV_OVERRIDE="--num-gpu-blocks-override $KV_BLOCKS"
                PREFIX="--enable-prefix-caching"; [ "$PREFIX_CACHING" = 0 ] && PREFIX="--no-enable-prefix-caching"
                HEADLESS=""; [ "$JOBSET_JOB_INDEX" != "0" ] && HEADLESS="--headless"
                KV_CONFIG='{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer","kv_port":14579,"kv_connector_extra_config":{"destination_decode_context_parallel_size":8}}'
                echo "SERVE_START role=prefill layout=$LAYOUT kv_blocks=$KV_BLOCKS mnbt=$MNBT prefix_caching=$PREFIX_CACHING host=$JOBSET_JOB_INDEX $(date -u +%FT%TZ)"
                vllm serve "$MODEL_DIR" --served-model-name q38 $HEADLESS \
                  --nnodes 4 --node-rank "$JOBSET_JOB_INDEX" --master-addr "$HEAD_IP" --master-port 29500 \
                  --distributed-executor-backend mp \
                  $PAR --enable-expert-parallel --disable-custom-all-reduce --no-async-scheduling \
                  --load-format dummy --dtype bfloat16 --trust-remote-code --seed 42 --generation-config vllm \
                  --max-model-len "$MAX_MODEL_LEN" --max-num-seqs 64 --max-num-batched-tokens "$MNBT" --long-prefill-token-threshold 32768 \
                  --gpu-memory-utilization 0.90 $KV_OVERRIDE --block-size 384 --cp-kv-cache-interleave-size 128 \
                  --attention-backend CUSTOM --kv-cache-dtype fp8 --mamba-ssm-cache-dtype bfloat16 \
                  $PREFIX --no-disable-hybrid-kv-cache-manager --language-model-only \
                  --kv-transfer-config "$KV_CONFIG" \
                  --host 0.0.0.0 --port 8000 --no-enable-log-requests \
                  --compilation-config "{\"backend\":\"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor\",\"compile_sizes\":[$SIZES],\"inductor_compile_config\":{\"enable_auto_functionalized_v2\":false,\"size_asserts\":false,\"alignment_asserts\":false,\"scalar_asserts\":false}}" \
                  --additional-config '{"tpu_online_fp8":{"enabled":true,"weight_scheme":"per_channel","targets":["model.layers.*.self_attn.qkv_proj","model.layers.*.self_attn.o_proj","model.layers.*.linear_attn.in_proj_qkvz","model.layers.*.linear_attn.in_proj_ba","model.layers.*.linear_attn.out_proj","model.layers.*.mlp.shared_expert.gate_up_proj","model.layers.*.mlp.shared_expert.down_proj"],"exclude":["model.layers.*.mlp.experts*"]}}' \
                  > >(tee /tmp/serve.log) 2>&1 &
                SPID=$!
                for i in $(seq 1 720); do
                  kill -0 $SPID 2>/dev/null || break
                  grep -q 'Memory statistics' /tmp/serve.log 2>/dev/null && break
                  sleep 5
                done
                sleep 240
                echo "MARKERS host=$JOBSET_JOB_INDEX"
                grep -E 'Pipeline chunk|pipeline chunk|Overriding num_gpu_blocks|Memory statistics|GPU KV cache size|admission complete|topology=|Raiden' /tmp/serve.log | sed 's/^/MARK /' | sort -u | head -40
                wait $SPID; rc=$?
                echo "SERVER_EXITED role=prefill host=$JOBSET_JOB_INDEX rc=$rc $(date -u +%FT%TZ)"
                exit $rc
              command:
              - /bin/bash
              - -c
              env:
              - name: JS_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: JOBSET_JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: VLLM_HOST_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: BASELINE
                value: "0"
              - name: PROFILE
                value: "0"
              - name: DYNAMIC_CHUNKS
                value: "1"
              - name: PREFIX_CACHING
                value: "1"
              - name: TORCH_TPU_WHEEL
                value: torch_tpu-0.1.1.dev20260928182719-cp312-cp312-manylinux_2_31_x86_64.whl
              - name: RAIDEN_WHEEL
                value: tpu_sync_torch-0.0.1.dev20261007210147-1_pp_reshard_0923_55a23251-cp312-cp312-manylinux_2_31_x86_64.whl
              - name: KV_BLOCKS
                value: "0"
              - name: MAX_MODEL_LEN
                value: "139264"
              - name: MODEL_DIR
                value: /root/models/Qwen3.8-dummy-92L-nvfp4
              - name: TPU_MULTIHOST_BACKEND
                value: mp
              - name: VLLM_KV_CACHE_LAYOUT
                value: HND
              - name: TPU_RAIDEN_DST_SHARDS
                value: "32"
              - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                value: "32"
              - name: TPU_GDN_CONV_QK_PAIR_LAYOUT
                value: "1"
              - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                value: "1"
              - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                value: "1"
              - name: TPU_RAIDEN_QWEN35_ADMISSION
                value: "1"
              - name: TPU_KV_RESHARD_TRANSPORT
                value: raiden
              - name: TPU_RAIDEN_JOB_NAME
                value: prefill
              - name: TPU_P2P_WAIT_PULL_TIMEOUT
                value: "600"
              - name: TPU_KV_SHM_POOL_GB
                value: "8"
              - name: TPU_KV_TRANSFER_PORT
                value: "9100"
              - name: TPU_SIDE_CHANNEL_PORT
                value: "9600"
              - name: USE_BATCHED_RPA_LONGCTX
                value: "1"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              - name: TPU_PARALLEL_PRECOMPILE
                value: "1"
              - name: TPU_PREMAPPED_BUFFER_SIZE
                value: "17179869184"
              - name: MOE_REQUANTIZE_BLOCK_SIZE
                value: "256"
              - name: MOE_FUSED_EP_KERNEL_IMPL
                value: adaptive
              - name: USE_MOE_FUSED_EP_KERNEL
                value: "1"
              - name: MOE_FUSED_EP_ENABLE_W4A8
                value: "1"
              - name: MOE_FUSED_EP_V2_SHARDED_PLAN
                value: "0"
              - name: TPU_MOE_SKIP_PADDED_TOKENS
                value: "0"
              - name: TPU_MOE_COLLECTION_CHUNK_SIZE
                value: "65536"
              - name: RAGGED_GATHER_REDUCE_VERSION
                value: v3
              - name: LIBTPU_INIT_ARGS
                value: --xla_tpu_enable_diagnostic_coordinator=false
              - name: VLLM_CACHE_ROOT
                value: /mnt/workspace/compilation-cache/qwen38-disagg-1p1d-full
              - name: TORCHINDUCTOR_AUTOGRAD_CACHE
                value: "0"
              - name: VLLM_XLA_CHECK_RECOMPILATION
                value: "0"
              - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                value: disabled
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: TPU_MP_RENDEZVOUS_TIMEOUT_S
                value: "1800"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: MALLOC_ARENA_MAX
                value: "16"
              - name: MALLOC_TRIM_THRESHOLD_
                value: "131072"
              - name: MALLOC_MMAP_THRESHOLD_
                value: "1048576"
              - name: PYTHONUNBUFFERED
                value: "1"
              image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-dev:nightly-20261001
              imagePullPolicy: IfNotPresent
              name: server
              resources:
                limits:
                  google.com/tpu: "4"
                  memory: 700Gi
                requests:
                  google.com/tpu: "4"
                  memory: 700Gi
              securityContext:
                capabilities:
                  add:
                  - IPC_LOCK
                privileged: true
              volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /root/torchtpu-vllm
                name: torchtpu-vllm-nfs
              - mountPath: /root/wheels
                name: wheels
                readOnly: true
              - mountPath: /root/models
                name: models
                readOnly: true
              - mountPath: /mnt/workspace/compilation-cache
                name: compilation-cache
            initContainers:
            - args:
              - |
                sysctl -w vm.max_map_count=8388608
                if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                  echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                fi
              command:
              - /bin/sh
              - -c
              image: busybox
              name: tpu-node-setup
              securityContext:
                privileged: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x4
            restartPolicy: Never
            volumes:
            - emptyDir:
                medium: Memory
              name: dshm
            - name: torchtpu-vllm-nfs
              nfs:
                path: /workspace/vllm-torchtpu/pp-pcp-head-gcfreeze
                server: 10.225.237.178
            - name: wheels
              nfs:
                path: /workspace/wheels
                server: 10.225.237.178
            - name: models
              nfs:
                path: /workspace/models
                server: 10.225.237.178
            - name: compilation-cache
              nfs:
                path: /workspace/compilation-cache
                server: 10.225.237.178
  - name: decode
    replicas: 4
    template:
      spec:
        backoffLimit: 0
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gke-nodepool
          spec:
            containers:
            - args:
              - |
                set -o pipefail
                LAYOUT=pp4pcp8; [ "$BASELINE" = 1 ] && LAYOUT=pcp16tp2
