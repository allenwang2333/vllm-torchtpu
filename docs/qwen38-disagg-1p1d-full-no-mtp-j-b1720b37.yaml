                uv pip install --system --no-deps --reinstall "$RAIDEN_WHL" >/tmp/pip-raiden.log 2>&1 || { echo "FATAL: raiden install failed"; tail -20 /tmp/pip-raiden.log; exit 1; }
                python3 -c 'from tpu_sync.api.torch.kv_cache_manager import _torch_impl; print("raiden native extension OK:", _torch_impl().__file__, flush=True)' \
