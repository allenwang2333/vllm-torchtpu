apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-parity-v7x-8
  namespace: cloud-devkit-jobs
  labels:
    kueue.x-k8s.io/queue-name: lq-patemotter-google-com
spec:
  backoffLimit: 0
  template:
    spec:
      volumes:
      - name: nfs-root-volume
        nfs:
          server: 172.30.171.18
          path: /workspace
      - name: local-ssd-volume
        emptyDir:
          sizeLimit: 100Gi
      containers:
      - name: parity-runner
        image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-patemotter_google_com:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=== Generating Mock Weights ==="
          python3 /root/cloud-devkit/torchtpu-vllm/examples/generate_mock_weights.py
          echo "=== Running DeepSeek-V4 Pipeline Parity Check ==="
          cd /root/cloud-devkit/torchtpu-vllm
          # Run the parity script
          PYTHONPATH=/root/cloud-devkit/torchtpu-vllm/src python3 -u examples/verify_pipeline_parity.py
        env:
        - name: PYTHONPATH
          value: /root/cloud-devkit/torchtpu-vllm/src
        resources:
          limits:
            google.com/tpu: "4"
            memory: 200Gi
            cpu: "90"
          requests:
            google.com/tpu: "4"
            memory: 128Gi
            cpu: "90"
        volumeMounts:
        - name: nfs-root-volume
          mountPath: /mnt/workspace
        - name: nfs-root-volume
          mountPath: /root/cloud-devkit/torchtpu-vllm
          subPath: torchtpu-vllm
        - name: local-ssd-volume
          mountPath: /mnt/local-cache
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
