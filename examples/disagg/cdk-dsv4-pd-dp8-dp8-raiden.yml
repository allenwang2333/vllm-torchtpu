# DeepSeek-V4-Flash P/D disaggregation, DP8 prefill + DP8 decode, two tpu7x nodes.
#
# Tier 2 of examples/disagg/VERIFICATION_DSV4_PD.md. Read that first. Tier 1 on a
# single host is green as of the recycled-page guard, which the tarball this
# recipe pulls has to contain; without it the `dsv4.state.csa.g4` trim crash
# takes the prefill replica down and the run is wasted.
#
# Shape. Each `2x2x1` tpu7x node is 4 chips and 8 devices, so one node is a DP8
# replica: prefill on the first, decode on the second, KV crossing the network
# through Raiden in store mode. That last point is what makes this different from
# the single-host run, which cannot rule out a producer and consumer quietly
# sharing a host.
#
# Derived from recipes/benchmark/vllm-torchtpu/qwen3.5-397b/
# vllm-qwen35-397b-pd-pcp8-dp8-raiden.yml, with the tpu_sync preflight taken from
# recipes/experimental/torchtpu-vllm/disagg-offloading/
# qwen35-gpc-global-offloading.yml. The Qwen P/D recipe's own image is pinned at
# 20260804-Raiden, which predates the tpu_raiden -> tpu_sync rename that PR #684
# depends on, so it cannot run this.
#
# The image has to carry a Raiden that exposes the module as tpu_sync, and most
# of the images in vllm-tpu-rdna do not. vllm-torchtpu-amylin:v3-raiden-upgrade
# does, and it also happens to match the environment Tier 1 was verified in:
# libtpu 0.0.44.1, torch 2.13.0+cpu and vllm 0.27.0+empty are all identical, and
# its torch_tpu (dev20260831) and tpu_raiden_torch (dev20260827) are each about
# two weeks newer than the local pins. The first run of this recipe used
# vllm-torchtpu-benliangw_google_com:latest, which the gpc offloading recipe
# names, and it died in the preflight: that tag has drifted to torch 2.11 and
# vllm 0.23 with no Raiden installed under any name. If you retarget the image,
# probe it for `from tpu_sync.api.torch.reshard_client import ReshardClient`
# first, because a wrong tag costs two TPU nodes and fifteen seconds to find out.
#
# What differs from the Qwen recipe, and why:
#
#   - Prefill is `--data-parallel-size 8`, not `--prefill-context-parallel-size 8`.
#     Both replicas run DP attention at TP1.
#   - TPU_RAIDEN_TRANSFER_PARALLELISM is 1, not 8. DSv4 admission rejects anything
#     else, because DP attention hands every rank whole requests.
#   - TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL is 0, not 1. The unified pool yields an
#     `aliased_raw` binding and build_dsv4_pool_manifest requires private typed
#     tensors, so admission would reject it at startup.
#   - TPU_RAIDEN_DSV4_ADMISSION replaces TPU_RAIDEN_QWEN35_ADMISSION.
#   - TPU_RAIDEN_RESHARD_IMPL=store, so there is no controller sidecar at all.
#     DSv4 requires store mode; the Qwen recipe's controller block is dropped.
#   - The connector is TPUConnector, not TPURaidenConnector, matching
#     launch_dsv4_dp4_dp4.sh.
#   - No --mamba-cache-mode, no --block-size 8192, no --num-gpu-blocks-override.
#     Those exist for Qwen3.5's Mamba fit floor; DSv4's groups page at sizes the
#     runner derives (1024 down to 16 tokens), and overriding block size would
#     break the per-group geometry this PR exists to support.
#
# Both of this recipe's out-of-band inputs are staged in GCS, so it needs no NFS
# and no custom image. PR #684 is unmerged and no published image carries it, so
# each container pulls the source as a tarball, the same way the structured
# decoding recipes pull pr596 and pr625, and puts it ahead of the image's copy on
# PYTHONPATH. Rebuild that tarball from the PR checkout after any change:
#
#   git archive --format=tar.gz -o pr684.tar.gz HEAD
#   gsutil cp pr684.tar.gz gs://alynie-k3-scratch/repos/vllm-torchtpu/prs/
#
# The checkpoint is the other input. DeepSeek-V4-Flash is not under
# gs://cloud-devkit/ckpt/hf, which holds only Qwen and nvidia/GLM, and no other
# recipe in the cluster runs a DeepSeek model, so there was nothing to reuse. The
# 149 GiB snapshot is uploaded to gs://alynie-k3-scratch/ckpt/hf and passed to
# --model as a gs:// URI, exactly as the Qwen recipes pass theirs.
#
# Run it by registering the file in your cloud-devkit-recipes checkout's
# recipes.yml under a `k8s_file:` key, then:
#
#   cdk job create dsv4-pd-dp8-dp8-raiden --tags agent-jobs \
#       --active-deadline-seconds 7200
#
# Note that cdk runs the whole file through Go's text/template before it parses
# any YAML, so a comment cannot contain a bare template action; that is a parse
# error, not a comment.
#
# Without the cdk CLI, render_cdk_recipe.py substitutes the placeholder defaults
# and adds the namespace, the Kueue labels and the name cdk would otherwise
# supply, and the result goes in with plain kubectl. Be aware that this does not
# survive: cdk's job-manager reaps JobSets it did not create, and it took one
# out seventeen minutes in while it was still queued.
#
#   python3 examples/disagg/render_cdk_recipe.py \
#       examples/disagg/cdk-dsv4-pd-dp8-dp8-raiden.yml --name dsv4-pd-<you> \
#     | kubectl apply -f -

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-dsv4-pd-dp8-dp8-raiden
spec:
  # The proxy, the consumer and Raiden all address peers as
  # `${JS_NAME}-prefill-0-0.${JS_NAME}`, so the headless service has to publish
  # those names, and it has to publish them before the pods are ready: the
  # producer resolves the consumer while it is still loading weights.
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - benchmark
  ttlSecondsAfterFinished: 1800
  replicatedJobs:

    # ---------------------------------------------------------
    # PREFILL (DP8) + PROXY
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                - name: hf-token-volume
                  secret:
                    secretName: vllm-hf-token
                    items:
                      - key: HF_TOKEN
                        path: token
              containers:
                - name: vllm-tpu-prefill
                  image: "{{ .IMAGE | default `us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-amylin:v3-raiden-upgrade` }}"
                  imagePullPolicy: Always
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -eo pipefail
                      export PYTHONUNBUFFERED=1
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"

                      # PR #684 is unmerged, so pull it from GCS and put it
                      # ahead of the image's copy. Same mechanism the structured
                      # decoding recipes use for pr596 and pr625.
                      mkdir -p /workspace/vllm-torchtpu
                      # The image has no gcloud, so fetch through the JSON API
                      # with the node's own metadata-server token.
                      GCS_TOKEN=$(curl -sS -m 10 -H "Metadata-Flavor: Google" \
                        http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                        | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
                      GCS_PATH=${PR_TARBALL#gs://}
                      curl -sSf -m 300 -H "Authorization: Bearer $GCS_TOKEN" -o /tmp/pr684.tar.gz \
                        "https://storage.googleapis.com/storage/v1/b/${GCS_PATH%%/*}/o/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${GCS_PATH#*/}")?alt=media"
                      tar -xzf /tmp/pr684.tar.gz -C /workspace/vllm-torchtpu
                      export PYTHONPATH=/workspace/vllm-torchtpu/src:/workspace/vllm-torchtpu:${PYTHONPATH:-}

                      # Preflight. Every one of these fails loudly at startup
                      # rather than silently mis-transferring later, which is
                      # the whole point of checking them before a two-hour run.
                      # $MODEL is a gs:// URI and vLLM reads object storage only
                      # through the Run:ai streamer, which this image does not ship.
                      # It is a 2 MB pure-python wheel plus a small .so, so installing
                      # it here beats maintaining a fork of the image.
                      python3 -m pip install --no-cache-dir -q \
                        runai-model-streamer runai-model-streamer-gcs
                      python3 -c "from tpu_sync.api.torch.reshard_client import ReshardClient; print('tpu_sync OK')"
                      python3 -c "
                      import vllm_torchtpu.distributed.kv_transfer.tpu_connector as c
                      assert hasattr(c, '_stage3_dsv4_pool_pages'), 'image lacks PR #684'
                      from vllm_torchtpu.distributed.kv_transfer.raiden.pool_manifest import build_dsv4_pool_manifest
                      print('PR #684 present, DSv4 manifest importable')
                      "

                      export VLLM_HOST_IP="${JS_NAME}-prefill-0-0.${JS_NAME}"
                      NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                      export TPU_KV_TRANSFER_NAMESPACE="${NS}_prefill"
                      export TPU_RAIDEN_JOB_NAME=prefill
                      export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-prefill-engine"
                      export TPU_RAIDEN_ADVERTISE_HOST="${VLLM_HOST_IP}"

                      # 512, not the 4096 launch_dsv4_dp4_dp4.sh compiles for.
                      # DP attention all-gathers every rank's tokens before the
                      # MoE, so the graph is sized by tokens-per-step times DP,
                      # and only about 95 GiB of HBM is free once the weights
                      # are resident. Measured at DP8, the XLA temporaries came
                      # to 114.93 GiB for a 4096-token step, 100.96 GiB for
                      # 2048 and 94.75 GiB for 1024, the last of these missing
                      # the 94.74 GiB budget by ten megabytes. Halving the
                      # step buys roughly 6 GiB, so 512 leaves a few GiB of
                      # margin. The oracle's longest prompt is 2048 tokens and
                      # arrives as four chunks.
                      COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[512],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'
                      KV_TRANSFER_CONFIG='{"kv_connector":"TPUConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer"}'

                      echo "===== Starting DeepSeek-V4 DP8 prefill ====="
                      # Grabbing the TPU fails outright when the previous tenant of
                      # this node has not finished releasing it: PjRtClient reports
                      # "Failed to start the gRPC server" and every worker dies inside
                      # init_device. That is transient, and on a shared cluster it has
                      # already cost two runs, so retry it. Only a death in the first
                      # four minutes is retried; the weights are still streaming then,
                      # so anything later is a real fault and should surface.
                      for attempt in 1 2 3; do
                        started=$SECONDS
                        set +e
                        vllm serve \
                          "$MODEL" \
                          --load-format runai_streamer \
                          --served-model-name "$SERVED_MODEL" \
                          --trust-remote-code \
                          --seed 42 \
                          --max-model-len 9216 \
                          --enable-expert-parallel \
                          --disable-custom-all-reduce \
                          --gpu-memory-utilization 0.95 \
                          --kv-cache-dtype fp8_e4m3 \
                          --language-model-only \
                          --max-num-batched-tokens 512 \
                          --max-num-seqs 8 \
                          --no-disable-hybrid-kv-cache-manager \
                          --attention-backend CUSTOM \
                          --enable-prompt-tokens-details \
                          --no-enable-log-requests \
                          --compilation-config "$COMPILATION_CONFIG" \
                          --no-enable-prefix-caching \
                          --no-async-scheduling \
                          --tensor-parallel-size 1 \
                          --prefill-context-parallel-size 1 \
                          --data-parallel-size 8 \
                          --data-parallel-size-local 8 \
                          --host 0.0.0.0 \
                          --port 8000 \
                          --kv-transfer-config "$KV_TRANSFER_CONFIG" \
                          2>&1 | tee -a "$CDK_OUTPUT_DIR/server.log"
                        rc=${PIPESTATUS[0]}
                        set -e
                        elapsed=$(( SECONDS - started ))
                        if [ "$rc" -eq 0 ] || [ "$elapsed" -gt 240 ]; then
                          exit "$rc"
                        fi
                        echo "vllm serve died after ${elapsed}s (rc=$rc) on attempt $attempt; retrying"
                        sleep 30
                      done
                      exit 1
                  env: &dsv4-env
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: PR_TARBALL
                      value: "{{ .PR_TARBALL | default `gs://alynie-k3-scratch/repos/vllm-torchtpu/prs/pr684.tar.gz` }}"
                    - name: MODEL
                      value: "{{ .MODEL | default `gs://alynie-k3-scratch/ckpt/hf/deepseek-ai/DeepSeek-V4-Flash` }}"
                    - name: SERVED_MODEL
                      value: "deepseek-ai/DeepSeek-V4-Flash"
                    - name: VLLM_LOGGING_LEVEL
                      value: "INFO"
                    - name: HF_HUB_DISABLE_XET
                      value: "1"
                    # --- device / topology (8 devices on one 2x2x1 tpu7x host) ---
                    - name: JAX_PLATFORMS
                      value: "tpu,cpu"
                    - name: PJRT_DEVICE
                      value: TPU
                    - name: TPU_BACKEND_TYPE
                      value: "jax"
                    - name: VLLM_TARGET_DEVICE
                      value: "tpu"
                    - name: TPU_TOPOLOGY
                      value: "2x2x1"
                    - name: TPU_CHIPS_PER_HOST_BOUNDS
                      value: "2,2,1"
                    - name: TPU_HOST_BOUNDS
                      value: "1,1,1"
                    - name: TPU_LIBRARY_PATH
                      value: ""
                    - name: MEGASCALE_NUM_SLICES
                      value: ""
                    - name: MEGASCALE_SLICE_ID
                      value: ""
                    - name: TPU_PROCESS_ADDRESSES
                      value: ""
                    - name: TPU_WORKER_HOSTNAMES
                      value: ""
                    - name: TPU_PROCESS_PORT
                      value: ""
                    - name: MEGASCALE_COORDINATOR_ADDRESS
                      value: ""
                    - name: MEGASCALE_PORT
                      value: ""
                    # --- DSv4 model / kernel config, from launch_dsv4_dp4_dp4.sh ---
                    - name: VLLM_PLUGINS
                      value: "torchtpu,torchtpu_layers"
                    - name: MODEL_IMPL_TYPE
                      value: "vllm"
                    - name: NEW_MODEL_DESIGN
                      value: "0"
                    - name: SKIP_JAX_PRECOMPILE
                      value: "1"
                    - name: VLLM_XLA_CHECK_RECOMPILATION
                      value: "0"
                    - name: USE_MOE_SPARSE_CORE
                      value: "0"
                    - name: MOE_REQUANTIZE_WEIGHT_DTYPE
                      value: "fp4"
                    - name: ENABLE_QUANTIZED_MATMUL_KERNEL
                      value: "0"
                    - name: XLA_PYTHON_CLIENT_PREALLOCATE
                      value: "false"
                    - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                      value: "1"
                    - name: LIBTPU_INIT_ARGS
                      value: "--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_enable_latency_hiding_scheduler=false"
                    - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                      value: "disabled"
                    # MoE fp4 requantization dominates startup; Tier 1 took ~16
                    # minutes to healthy on a comparable host.
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "2700"
                    # --- Raiden KV transfer ---
                    # 0, not 1: the unified pool gives an aliased_raw binding and
                    # build_dsv4_pool_manifest demands private typed tensors.
                    - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                      value: "0"
                    - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                      value: "1"
                    - name: TPU_RAIDEN_DSV4_ADMISSION
                      value: "1"
                    - name: TPU_KV_RESHARD_TRANSPORT
                      value: "raiden"
                    - name: TPU_RAIDEN_RESHARD_IMPL
                      value: "store"
                    # DP attention gives every rank whole requests, so anything
                    # other than 1 is rejected by DSv4 admission.
                    - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                      value: "1"
                    - name: TPU_RAIDEN_RESHARD_PORT_BASE
                      value: "28000"
                    - name: TPU_RAIDEN_STORE_DISPATCH_PORT_BASE
                      value: "28100"
                    - name: TPU_ENABLE_D2H_TRANSFER
                      value: "1"
                    - name: TPU_KV_SHM_POOL_GB
                      value: "8"
                    - name: TPU_KV_TRANSFER_PORT
                      value: "9100"
                    - name: TPU_SIDE_CHANNEL_PORT
                      value: "9600"
                  volumeMounts:
                    - name: hf-token-volume
                      mountPath: /root/.cache/huggingface/token
                      subPath: token
                      readOnly: true
                    - name: dshm
                      mountPath: /dev/shm
                  securityContext:
                    privileged: true
                    capabilities:
                      add:
                        - IPC_LOCK
                  resources:
                    limits:
                      google.com/tpu: "4"
                      memory: "850Gi"
                      cpu: "200"
                    requests:
                      google.com/tpu: "4"
                      memory: "850Gi"
                      cpu: "200"
                  ports:
                    - containerPort: 8000

                - name: vllm-tpu-proxy
                  image: "{{ .IMAGE | default `us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-amylin:v3-raiden-upgrade` }}"
                  imagePullPolicy: Always
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -eo pipefail
                      mkdir -p /workspace/vllm-torchtpu
                      # The image has no gcloud, so fetch through the JSON API
                      # with the node's own metadata-server token.
                      GCS_TOKEN=$(curl -sS -m 10 -H "Metadata-Flavor: Google" \
                        http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                        | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
                      GCS_PATH=${PR_TARBALL#gs://}
                      curl -sSf -m 300 -H "Authorization: Bearer $GCS_TOKEN" -o /tmp/pr684.tar.gz \
                        "https://storage.googleapis.com/storage/v1/b/${GCS_PATH%%/*}/o/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${GCS_PATH#*/}")?alt=media"
                      tar -xzf /tmp/pr684.tar.gz -C /workspace/vllm-torchtpu

                      PREFILLER_DNS="${JS_NAME}-prefill-0-0.${JS_NAME}"
                      DECODER_DNS="${JS_NAME}-decode-0-0.${JS_NAME}"
                      python3 /workspace/vllm-torchtpu/examples/disagg/toy_proxy_server.py \
                        --host 0.0.0.0 \
                        --port 10000 \
                        --prefiller-hosts $PREFILLER_DNS \
                        --prefiller-ports 8000 \
                        --decoder-hosts $DECODER_DNS \
                        --decoder-ports 7200
                  env:
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: PR_TARBALL
                      value: "{{ .PR_TARBALL | default `gs://alynie-k3-scratch/repos/vllm-torchtpu/prs/pr684.tar.gz` }}"
                  ports:
                    - containerPort: 10000
                  resources:
                    requests: { cpu: "8", memory: "16Gi" }
                    limits: { cpu: "16", memory: "32Gi" }

    # ---------------------------------------------------------
    # DECODE (DP8)
    # ---------------------------------------------------------
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                - name: hf-token-volume
                  secret:
                    secretName: vllm-hf-token
                    items:
                      - key: HF_TOKEN
                        path: token
              containers:
                - name: vllm-tpu-decode
                  image: "{{ .IMAGE | default `us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-amylin:v3-raiden-upgrade` }}"
                  imagePullPolicy: Always
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -eo pipefail
                      export PYTHONUNBUFFERED=1
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"

                      mkdir -p /workspace/vllm-torchtpu
                      # The image has no gcloud, so fetch through the JSON API
                      # with the node's own metadata-server token.
                      GCS_TOKEN=$(curl -sS -m 10 -H "Metadata-Flavor: Google" \
                        http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                        | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
                      GCS_PATH=${PR_TARBALL#gs://}
                      curl -sSf -m 300 -H "Authorization: Bearer $GCS_TOKEN" -o /tmp/pr684.tar.gz \
                        "https://storage.googleapis.com/storage/v1/b/${GCS_PATH%%/*}/o/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${GCS_PATH#*/}")?alt=media"
                      tar -xzf /tmp/pr684.tar.gz -C /workspace/vllm-torchtpu
                      export PYTHONPATH=/workspace/vllm-torchtpu/src:/workspace/vllm-torchtpu:${PYTHONPATH:-}
                      # $MODEL is a gs:// URI and vLLM reads object storage only
                      # through the Run:ai streamer, which this image does not ship.
                      # It is a 2 MB pure-python wheel plus a small .so, so installing
                      # it here beats maintaining a fork of the image.
                      python3 -m pip install --no-cache-dir -q \
                        runai-model-streamer runai-model-streamer-gcs
                      python3 -c "from tpu_sync.api.torch.reshard_client import ReshardClient; print('tpu_sync OK')"
                      python3 -c "
                      import vllm_torchtpu.distributed.kv_transfer.tpu_connector as c
                      assert hasattr(c, '_stage3_dsv4_pool_pages'), 'image lacks PR #684'
                      print('PR #684 present')
                      "

                      export VLLM_HOST_IP="${JS_NAME}-decode-0-0.${JS_NAME}"
                      NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                      export TPU_KV_TRANSFER_NAMESPACE="${NS}_decode"
                      export TPU_RAIDEN_JOB_NAME=decode
                      export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-decode-engine"
                      export TPU_RAIDEN_ADVERTISE_HOST="${VLLM_HOST_IP}"

                      # 256 is what the decode replica is compiled for in
                      # launch_dsv4_dp4_dp4.sh and therefore what Tier 1 was
                      # verified against. Decode only ever runs single-token
                      # steps here, because the producer ships the prefix.
                      # Its --max-num-batched-tokens is 512 for the same
                      # reason as prefill: the memory-profiling run compiles
                      # at that size before any KV cache exists, and at DP8
                      # anything larger does not fit in the free HBM.
                      COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[256],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'
                      KV_TRANSFER_CONFIG='{"kv_connector":"TPUConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_consumer"}'

                      echo "===== Starting DeepSeek-V4 DP8 decode ====="
                      # Grabbing the TPU fails outright when the previous tenant of
                      # this node has not finished releasing it: PjRtClient reports
                      # "Failed to start the gRPC server" and every worker dies inside
                      # init_device. That is transient, and on a shared cluster it has
                      # already cost two runs, so retry it. Only a death in the first
                      # four minutes is retried; the weights are still streaming then,
                      # so anything later is a real fault and should surface.
                      for attempt in 1 2 3; do
                        started=$SECONDS
                        set +e
                        vllm serve \
                          "$MODEL" \
                          --load-format runai_streamer \
                          --served-model-name "$SERVED_MODEL" \
                          --trust-remote-code \
                          --seed 42 \
                          --max-model-len 9216 \
                          --enable-expert-parallel \
                          --disable-custom-all-reduce \
                          --gpu-memory-utilization 0.95 \
                          --kv-cache-dtype fp8_e4m3 \
                          --language-model-only \
                          --max-num-batched-tokens 512 \
                          --max-num-seqs 8 \
                          --no-disable-hybrid-kv-cache-manager \
                          --attention-backend CUSTOM \
                          --enable-prompt-tokens-details \
                          --no-enable-log-requests \
                          --compilation-config "$COMPILATION_CONFIG" \
                          --no-enable-prefix-caching \
                          --no-async-scheduling \
                          --tensor-parallel-size 1 \
                          --prefill-context-parallel-size 1 \
                          --api-server-count 1 \
                          --data-parallel-size 8 \
                          --data-parallel-size-local 8 \
                          --host 0.0.0.0 \
                          --port 7200 \
                          --kv-transfer-config "$KV_TRANSFER_CONFIG" \
                          2>&1 | tee -a "$CDK_OUTPUT_DIR/server.log"
                        rc=${PIPESTATUS[0]}
                        set -e
                        elapsed=$(( SECONDS - started ))
                        if [ "$rc" -eq 0 ] || [ "$elapsed" -gt 240 ]; then
                          exit "$rc"
                        fi
                        echo "vllm serve died after ${elapsed}s (rc=$rc) on attempt $attempt; retrying"
                        sleep 30
                      done
                      exit 1
                  env: *dsv4-env
                  volumeMounts:
                    - name: hf-token-volume
                      mountPath: /root/.cache/huggingface/token
                      subPath: token
                      readOnly: true
                    - name: dshm
                      mountPath: /dev/shm
                  securityContext:
                    privileged: true
                    capabilities:
                      add:
                        - IPC_LOCK
                  resources:
                    limits:
                      google.com/tpu: "4"
                      memory: "850Gi"
                      cpu: "200"
                    requests:
                      google.com/tpu: "4"
                      memory: "850Gi"
                      cpu: "200"
                  ports:
                    - containerPort: 7200

    # ---------------------------------------------------------
    # BENCHMARK: the Tier 1 oracles, unchanged, against the two-host proxy
    # ---------------------------------------------------------
    - name: benchmark
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: bench
                  image: "{{ .IMAGE | default `us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-amylin:v3-raiden-upgrade` }}"
                  imagePullPolicy: Always
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      mkdir -p "$CDK_OUTPUT_DIR"
                      PROXY="http://${JS_NAME}-prefill-0-0.${JS_NAME}:10000"
                      PREFILL="http://${JS_NAME}-prefill-0-0.${JS_NAME}:8000"
                      DECODE="http://${JS_NAME}-decode-0-0.${JS_NAME}:7200"

                      # Wait on the two engines, not on the proxy. The proxy is
                      # up the moment its container starts, and toy_proxy_server
                      # only routes /v1/completions and /v1/chat/completions, so
                      # asking it for /v1/models gets a 404 forever no matter how
                      # healthy the backends are. Both replicas requantize MoE
                      # weights to fp4 before they serve, which took ~16 minutes
                      # on the Tier 1 host and ~20 at DP8.
                      for i in $(seq 1 240); do
                        pcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                                "$PREFILL/v1/models" || true)
                        dcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                                "$DECODE/v1/models" || true)
                        [ "$pcode" = "200" ] && [ "$dcode" = "200" ] && break
                        sleep 15
                      done
                      [ "$pcode" = "200" ] && [ "$dcode" = "200" ] || {
                        echo "RESULT: FAIL (engines never came up: prefill=$pcode decode=$dcode)"
                        exit 1
                      }

                      mkdir -p /workspace/vllm-torchtpu
                      # The image has no gcloud, so fetch through the JSON API
                      # with the node's own metadata-server token.
                      GCS_TOKEN=$(curl -sS -m 10 -H "Metadata-Flavor: Google" \
                        http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                        | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
                      GCS_PATH=${PR_TARBALL#gs://}
                      curl -sSf -m 300 -H "Authorization: Bearer $GCS_TOKEN" -o /tmp/pr684.tar.gz \
                        "https://storage.googleapis.com/storage/v1/b/${GCS_PATH%%/*}/o/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${GCS_PATH#*/}")?alt=media"
                      tar -xzf /tmp/pr684.tar.gz -C /workspace/vllm-torchtpu
                      cd /workspace/vllm-torchtpu/examples/disagg

                      # T1.1 and T1.2. Lengths straddle the SWA page boundary:
                      # at page_tokens 128 and window 128 the trim skips
                      # max(0, n-127)//128 pages, so 0 at 127/128/129 and 63 of
                      # 64 at 8192.
                      python3 dsv4_pd_oracle.py \
                        --base "$PROXY" \
                        --model deepseek-ai/DeepSeek-V4-Flash \
                        --window 128 \
                        --lengths 127,128,129,512,2048,4096,8192 \
                        --repeats 2 \
                        --out "$CDK_OUTPUT_DIR/oracle.json" \
                        2>&1 | tee "$CDK_OUTPUT_DIR/oracle.log"
                      ORACLE_RC=${PIPESTATUS[0]}

                      # The guard regression, which cannot go through the proxy.
                      # The proxy pins the prefill leg to max_tokens=1, and that
                      # clamp is exactly what stops the producer running past the
                      # handoff token, so nothing sent through it reaches the
                      # recycled-page path. Go straight at the producer: a
                      # 114-token prompt at max_tokens=48 is what took the DP4/DP4
                      # prefill engine down before the guard existed.
                      PREFILL="http://${JS_NAME}-prefill-0-0.${JS_NAME}:8000"
                      python3 dsv4_pd_guard_probe.py --base "$PREFILL" \
                        2>&1 | tee "$CDK_OUTPUT_DIR/guard_probe.log"
                      GUARD_RC=${PIPESTATUS[0]}

                      # The oracle again, after the probe. If the guard had let
                      # the send through, the producer would be gone by now and
                      # this second pass is what notices.
                      python3 dsv4_pd_oracle.py \
                        --base "$PROXY" \
                        --model deepseek-ai/DeepSeek-V4-Flash \
                        --window 128 \
                        --lengths 127,512,2048 \
                        --repeats 1 \
                        --out "$CDK_OUTPUT_DIR/oracle_after.json" \
                        2>&1 | tee "$CDK_OUTPUT_DIR/oracle_after.log"
                      AFTER_RC=${PIPESTATUS[0]}

                      if [ "$ORACLE_RC" != "0" ]; then
                        echo "RESULT: FAIL (oracle had misses; see oracle.json)"
                        exit 1
                      elif [ "$GUARD_RC" != "0" ]; then
                        echo "RESULT: FAIL (the guard probe killed the producer)"
                        exit 1
                      elif [ "$AFTER_RC" != "0" ]; then
                        echo "RESULT: FAIL (P/D broken after the guard probe)"
                        exit 1
                      else
                        echo "RESULT: PASS"
                      fi
                  env:
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: PR_TARBALL
                      value: "{{ .PR_TARBALL | default `gs://alynie-k3-scratch/repos/vllm-torchtpu/prs/pr684.tar.gz` }}"
                  resources:
                    requests: { cpu: "4", memory: "8Gi" }
                    limits: { cpu: "8", memory: "16Gi" }
