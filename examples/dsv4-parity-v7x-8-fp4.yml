apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-parity-v7x-8-fp4
  namespace: cloud-devkit-jobs
  labels:
    kueue.x-k8s.io/queue-name: lq-patemotter-google-com
spec:
  backoffLimit: 0
  template:
    spec:
      volumes:
      - name: nfs-root-volume
        nfs:
          server: 172.30.171.18
          path: /workspace
      - name: local-ssd-volume
        emptyDir:
          sizeLimit: 100Gi
      containers:
      - name: parity-runner
        image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-patemotter_google_com:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=== Cleaning Up Local SSD caches ==="
          rm -rf /mnt/local-cache/dsv4-flash-4layer-fp4/*
          rm -rf /mnt/local-cache/parity_run/*
          echo "=== Copying metadata to Local SSD ==="
          mkdir -p /mnt/local-cache/dsv4-flash-4layer-fp4
          mkdir -p /mnt/local-cache/parity_run
          cp /root/cloud-devkit/torchtpu-vllm/examples/dsv4-flash-4layer-fp4/*.json /mnt/local-cache/dsv4-flash-4layer-fp4/
          echo "=== Generating Mock FP4 Weights on Local SSD ==="
          MOCK_WEIGHTS_DIR=/mnt/local-cache/dsv4-flash-4layer-fp4 python3 /root/cloud-devkit/torchtpu-vllm/examples/generate_mock_weights.py
          
          echo "=== Temporarily Disabling Quantization for CPU reference ==="
          python3 -c "import json; d=json.load(open('/mnt/local-cache/dsv4-flash-4layer-fp4/config.json')); d.pop('quantization_config', None); json.dump(d, open('/mnt/local-cache/dsv4-flash-4layer-fp4/config.json', 'w'))"
          
          echo "=== Running STEP 1: CPU Golden Reference ==="
          MOCK_MODEL_DIR=/mnt/local-cache/dsv4-flash-4layer-fp4 PYTHONPATH=/root/cloud-devkit/torchtpu-vllm/src python3 -u /root/cloud-devkit/torchtpu-vllm/examples/verify_pipeline_parity.py --step 1
          
          echo "=== Restoring Quantization for TPU patched run ==="
          cp /root/cloud-devkit/torchtpu-vllm/examples/dsv4-flash-4layer-fp4/config.json /mnt/local-cache/dsv4-flash-4layer-fp4/config.json
          
          echo "=== Running STEP 2: TPU Patched (JAX Custom Ops) ==="
          MOCK_MODEL_DIR=/mnt/local-cache/dsv4-flash-4layer-fp4 PYTHONPATH=/root/cloud-devkit/torchtpu-vllm/src python3 -u /root/cloud-devkit/torchtpu-vllm/examples/verify_pipeline_parity.py --step 2
          
          echo "=== Running STEP 3: Parity Comparison ==="
          PYTHONPATH=/root/cloud-devkit/torchtpu-vllm/src python3 -u /root/cloud-devkit/torchtpu-vllm/examples/verify_pipeline_parity.py --step 3
        env:
        - name: PYTHONPATH
          value: /root/cloud-devkit/torchtpu-vllm/src
        resources:
          limits:
            google.com/tpu: "4"
            memory: 200Gi
            cpu: "90"
          requests:
            google.com/tpu: "4"
            memory: 128Gi
            cpu: "90"
        volumeMounts:
        - name: nfs-root-volume
          mountPath: /mnt/workspace
        - name: nfs-root-volume
          mountPath: /root/cloud-devkit/torchtpu-vllm
          subPath: torchtpu-vllm
        - name: local-ssd-volume
          mountPath: /mnt/local-cache
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
