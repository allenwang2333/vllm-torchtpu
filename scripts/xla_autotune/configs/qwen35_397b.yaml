# Qwen 3.5 397B FP8 Autotune Configuration
# Migrated from tpu-inference/.buildkite/xla_autotune/vllm_test_framework.py

model:
  name: "Qwen/Qwen3.5-397B-A17B-FP8"
  port: 8000
  health_endpoint: "/health"
  startup_timeout_s: 7200
  base_libtpu_init_args: ""
  server_env:
    MODEL_IMPL_TYPE: "vllm"
    USE_MOE_EP_KERNEL: "0"
    ATTN_BUCKETIZED_NUM_REQS: "true"
    ATTN_CUSTOM_NUM_REQS_BUCKETS: "8,16,32,64"
    NEW_MODEL_DESIGN: "1"
    VLLM_XLA_CHECK_RECOMPILATION: "0"
  serve_args:
    - "--tensor-parallel-size=8"
    - "--max-model-len=9216"
    - "--max-num-batched-tokens=1024"
    - "--max-num-seqs=64"
    - "--gpu-memory-utilization=0.9"
    - "--no-enable-prefix-caching"
    - "--async-scheduling"
    - "--language-model-only"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser=qwen3_coder"
    - "--reasoning-parser=qwen3"
    - '--limit-mm-per-prompt={"image": 0, "video": 0}'
    - "--kv-cache-dtype=fp8"
    - "--enable-expert-parallel"
    - '--additional_config={"sharding": {"sharding_strategy": {"enable_dp_attention": true}}}'
    - "--mamba-ssm-cache-dtype=bfloat16"

benchmark:
  type: "vllm_bench_serve"
  target_metric: "total_token_throughput"
  warmup_runs: 1
  args:
    dataset_name: "random"
    backend: "vllm"
    random_input_len: 8192
    random_output_len: 1024
    num_prompts: 640
    max_concurrency: 512
    random_range_ratio: 0.8
    ignore_eos: true
