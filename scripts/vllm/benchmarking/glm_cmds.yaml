serverCmd:
  "vllm serve zai-org/GLM-5.2-FP8  --tensor-parallel-size 16 --kv-cache-dtype fp8 --tool-call-parser glm47 --enable-auto-tool-choice --reasoning-parser glm45 --safetensors-load-strategy=prefetch --max_model_len=32768 --enable_expert_parallel"
benchCmd:
  "lm_eval --model local-chat-completions   --model_args base_url=http://localhost:8000/v1/chat/completions,model=$MODEL_NAME,max_gen_toks=30000,max_length=32768,num_concurrent=32,timeout=7200   --apply_chat_template   --tasks $TASK_NAME   --seed 42 --limit 100"